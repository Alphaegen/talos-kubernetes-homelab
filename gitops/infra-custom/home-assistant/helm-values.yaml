controller:
  type: StatefulSet
image:
  tag: ""
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
env:
  - name: TZ
    value: Europe/Amsterdam
service:
  type: ClusterIP
  port: 8080
startupProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
initContainers:
  - name: init-hacs
    image: docker.io/library/python:3.14.2-alpine3.23
    command: ["python", "-c"]
    args:
      - |
        import hashlib
        import json
        import pathlib
        import shutil
        import urllib.request
        import zipfile

        version = "2.0.5"
        expected_sha256 = "97be6b824a4f38e683728cc6dd72367f6b8bad0a43428b1b3b987a3087adf413"
        hacs_dir = pathlib.Path("/config/custom_components/hacs")
        manifest = hacs_dir / "manifest.json"

        if manifest.exists() and json.loads(manifest.read_text()).get("version") == version:
            raise SystemExit(0)

        archive = pathlib.Path("/tmp/hacs.zip")
        urllib.request.urlretrieve(
            f"https://github.com/hacs/integration/releases/download/{version}/hacs.zip",
            archive,
        )
        if hashlib.sha256(archive.read_bytes()).hexdigest() != expected_sha256:
            raise RuntimeError("HACS archive checksum mismatch")

        shutil.rmtree(hacs_dir, ignore_errors=True)
        hacs_dir.mkdir(parents=True)
        with zipfile.ZipFile(archive) as release:
            release.extractall(hacs_dir)
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
      - mountPath: /config
        name: home-assistant
configuration:
  enabled: true
  forceInit: true
  trusted_proxies:
    - 10.244.0.0/16
  templateConfig: |-
    # Loads default set of integrations. Do not remove.
    default_config:

    homeassistant:
      packages: !include_dir_named packages

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.244.0.0/16

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-dns
  hosts:
    - host: home-assistant.homelab.niekvlam.nl
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - home-assistant.homelab.niekvlam.nl
      secretName: home-assistant-tls
persistence:
  enabled: true
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: "20Gi"
hostNetwork: false
dnsPolicy: ClusterFirst
serviceMonitor:
  # Home Assistant requires a long-lived bearer token for /api/prometheus.
  # Keep scraping disabled until that token is stored in a Kubernetes Secret.
  enabled: false
  scrapeInterval: "30s"
  labels:
    release: kube-prometheus-stack
additionalVolumes:
  - name: home-assistant-packages
    configMap:
      name: home-assistant-packages
additionalMounts:
  - mountPath: /config/packages
    name: home-assistant-packages
    readOnly: true
