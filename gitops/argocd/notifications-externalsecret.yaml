apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    # The notifications controller reads $<key> references from this Secret.
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
          app.kubernetes.io/part-of: argocd
  data:
    # Same ntfy topic and token as Alertmanager.
    - secretKey: ntfy-url
      remoteRef:
        key: alertmanager/NTFY_URL
    - secretKey: ntfy-token
      remoteRef:
        key: alertmanager/NTFY_TOKEN
