{{- define "app.kyverno" }}
name: kyverno
namespace: kyverno
# Optional platform add-on after monitoring CRDs.
wave: 1
project: platform
createNamespace: true
cascadeDelete: true
# Argo CD adds these because the chart has PreDelete hooks, which remove
# Kyverno's webhooks on uninstall; declaring them keeps the root app in sync.
finalizers:
  - pre-delete-finalizer.argocd.argoproj.io
  - pre-delete-finalizer.argocd.argoproj.io/cleanup
annotations:
  # Compare like the API server applies: the policies.kyverno.io CRDs render
  # empty metadata maps that the server drops, which a client-side diff
  # reports as drift on every refresh.
  argocd.argoproj.io/compare-options: ServerSideDiff=true
# The CRDs are too large for client-side apply's last-applied annotation.
syncOptions:
  - ServerSideApply=true
sources:
  - path: gitops/infra-custom/kyverno
  - repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    version: {{ .Values.security.kyverno.version | quote }}
    helm:
      releaseName: kyverno
      valueFiles:
        - $values/gitops/infra-custom/kyverno/upstream-values.yaml
{{ end }}
{{- if and .Values.security.enabled .Values.security.kyverno.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.kyverno" . | fromYaml)) }}
{{- end }}
