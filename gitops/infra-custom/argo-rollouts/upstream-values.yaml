# Values for the upstream chart of the argo-rollouts Application
# (gitops/infra-helm/templates/progressive-delivery/argo-rollouts-helm.yaml).

installCRDs: true

controller:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: "kube-prometheus-stack"

dashboard:
  enabled: false
