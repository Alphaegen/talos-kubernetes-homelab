{{- define "app.kubelet-serving-cert-approver" }}
name: kubelet-serving-cert-approver
namespace: kubelet-serving-cert-approver
# Kubelets need signed serving certs before metrics-server can scrape them.
wave: 0
project: platform
cascadeDelete: true
sources:
  - path: gitops/infra-custom/kubelet-serving-cert-approver
{{ end }}
{{- if .Values.kubeletServingCertApprover.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.kubelet-serving-cert-approver" . | fromYaml)) }}
{{- end }}
