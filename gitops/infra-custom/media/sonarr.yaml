apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
  labels:
    app.kubernetes.io/name: sonarr
    homelab.niekvlam.nl/base: linuxserver
spec:
  selector: { matchLabels: { app: sonarr } }
  template:
    metadata:
      labels: { app: sonarr, app.kubernetes.io/name: sonarr }
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # Native sidecar: clears indexer backoff once the indexer works again
        # (see indexer-backoff-reset.yaml).
        - name: indexer-backoff-reset
          image: docker.io/curlimages/curl:8.23.0
          restartPolicy: Always
          command: ["/bin/sh", "/scripts/reset.sh"]
          env:
            - { name: APP_PORT, value: "8989" }
            - { name: API_VERSION, value: v3 }
            - { name: INTERVAL_SECONDS, value: "900" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - { name: config, mountPath: /app-config, readOnly: true }
            - { name: indexer-backoff-reset, mountPath: /scripts, readOnly: true }
      containers:
        - name: sonarr
          # Develop (beta) branch, v5. Its database migration is one-way: going
          # back to v4 means restoring the config volume from a backup.
          image: lscr.io/linuxserver/sonarr:develop-5.0.0.2997-ls210
          resources:
            requests:
              cpu: 50m
              memory: 400Mi
            limits:
              cpu: "1"
              memory: 800Mi
          ports: [{ name: http, containerPort: 8989 }]
          env:
            - { name: TZ, value: "Europe/Amsterdam" }
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: media-shared } }
        - { name: config, persistentVolumeClaim: { claimName: sonarr-config } }
        - name: indexer-backoff-reset
          configMap: { name: indexer-backoff-reset }
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
spec:
  selector: { app: sonarr }
  ports:
    - { name: http, port: 8989, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames: ["sonarr.homelab.niekvlam.nl"]
  rules:
    # 0s disables Envoy's default 15s route timeout; interactive searches can take longer.
    - timeouts: { request: 0s }
      matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: sonarr, port: 8989 }
