{{- range .Values.l2Advertisements }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Values.namespace | default "metallb-system" | quote }}
spec:
  ipAddressPools:
  {{- range .ipAddressPools }}
    - {{ . | quote }}
  {{- end }}
  {{- with .nodeSelectors }}
  nodeSelectors:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
