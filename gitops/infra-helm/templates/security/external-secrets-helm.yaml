{{- define "app.external-secrets" }}
name: external-secrets
namespace: external-secrets
# The operator, its stores, and ExternalSecret prerequisites are kept
# together so CRDs and their resources converge in one sync.
wave: 0
project: platform
createNamespace: true
syncOptions:
  - ServerSideApply=true
sources:
  - repoURL: https://charts.external-secrets.io
    chart: external-secrets
    version: {{ .Values.security.eso.version | quote }}
    helm:
      releaseName: external-secrets
      valueFiles:
        - $values/gitops/infra-custom/external-secrets/upstream-values.yaml
  {{- if .Values.security.eso.bootstrap }}
  - path: gitops/infra-custom/external-secrets
    helm:
      releaseName: external-secrets-bootstrap
      valueFiles:
        - values.yaml
      # Wiring flags keep External Secrets as the credential owner while
      # preventing credentials for services that are not deployed.
      values: |
        integrations:
          certManager:
            enabled: {{ .Values.certmanager.enabled }}
          tailscale:
            enabled: {{ and .Values.security.enabled .Values.security.tailscale.enabled }}
  {{- end }}
{{ end }}
{{- if and .Values.security.enabled .Values.security.eso.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.external-secrets" . | fromYaml)) }}
{{- end }}
