{{- define "app.argo-rollouts" }}
name: argo-rollouts
namespace: argo-rollouts
# CRD/API provider for rollout workloads.
wave: 0
project: platform
createNamespace: true
cascadeDelete: true
sources:
  - repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    version: {{ .Values.progressiveDelivery.argoRollouts.version | quote }}
    helm:
      releaseName: argo-rollouts
      valueFiles:
        - $values/gitops/infra-custom/argo-rollouts/upstream-values.yaml
{{ end }}
{{- if and .Values.progressiveDelivery.enabled .Values.progressiveDelivery.argoRollouts.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.argo-rollouts" . | fromYaml)) }}
{{- end }}
