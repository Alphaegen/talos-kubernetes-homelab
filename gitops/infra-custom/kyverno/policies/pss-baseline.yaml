# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/policies.kyverno.io/validatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pss-baseline
  annotations:
    policies.kyverno.io/title: Pod Security Standards (baseline)
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/description: >-
      The baseline Pod Security Standard, per workload. Namespace PSA labels
      enforce the same level, but only for whole namespaces; this policy
      reports each workload, also in namespaces that stay privileged.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: podSecurityContext
      expression: object.spec.?securityContext.orValue({})
  validations:
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) &&
        !object.spec.?hostPID.orValue(false) &&
        !object.spec.?hostIPC.orValue(false)
      message: Sharing the host network, PID or IPC namespace is not allowed.
    - expression: >-
        variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))
      messageExpression: >-
        'Privileged containers are not allowed: ' +
        variables.containers.filter(c, c.?securityContext.?privileged.orValue(false)).map(c, c.name).join(', ')
    - expression: >-
        variables.containers.all(c, c.?securityContext.?capabilities.?add.orValue([]).all(cap,
          cap in ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD',
                  'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']))
      message: Only the baseline capabilities may be added.
    - expression: >-
        object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
      message: hostPath volumes are not allowed.
    - expression: >-
        variables.containers.all(c, c.?ports.orValue([]).all(p, p.?hostPort.orValue(0) == 0))
      message: Host ports are not allowed.
    - expression: >-
        variables.podSecurityContext.?appArmorProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost'] &&
        variables.containers.all(c,
          c.?securityContext.?appArmorProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost'])
      message: The AppArmor profile may only be RuntimeDefault or Localhost.
    - expression: >-
        ([variables.podSecurityContext.?seLinuxOptions.orValue({})] +
          variables.containers.map(c, c.?securityContext.?seLinuxOptions.orValue({}))).all(o,
          o.?type.orValue('') in ['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t'] &&
          o.?user.orValue('') == '' && o.?role.orValue('') == '')
      message: Custom SELinux users, roles or types are not allowed.
    - expression: >-
        variables.containers.all(c, c.?securityContext.?procMount.orValue('Default') == 'Default')
      message: The /proc mount type must be Default.
    - expression: >-
        variables.podSecurityContext.?seccompProfile.?type.orValue('') != 'Unconfined' &&
        variables.containers.all(c, c.?securityContext.?seccompProfile.?type.orValue('') != 'Unconfined')
      message: The seccomp profile must not be Unconfined.
    - expression: >-
        variables.podSecurityContext.?sysctls.orValue([]).all(s, s.name in [
          'kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range', 'net.ipv4.ip_unprivileged_port_start',
          'net.ipv4.tcp_syncookies', 'net.ipv4.ping_group_range', 'net.ipv4.ip_local_reserved_ports',
          'net.ipv4.tcp_keepalive_time', 'net.ipv4.tcp_fin_timeout', 'net.ipv4.tcp_keepalive_intvl',
          'net.ipv4.tcp_keepalive_probes'])
      message: Only the safe sysctls are allowed.
