apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-livesync-credentials
  namespace: obsidian-livesync
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: obsidian-livesync-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  data:
    - secretKey: COUCHDB_USER
      remoteRef:
        key: obsidian-livesync/username
    - secretKey: COUCHDB_PASSWORD
      remoteRef:
        key: obsidian-livesync/password
