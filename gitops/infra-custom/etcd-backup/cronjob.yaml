apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
  namespace: etcd-backup
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/part-of: homelab
spec:
  # After the Longhorn backup-all RecurringJob (00:00) has had time to finish.
  schedule: "30 2 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
            app.kubernetes.io/part-of: homelab
        spec:
          # talosctl talks to the Talos API, not the Kubernetes API.
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 12022
            runAsGroup: 12022
            # Lets the non-root user read the Talos secret (NFS ignores fsGroup).
            fsGroup: 12022
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The talosctl image is distroless (scratch), so it only streams
            # the snapshot. It connects to the Talos-managed talos.default
            # Service (control-plane apid), writes <path>.part, checks the
            # snapshot's sha256 trailer, renames it and prints etcd snapshot
            # status; any failure exits non-zero and fails the Job.
            - name: snapshot
              # Keep in sync with talosctl in .tool-versions (Talos version in use).
              image: ghcr.io/siderolabs/talosctl:v1.13.10@sha256:3116f64c97ddffb53bd3c5bf87c8614d99f04df4326177dbbb7702b5087f0e4d
              imagePullPolicy: IfNotPresent
              args:
                - etcd
                - snapshot
                - /backup/.incoming-etcd.snapshot
              env:
                - name: TALOSCONFIG
                  value: /var/run/secrets/talos.dev/config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: snapshots
                  mountPath: /backup
          containers:
            - name: rotate
              image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  cd /backup
                  incoming=.incoming-etcd.snapshot
                  if [ ! -s "$incoming" ]; then
                    echo "ERROR: $incoming is missing or empty" >&2
                    exit 1
                  fi
                  name="etcd-$(date -u +%Y%m%dT%H%M%SZ).snapshot"
                  mv "$incoming" "$name"
                  sha256sum "$name" > "$name.sha256.tmp"
                  mv "$name.sha256.tmp" "$name.sha256"
                  sha256sum -c "$name.sha256"
                  echo "Saved $name ($(wc -c < "$name") bytes)"
                  # Timestamped names sort chronologically; keep the newest RETAIN.
                  ls -1 etcd-*.snapshot | sort -r | tail -n +"$((RETAIN + 1))" |
                    while read -r old; do
                      echo "Pruning $old"
                      rm -f "$old" "$old.sha256"
                    done
                  echo "Snapshots kept: $(ls -1 etcd-*.snapshot | wc -l)"
              env:
                - name: RETAIN
                  value: "14"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: snapshots
                  mountPath: /backup
          volumes:
            - name: talos-secrets
              secret:
                # Created and rotated by Talos from talos-serviceaccount.yaml.
                secretName: etcd-backup
                defaultMode: 0440
            - name: snapshots
              persistentVolumeClaim:
                claimName: etcd-backup-snapshots
