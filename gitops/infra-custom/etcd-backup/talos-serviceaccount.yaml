# Talos API access from Kubernetes. Talos watches this resource and creates a
# Secret with the same name in this namespace containing a short-lived,
# auto-renewed talosconfig limited to the os:etcd:backup role.
# Requires machine.features.kubernetesTalosAPIAccess in patches/controlplane.yaml
# (which also installs this CRD); no Talos credentials are stored in Git.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: etcd-backup
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/part-of: homelab
spec:
  roles:
    - os:etcd:backup
