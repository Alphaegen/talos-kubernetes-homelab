# Zigbee2MQTT bridges the SMLIGHT SLZB coordinator, reached over TCP on the
# home network, to Mosquitto. Every container runs non-root with a read-only
# root filesystem, so all writes go to the data volume or emptyDirs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
  namespace: home-automation
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "longhorn"
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
        app.kubernetes.io/name: zigbee2mqtt
    spec:
      # Keep MQTT and Zigbee running under memory pressure.
      priorityClassName: homelab-home-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Older files were written as root without group write; Always re-applies
        # group read/write on every start (the volume is small).
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-slzb
          image: busybox:1.38
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              until nc -z -w 2 192.168.30.232 6638; do
                echo "Waiting for SLZB coordinator at 192.168.30.232:6638..."
                sleep 5
              done
        - name: render-configuration
          image: busybox:1.38
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu

              if [ -s /app/data/configuration.yaml ]; then
                echo "Reconciling existing /app/data/configuration.yaml serial adapter settings."
                tmp_file="$(mktemp /app/data/configuration.yaml.XXXXXX)"
                awk \
                  -v serial_port="${SERIAL_PORT}" \
                  -v serial_adapter="${SERIAL_ADAPTER}" \
                  -v serial_baudrate="${SERIAL_BAUDRATE}" \
                  '
                  BEGIN {
                    in_serial=0
                    seen_serial=0
                    has_port=0
                    has_adapter=0
                    has_baudrate=0
                  }

                  /^serial:[[:space:]]*$/ {
                    seen_serial=1
                    in_serial=1
                    print
                    next
                  }

                  in_serial && /^[^[:space:]]/ {
                    if (!has_port) print "  port: \"" serial_port "\""
                    if (!has_adapter) print "  adapter: \"" serial_adapter "\""
                    if (!has_baudrate) print "  baudrate: " serial_baudrate
                    in_serial=0
                  }

                  in_serial && /^[[:space:]]+port:/ {
                    has_port=1
                    print "  port: \"" serial_port "\""
                    next
                  }

                  in_serial && /^[[:space:]]+adapter:/ {
                    has_adapter=1
                    print "  adapter: \"" serial_adapter "\""
                    next
                  }

                  in_serial && /^[[:space:]]+baudrate:/ {
                    has_baudrate=1
                    print "  baudrate: " serial_baudrate
                    next
                  }

                  { print }

                  END {
                    if (in_serial) {
                      if (!has_port) print "  port: \"" serial_port "\""
                      if (!has_adapter) print "  adapter: \"" serial_adapter "\""
                      if (!has_baudrate) print "  baudrate: " serial_baudrate
                    } else if (!seen_serial) {
                      print ""
                      print "serial:"
                      print "  port: \"" serial_port "\""
                      print "  adapter: \"" serial_adapter "\""
                      print "  baudrate: " serial_baudrate
                    }
                  }
                ' /app/data/configuration.yaml > "${tmp_file}"
                mv "${tmp_file}" /app/data/configuration.yaml
                echo "Reconciled /app/data/configuration.yaml."
                exit 0
              fi

              mqtt_server_escaped="$(printf '%s' "${MQTT_SERVER}" | sed 's/\\/\\\\/g; s/"/\\"/g')"
              mqtt_username_escaped="$(printf '%s' "${MQTT_USERNAME}" | sed 's/\\/\\\\/g; s/"/\\"/g')"
              mqtt_password_escaped="$(printf '%s' "${MQTT_PASSWORD}" | sed 's/\\/\\\\/g; s/"/\\"/g')"
              serial_port_escaped="$(printf '%s' "${SERIAL_PORT}" | sed 's/\\/\\\\/g; s/"/\\"/g')"
              serial_adapter_escaped="$(printf '%s' "${SERIAL_ADAPTER}" | sed 's/\\/\\\\/g; s/"/\\"/g')"

              cat > /app/data/configuration.yaml <<EOF
              homeassistant:
                enabled: true
              mqtt:
                base_topic: "zigbee2mqtt"
                server: "${mqtt_server_escaped}"
                user: "${mqtt_username_escaped}"
                password: "${mqtt_password_escaped}"
              serial:
                port: "${serial_port_escaped}"
                adapter: "${serial_adapter_escaped}"
                baudrate: ${SERIAL_BAUDRATE}
              frontend:
                enabled: true
                port: 8080
              advanced:
                log_level: "info"
              permit_join: false
              EOF
          env:
            - name: MQTT_SERVER
              value: "mqtt://mosquitto.home-automation.svc.cluster.local:1883"
            - name: SERIAL_PORT
              value: "tcp://192.168.30.232:6638"
            - name: SERIAL_ADAPTER
              value: "zstack"
            - name: SERIAL_BAUDRATE
              value: "115200"
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: password
          volumeMounts:
            - name: zigbee2mqtt-data
              mountPath: /app/data
      containers:
        - name: zigbee2mqtt
          image: "ghcr.io/koenkk/zigbee2mqtt:2.14.3"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 112Mi
          env:
            - name: TZ
              value: "Europe/Amsterdam"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: zigbee2mqtt-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: zigbee2mqtt-data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  type: ClusterIP
  selector:
    app: zigbee2mqtt
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "zigbee2mqtt.homelab.niekvlam.nl"
  rules:
    # 0s disables Envoy's default 15s route timeout, which would cut the
    # frontend's /api websocket.
    - timeouts:
        request: 0s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zigbee2mqtt
          port: 8080
