{{- if and .Values.security.enabled .Values.security.eso.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "external-secrets") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: external-secrets
  namespace: {{ .Values.cluster.namespace | quote }}
  annotations:
    # Stage 0: the operator, its stores, and ExternalSecret prerequisites are
    # kept together so CRDs and their resources converge in one sync.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: external-secrets
  syncPolicy:
    {{- if .Values.sync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - FailOnSharedResource=true
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: {{ .Values.security.eso.version | quote }}
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/gitops/infra-custom/external-secrets/upstream-values.yaml
    {{- if .Values.security.eso.bootstrap }}
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      path: gitops/infra-custom/external-secrets
      helm:
        releaseName: external-secrets-bootstrap
        valueFiles:
          - values.yaml
        # Wiring flags keep External Secrets as the credential owner while
        # preventing credentials for services that are not deployed.
        values: |
          integrations:
            certManager:
              enabled: {{ .Values.certmanager.enabled }}
            tailscale:
              enabled: {{ and .Values.security.enabled .Values.security.tailscale.enabled }}
    {{- end }}
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      ref: values
{{- end }}
