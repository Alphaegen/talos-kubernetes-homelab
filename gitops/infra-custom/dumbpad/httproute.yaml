apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dumbpad
  namespace: dumbpad
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: dumbpad
    app.kubernetes.io/part-of: dumbpad
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - pad.homelab.niekvlam.nl
  rules:
    # 0s disables Envoy's default 15s route timeout, which would cut the
    # WebSocket that carries live edits between devices.
    - timeouts:
        request: 0s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dumbpad
          port: 3000
