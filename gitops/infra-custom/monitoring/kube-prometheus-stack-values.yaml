grafana:
  enabled: false
  forceDeployDashboards: true
  defaultDashboardsEnabled: true
prometheus:
  enabled: true
  prometheusSpec:
    retention: 30d
    retentionSize: 20GiB
    walCompression: true
    scrapeInterval: 30s
    enableAdminAPI: false
    resources:
      requests: {cpu: 100m, memory: 1216Mi}
      limits: {memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 25Gi}
alertmanager:
  enabled: true
  alertmanagerSpec:
    # From 1Password via monitoring/alertmanager/externalsecret.yaml.
    secrets: [alertmanager-notifications]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 96Mi}
  # Chart 91.5.0 default config, with ntfy as the default receiver.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      # Per alert name, so a long-firing alert is not re-sent whenever an
      # unrelated alert in the same namespace starts or resolves.
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: ntfy
      routes:
        - receiver: 'null'
          matchers: ['alertname = "Watchdog"']
    receivers:
      - name: 'null'
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notifications/NTFY_URL
            send_resolved: true
            max_alerts: 5
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-notifications/NTFY_TOKEN
              # ntfy renders these inline Go templates (with Sprig) from the
              # webhook JSON. ntfy drops a message whose rendered title or body
              # exceeds 4 KiB, and Alertmanager does not retry a 400, so the
              # body is kept compact: no source URLs, summary and description
              # truncated. ntfy's built-in alertmanager template overflowed
              # with five kube-prometheus alerts. Header values cannot hold
              # newlines; "\n" inside a template string literal adds them.
              http_headers:
                X-Template: {values: ['yes']}
                X-Title:
                  values:
                    - '{{ if eq .status "firing" }}{{ "\U0001F6A8" }}{{ else }}{{ "\U00002705" }}{{ end }} {{ (index .alerts 0).labels.alertname }}{{ with .groupLabels.namespace }} - {{ . }}{{ end }}{{ $n := add (len .alerts) (.truncatedAlerts | default 0) }}{{ if gt $n 1 }} ({{ $n }}){{ end }}'
                X-Message:
                  values:
                    - '{{ range .alerts }}{{ if eq .status "resolved" }}RESOLVED{{ else }}{{ .labels.severity | default "none" | upper }}{{ end }}: {{ .annotations.summary | default .labels.alertname | trunc 160 }}{{ with .annotations.description }}{{ "\n" }}{{ . | trunc 280 }}{{ end }}{{ "\n\n" }}{{ end }}{{ with .truncatedAlerts }}...and {{ . }} more{{ end }}'
    templates:
      - '/etc/alertmanager/config/*.tmpl'
kubeStateMetrics: {enabled: true}
nodeExporter: {enabled: true}
# Requests from observed use (KRR, max + 15%); memory limit about 2x; no CPU limit.
prometheusOperator:
  resources:
    requests: {cpu: 15m, memory: 72Mi}
    limits: {memory: 144Mi}
  # Also used for the Prometheus and Alertmanager config-reloader sidecars.
  prometheusConfigReloader:
    resources:
      requests: {cpu: 5m, memory: 32Mi}
      limits: {memory: 96Mi}
  admissionWebhooks:
    patch:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 96Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 56Mi}
    limits: {memory: 120Mi}
prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}
  # Host namespaces and hostPath are covered by a PolicyException; the
  # container itself runs as nobody and needs no capabilities.
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
# Talos + Cilium: kube-proxy is replaced by Cilium, and Talos binds the
# controller-manager, scheduler and etcd metrics to localhost.
kubeProxy: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
additionalPrometheusRulesMap:
  trivy-operator:
    groups:
      - name: trivy-operator
        rules:
          # Reports only hold fixable HIGH/CRITICAL findings (ignoreUnfixed).
          # Fires once per image that gains a CRITICAL finding it did not have in the
          # previous week, then resolves after about 2h. Skipped for the first day
          # after install, when every finding is new.
          - alert: TrivyNewFixableCriticalVulnerability
            expr: |
              (
                sum by (namespace, image_registry, image_repository, image_tag) (trivy_image_vulnerabilities{severity="Critical"}) > 0
              )
              unless on (namespace, image_registry, image_repository, image_tag)
              (
                sum by (namespace, image_registry, image_repository, image_tag) (max_over_time(trivy_image_vulnerabilities{severity="Critical"}[7d] offset 2h)) > 0
              )
              and on () (count(trivy_image_vulnerabilities offset 1d) > 0)
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: New fixable CRITICAL vulnerability in {{ $labels.image_repository }}:{{ $labels.image_tag }}
              description: Trivy found {{ $value }} fixable CRITICAL vulnerabilities in {{ $labels.image_registry }}/{{ $labels.image_repository }}:{{ $labels.image_tag }} ({{ $labels.namespace }}). Check the Trivy Operator dashboard or the VulnerabilityReport.
