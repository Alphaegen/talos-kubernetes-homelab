apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: obsidian-livesync
  namespace: obsidian-livesync
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: obsidian-livesync
    app.kubernetes.io/part-of: obsidian-livesync
spec:
  serviceName: obsidian-livesync
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obsidian-livesync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obsidian-livesync
        app.kubernetes.io/part-of: obsidian-livesync
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-config
          # renovate: datasource=docker depName=couchdb
          image: couchdb:3.5.2.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - cp /config/10-livesync.ini /runtime-config/10-livesync.ini
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: runtime-config
              mountPath: /runtime-config
      containers:
        - name: couchdb
          # renovate: datasource=docker depName=couchdb
          image: couchdb:3.5.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5984
          envFrom:
            - secretRef:
                name: obsidian-livesync-credentials
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: runtime-config
              mountPath: /opt/couchdb/etc/local.d
            - name: runtime-log
              mountPath: /opt/couchdb/var/log
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: obsidian-livesync-data
        - name: config
          configMap:
            name: obsidian-livesync-config
        - name: runtime-config
          emptyDir: {}
        - name: runtime-log
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
