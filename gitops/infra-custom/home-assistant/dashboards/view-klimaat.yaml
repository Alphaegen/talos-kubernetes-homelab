title: Klimaat
path: klimaat
icon: mdi:air-conditioner
type: sections
max_columns: 2
dense_section_placement: true
theme: Homelab
# No view badges: each room shows its own filter, and its heading shows when
# the night period is active.

sections:
  # One room per column: side by side on a tablet or laptop, stacked on a phone.
  - type: grid
    cards:
      - type: heading
        heading: Boven
        icon: mdi:stairs-up
        badges:
          - type: entity
            entity: binary_sensor.airco_boven_slaapperiode
            show_state: true
            color: indigo
            visibility:
              - condition: state
                entity: binary_sensor.airco_boven_slaapperiode
                state: "on"
      - type: vertical-stack
        grid_options:
          columns: full
        cards: !include airco-boven.yaml

  - type: grid
    cards:
      - type: heading
        heading: Beneden
        icon: mdi:stairs-down
        badges:
          - type: entity
            entity: binary_sensor.airco_beneden_slaapperiode
            show_state: true
            color: indigo
            visibility:
              - condition: state
                entity: binary_sensor.airco_beneden_slaapperiode
                state: "on"
      - type: vertical-stack
        grid_options:
          columns: full
        cards: !include airco-beneden.yaml

  - type: grid
    cards:
      - !include nav.yaml
