# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/appproject_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ include "infra.projectName" . }}
  namespace: {{ .Values.cluster.namespace }}
  annotations:
    # The root Application renders this project with the child Applications.
    # Reconcile it first so their project reference is valid on a fresh cluster.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  sourceRepos:
  - {{ .Values.cluster.repoURL | quote }}
  - https://aquasecurity.github.io/helm-charts
  - https://argoproj.github.io/argo-helm
  - https://bitnami.github.io/sealed-secrets/
  - https://charts.bitnami.com/bitnami
  - https://charts.external-secrets.io
  - https://charts.jetstack.io
  - https://charts.longhorn.io
  - https://charts.rook.io/release
  - https://grafana.github.io/helm-charts
  - https://helm.releases.hashicorp.com
  - http://pajikos.github.io/home-assistant-helm-chart/
  - https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
  - https://kyverno.github.io/kyverno
  - https://metallb.github.io/metallb
  - https://pkgs.tailscale.com/helmcharts
  - https://prometheus-community.github.io/helm-charts
  destinations:
  - namespace: '*'
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
