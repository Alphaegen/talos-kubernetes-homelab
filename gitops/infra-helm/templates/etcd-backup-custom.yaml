{{- define "app.etcd-backup" }}
name: etcd-backup
# The Kustomization owns the Namespace manifest.
namespace: etcd-backup
# Stateful NAS-backed job after bootstrap foundations. The talos.dev
# ServiceAccount CRD only exists once the control-plane Talos patch
# (kubernetesTalosAPIAccess) is applied.
wave: 2
project: platform
sources:
  - path: gitops/infra-custom/etcd-backup
{{ end }}
{{- if .Values.etcdBackup.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.etcd-backup" . | fromYaml)) }}
{{- end }}
