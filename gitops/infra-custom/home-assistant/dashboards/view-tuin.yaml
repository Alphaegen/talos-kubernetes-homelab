# Rain Bird from packages/rainbird.yaml, in two columns: what runs now, the
# zones to start by hand and the log; and the automatic schedule per zone. On
# a phone they stack in that order. Zones only start through the script, never
# through the raw switches, so they stay mutually exclusive and always get a
# duration the controller enforces.
title: Tuin
path: tuin
icon: mdi:sprinkler-variant
type: sections
max_columns: 2
dense_section_placement: true
theme: Homelab
# Only when they matter: rain stops the schedule for the day, a rain delay
# for days.
badges:
  - type: entity
    entity: binary_sensor.rain_bird_controller_rainsensor
    name: Regen gemeten
    show_name: true
    show_state: false
    icon: mdi:weather-pouring
    color: blue
    visibility:
      - condition: state
        entity: binary_sensor.rain_bird_controller_rainsensor
        state: "on"
  - type: entity
    entity: number.rain_bird_controller_rain_delay
    name: Regenpauze
    show_name: true
    icon: mdi:timer-pause-outline
    color: blue
    visibility:
      - condition: numeric_state
        entity: number.rain_bird_controller_rain_delay
        above: 0

sections:
  - type: grid
    cards:
      - type: heading
        heading: Sproeien
        icon: mdi:sprinkler-variant
      - !include tuin-nu.yaml
      - type: heading
        heading: Zone starten
        heading_style: subtitle
      # Tap a zone (or Start) for its pop-up with the duration and Start. The
      # state line says when it last ran, from sensor.rainbird_logboek.
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: switch.rain_bird_sprinkler_1
        name: Gras
        icon: mdi:grass
        show_state: true
        grid_options:
          columns: full
        tap_action: &zone-1
          action: navigate
          navigation_path: '#zone-1'
        button_action:
          tap_action: *zone-1
        sub_button:
          - name: Start
            icon: mdi:play
            show_name: true
            tap_action: *zone-1
        styles: &zone |
          .bubble-button-background {
            background-color: ${state === 'on' ? 'rgb(96, 165, 250)' : ''} !important;
            opacity: ${state === 'on' ? '1' : ''} !important;
          }
          .bubble-main-icon-container {
            background-color: ${state === 'on' ? 'rgba(255, 255, 255, 0.4)' : ''} !important;
          }
          .bubble-main-icon, .bubble-name, .bubble-state {
            color: ${state === 'on' ? '#0b1f3a' : ''} !important;
          }
          ${(() => {
            const runs = hass.states['sensor.rainbird_logboek']?.attributes.runs || [];
            const laatste = runs.find((r) => r.zone === entity && r.soort === 'beurt');
            let tekst = 'Nog niet gesproeid';
            if (state === 'on') tekst = 'Sproeit nu';
            else if (state === 'unavailable') tekst = 'Niet bereikbaar';
            else if (laatste) {
              const d = new Date(laatste.start);
              const verschil = Math.round(
                (new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
              const dag = verschil === 0 ? 'Vandaag' : verschil === 1 ? 'Gisteren'
                : d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
              const uur = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
              tekst = `${dag} ${uur} · ${Math.max(laatste.minuten, 1)} min`;
            }
            const el = card.querySelector('.bubble-state');
            if (el) el.innerText = tekst;
            return '';
          })()}
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: switch.rain_bird_sprinkler_2
        name: Achtertuin
        icon: mdi:flower
        show_state: true
        grid_options:
          columns: full
        tap_action: &zone-2
          action: navigate
          navigation_path: '#zone-2'
        button_action:
          tap_action: *zone-2
        sub_button:
          - name: Start
            icon: mdi:play
            show_name: true
            tap_action: *zone-2
        styles: *zone
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: switch.rain_bird_sprinkler_3
        name: Voortuin + zijkant
        icon: mdi:home-variant-outline
        show_state: true
        grid_options:
          columns: full
        tap_action: &zone-3
          action: navigate
          navigation_path: '#zone-3'
        button_action:
          tap_action: *zone-3
        sub_button:
          - name: Start
            icon: mdi:play
            show_name: true
            tap_action: *zone-3
        styles: *zone
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: switch.rain_bird_sprinkler_4
        name: Druppelslang
        icon: mdi:water-outline
        show_state: true
        grid_options:
          columns: full
        tap_action: &zone-4
          action: navigate
          navigation_path: '#zone-4'
        button_action:
          tap_action: *zone-4
        sub_button:
          - name: Start
            icon: mdi:play
            show_name: true
            tap_action: *zone-4
        styles: *zone

      - type: heading
        heading: Logboek
        icon: mdi:history
        tap_action: &logboek
          action: navigate
          navigation_path: '#logboek'
        badges:
          - type: entity
            entity: sensor.rainbird_logboek
            show_state: false
            icon: mdi:arrow-expand
            tap_action: *logboek
      # The last 8 entries of sensor.rainbird_logboek per day, with an icon
      # per kind; the last 50 and the full history (calendar.tuin) in the
      # pop-up.
      - type: markdown
        grid_options:
          columns: full
        content: |-
          {%- set aantal = 8 %}
          {%- set runs = state_attr('sensor.rainbird_logboek', 'runs') or [] %}
          {%- set dagen = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag',
                           'zaterdag', 'zondag'] %}
          {%- set maanden = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug',
                             'sep', 'okt', 'nov', 'dec'] %}
          {%- set iconen = {
               'beurt': 'mdi:water', 'overgeslagen': 'mdi:debug-step-over',
               'mislukt': 'mdi:alert-circle-outline', 'pauze': 'mdi:pause',
               'hervat': 'mdi:play', 'uit': 'mdi:calendar-remove',
               'aan': 'mdi:calendar-check'} %}
          {%- set ns = namespace(dag='') %}
          {%- for r in runs[:aantal] %}
          {%- set t = as_local(as_datetime(r.start)) %}
          {%- set d = (now().date() - t.date()).days %}
          {%- set dag = 'Vandaag' if d == 0 else 'Gisteren' if d == 1
                else dagen[t.weekday()] ~ ' ' ~ t.day ~ ' ' ~ maanden[t.month - 1] %}
          {%- set wat = r.wat if r.soort == 'beurt' else '*' ~ r.wat ~ '*' %}
          {%- set door = ' · ' ~ r.bron if r.bron and r.soort != 'overgeslagen' else '' %}
          {%- if dag != ns.dag %}
          {%- set ns.dag = dag %}

          **{{ dag }}**<br>
          {%- else %}<br>
          {%- endif %}
          <ha-icon icon="{{ iconen.get(r.soort, 'mdi:information-outline') }}"></ha-icon> {{ t.strftime('%H:%M') }} **{{ r.naam }}** · {{ wat }}{{ door }}
          {%- endfor %}
          {%- if runs %}
          {%- else %}
          Nog niets gesproeid. Ook beurten van de Rain Bird zelf of de app komen hier.
          {%- endif %}

  # The schedule: one switch for all of it, then a row per zone with its days
  # and times; tapping a zone opens its schedule (#schema-N) below.
  - type: grid
    cards:
      - type: heading
        heading: Automatisch sproeien
        icon: mdi:calendar-clock
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.rainbird_schema_actief
        name: Automatisch sproeien
        icon: mdi:calendar-clock
        show_state: true
        grid_options:
          columns: full
        # Light blue with dark text when on, as the other switches, with the
        # next run and its zone on the state line.
        styles: |
          .bubble-button-background {
            background-color: ${state === 'on' ? 'rgb(96, 165, 250)' : ''} !important;
            opacity: ${state === 'on' ? '1' : ''} !important;
          }
          .bubble-main-icon-container {
            background-color: ${state === 'on' ? 'rgba(255, 255, 255, 0.4)' : ''} !important;
          }
          .bubble-main-icon, .bubble-name, .bubble-state {
            color: ${state === 'on' ? '#0b1f3a' : ''} !important;
          }
          ${(() => {
            const v = hass.states['sensor.rainbird_volgende_beurt'];
            let tekst = 'Uit';
            if (state === 'on') {
              if (v && !['unknown', 'unavailable'].includes(v.state)) {
                const d = new Date(v.state);
                tekst = 'Aan · volgende: ' + d.toLocaleString('nl-NL',
                  { weekday: 'short', hour: '2-digit', minute: '2-digit' })
                  + (v.attributes.zone ? ` · ${v.attributes.zone}` : '');
              } else if ([1, 2, 3, 4].every((i) =>
                  hass.states[`input_boolean.rainbird_pauze_zone_${i}`]?.state === 'on')) {
                tekst = 'Aan · alle zones gepauzeerd';
              } else {
                tekst = 'Aan · tik op een zone voor dagen en tijden';
              }
            }
            const el = card.querySelector('.bubble-state');
            if (el) el.innerText = tekst;
            return '';
          })()}
      # A zone per row: its days, start times and minutes in one line, or
      # "Doet niet mee". The pause button skips the zone in the schedule (and
      # logs that) but keeps its days and times.
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.rainbird_pauze_zone_1
        name: Gras
        icon: mdi:grass
        show_state: true
        grid_options:
          columns: full
        tap_action: &schema-1
          action: navigate
          navigation_path: '#schema-1'
        button_action:
          tap_action: *schema-1
        sub_button:
          - entity: input_boolean.rainbird_pauze_zone_1
            icon: mdi:pause
            state_background: false
            tap_action:
              action: toggle
        styles: &schema |
          .bubble-main-icon-container, .bubble-name-container {
            opacity: var(--schema-dim, 1) !important;
          }
          .bubble-sub-button-1 {
            background-color: ${state === 'on' ? 'var(--warning-color)' : ''} !important;
            color: ${state === 'on' ? '#2b1a00' : ''} !important;
          }
          ${(() => {
            const nr = entity.match(/zone_(\d)/)?.[1];
            const st = (id) => hass.states[id]?.state;
            const dagen = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo']
              .filter((d) => st(`input_boolean.rainbird_zone_${nr}_${d}`) === 'on');
            const tijden = [1, 2]
              .map((t) => ({
                tijd: (st(`input_datetime.rainbird_zone_${nr}_tijd_${t}`) || '').slice(0, 5),
                min: parseInt(st(`input_number.rainbird_zone_${nr}_minuten_${t}`)) || 0,
              }))
              .filter((x) => x.min > 0 && /^\d\d:\d\d$/.test(x.tijd))
              .sort((a, b) => a.tijd.localeCompare(b.tijd));
            const mee = dagen.length > 0 && tijden.length > 0;
            let tekst = 'Doet niet mee';
            if (mee) {
              const d = dagen.length === 7 ? 'elke dag' : dagen.join(', ');
              const zelfde = tijden.every((x) => x.min === tijden[0].min);
              const t = zelfde
                ? `${tijden.map((x) => x.tijd).join(' en ')} · ${tijden[0].min} min`
                : tijden.map((x) => `${x.tijd} (${x.min} min)`).join(', ');
              tekst = `${d} · ${t}`;
            }
            if (state === 'on') tekst = `Gepauzeerd · ${tekst}`;
            card.style.setProperty('--schema-dim', mee && state !== 'on' ? '1' : '0.5');
            const el = card.querySelector('.bubble-state');
            if (el) el.innerText = tekst;
            return '';
          })()}
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.rainbird_pauze_zone_2
        name: Achtertuin
        icon: mdi:flower
        show_state: true
        grid_options:
          columns: full
        tap_action: &schema-2
          action: navigate
          navigation_path: '#schema-2'
        button_action:
          tap_action: *schema-2
        sub_button:
          - entity: input_boolean.rainbird_pauze_zone_2
            icon: mdi:pause
            state_background: false
            tap_action:
              action: toggle
        styles: *schema
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.rainbird_pauze_zone_3
        name: Voortuin + zijkant
        icon: mdi:home-variant-outline
        show_state: true
        grid_options:
          columns: full
        tap_action: &schema-3
          action: navigate
          navigation_path: '#schema-3'
        button_action:
          tap_action: *schema-3
        sub_button:
          - entity: input_boolean.rainbird_pauze_zone_3
            icon: mdi:pause
            state_background: false
            tap_action:
              action: toggle
        styles: *schema
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.rainbird_pauze_zone_4
        name: Druppelslang
        icon: mdi:water-outline
        show_state: true
        grid_options:
          columns: full
        tap_action: &schema-4
          action: navigate
          navigation_path: '#schema-4'
        button_action:
          tap_action: *schema-4
        sub_button:
          - entity: input_boolean.rainbird_pauze_zone_4
            icon: mdi:pause
            state_background: false
            tap_action:
              action: toggle
        styles: *schema
      - type: markdown
        text_only: true
        grid_options:
          columns: full
        content: >-
          Tik op een zone om zijn dagen en tijden te kiezen. Vallen twee beurten
          samen, dan wacht de ene tot de andere klaar is. Met
          <ha-icon icon="mdi:pause"></ha-icon> sla je een zone een tijdje over en
          blijven zijn dagen en tijden bewaard. Bij regen of een regenpauze gaat
          een beurt niet door.
      # The controller's own rain delay: no watering for this many days,
      # also not by its own programs.
      - type: tile
        entity: number.rain_bird_controller_rain_delay
        name: Regenpauze
        icon: mdi:timer-pause-outline
        color: blue
        grid_options:
          columns: full
        features_position: inline
        features:
          - type: numeric-input
            style: buttons

  # Pop-ups and navigation: they render as overlays, and the navigation bar
  # must be the last card of the view.
  - type: grid
    cards:
      # One per zone: what runs now, how long, and Start. The zone stops by
      # itself after the chosen time.
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#zone-1'
        button_type: name
        name: Gras
        icon: mdi:grass
        width_desktop: 480px
        cards:
          - !include tuin-nu.yaml
          - &duur
            type: tile
            entity: input_number.rainbird_duration
            name: Hoe lang?
            icon: mdi:timer-outline
            color: blue
            grid_options:
              columns: full
            features_position: bottom
            features:
              - type: numeric-input
                style: buttons
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Start
            icon: mdi:play
            grid_options:
              columns: full
            tap_action: &start-1
              action: perform-action
              perform_action: script.rainbird_start_single_zone
              data:
                zone_switch: switch.rain_bird_sprinkler_1
            button_action:
              tap_action: *start-1
            # Green, with the chosen minutes in the name.
            styles: &start |
              .bubble-button-background {
                background-color: var(--success-color) !important;
                opacity: 1 !important;
              }
              .bubble-main-icon-container {
                background-color: rgba(255, 255, 255, 0.35) !important;
              }
              .bubble-main-icon, .bubble-name {
                color: #fff !important;
              }
              ${(() => {
                const min = parseInt(hass.states['input_number.rainbird_duration']?.state) || 0;
                const el = card.querySelector('.bubble-name');
                if (el) el.innerText = `Start · ${min} min`;
                return '';
              })()}
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#zone-2'
        button_type: name
        name: Achtertuin
        icon: mdi:flower
        width_desktop: 480px
        cards:
          - !include tuin-nu.yaml
          - *duur
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Start
            icon: mdi:play
            grid_options:
              columns: full
            tap_action: &start-2
              action: perform-action
              perform_action: script.rainbird_start_single_zone
              data:
                zone_switch: switch.rain_bird_sprinkler_2
            button_action:
              tap_action: *start-2
            styles: *start
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#zone-3'
        button_type: name
        name: Voortuin + zijkant
        icon: mdi:home-variant-outline
        width_desktop: 480px
        cards:
          - !include tuin-nu.yaml
          - *duur
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Start
            icon: mdi:play
            grid_options:
              columns: full
            tap_action: &start-3
              action: perform-action
              perform_action: script.rainbird_start_single_zone
              data:
                zone_switch: switch.rain_bird_sprinkler_3
            button_action:
              tap_action: *start-3
            styles: *start
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#zone-4'
        button_type: name
        name: Druppelslang
        icon: mdi:water-outline
        width_desktop: 480px
        cards:
          - !include tuin-nu.yaml
          - *duur
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Start
            icon: mdi:play
            grid_options:
              columns: full
            tap_action: &start-4
              action: perform-action
              perform_action: script.rainbird_start_single_zone
              data:
                zone_switch: switch.rain_bird_sprinkler_4
            button_action:
              tap_action: *start-4
            styles: *start
      # One per zone: its days and two start times, each with its own
      # minutes (0 = that time does not take part), and Pauze.
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#schema-1'
        button_type: name
        name: Schema Gras
        icon: mdi:grass
        width_desktop: 480px
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Dagen
            icon: mdi:calendar
          - type: custom:bubble-card
            card_type: sub-buttons
            grid_options:
              columns: full
            sub_button:
              bottom:
                - &dag
                  entity: input_boolean.rainbird_zone_1_ma
                  name: ma
                  show_name: true
                  show_icon: false
                  tap_action:
                    action: toggle
                - <<: *dag
                  entity: input_boolean.rainbird_zone_1_di
                  name: di
                - <<: *dag
                  entity: input_boolean.rainbird_zone_1_wo
                  name: wo
                - <<: *dag
                  entity: input_boolean.rainbird_zone_1_do
                  name: do
                - <<: *dag
                  entity: input_boolean.rainbird_zone_1_vr
                  name: vr
                - <<: *dag
                  entity: input_boolean.rainbird_zone_1_za
                  name: za
                - <<: *dag
                  entity: input_boolean.rainbird_zone_1_zo
                  name: zo
          - type: custom:bubble-card
            card_type: separator
            name: Tijden
            icon: mdi:clock-outline
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: input_datetime.rainbird_zone_1_tijd_1
            name: Tijd 1
            icon: mdi:clock-outline
            show_state: true
            grid_options:
              columns: full
            tap_action:
              action: more-info
            button_action:
              tap_action:
                action: more-info
            sub_button:
              - icon: mdi:minus
                tap_action:
                  action: perform-action
                  perform_action: input_number.decrement
                  target:
                    entity_id: input_number.rainbird_zone_1_minuten_1
              - icon: mdi:plus
                tap_action:
                  action: perform-action
                  perform_action: input_number.increment
                  target:
                    entity_id: input_number.rainbird_zone_1_minuten_1
            # The time as the name (tap to change it), the minutes below.
            styles: &tijd |
              .bubble-main-icon-container, .bubble-name-container {
                opacity: var(--tijd-dim, 1) !important;
              }
              ${(() => {
                const s = hass.states[entity];
                const min = parseInt(hass.states[entity
                  .replace('input_datetime.', 'input_number.')
                  .replace('_tijd_', '_minuten_')]?.state) || 0;
                card.style.setProperty('--tijd-dim', min > 0 ? '1' : '0.5');
                const naam = card.querySelector('.bubble-name');
                if (naam && s) naam.innerText = `Om ${s.state.slice(0, 5)}`;
                const el = card.querySelector('.bubble-state');
                if (el) el.innerText = min > 0 ? `${min} min sproeien` : 'Uit · zet minuten met +';
                return '';
              })()}
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: input_datetime.rainbird_zone_1_tijd_2
            name: Tijd 2
            icon: mdi:clock-outline
            show_state: true
            grid_options:
              columns: full
            tap_action:
              action: more-info
            button_action:
              tap_action:
                action: more-info
            sub_button:
              - icon: mdi:minus
                tap_action:
                  action: perform-action
                  perform_action: input_number.decrement
                  target:
                    entity_id: input_number.rainbird_zone_1_minuten_2
              - icon: mdi:plus
                tap_action:
                  action: perform-action
                  perform_action: input_number.increment
                  target:
                    entity_id: input_number.rainbird_zone_1_minuten_2
            styles: *tijd
          - &pauze-tekst
            type: custom:bubble-card
            card_type: separator
            name: Pauze
            icon: mdi:pause
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: input_boolean.rainbird_pauze_zone_1
            name: Zone overslaan
            icon: mdi:pause
            show_state: true
            grid_options:
              columns: full
            # Orange when paused.
            styles: &pauze |
              .bubble-button-background {
                background-color: ${state === 'on' ? 'var(--warning-color)' : ''} !important;
                opacity: ${state === 'on' ? '1' : ''} !important;
              }
              .bubble-main-icon, .bubble-name, .bubble-state {
                color: ${state === 'on' ? '#2b1a00' : ''} !important;
              }
              ${(() => {
                const el = card.querySelector('.bubble-state');
                if (el) el.innerText = state === 'on'
                  ? 'Gepauzeerd: het schema slaat deze zone over'
                  : 'Uit: de zone doet mee';
                return '';
              })()}
          - &schema-uitleg
            type: markdown
            text_only: true
            content: >-
              Tik op een tijd om hem te wijzigen. Met − en + kies je hoe lang de
              zone dan sproeit; op 0 doet die tijd niet mee.
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#schema-2'
        button_type: name
        name: Schema Achtertuin
        icon: mdi:flower
