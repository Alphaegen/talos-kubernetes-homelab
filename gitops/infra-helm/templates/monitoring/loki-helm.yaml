# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
{{- if .Values.monitoring.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "loki") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: loki
  namespace: {{ .Values.cluster.namespace | quote }}
  annotations:
    # Stage 1: monitoring service after storage and namespace foundations.
    argocd.argoproj.io/sync-wave: "1"
    app.kubernetes.io/part-of: monitoring
    {{- if .Values.notifications }}
    {{ toYaml .Values.notifications | indent 4 }}
    {{- end }}
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: monitoring
  syncPolicy:
    {{- include "infra.syncPolicy" . | nindent 4 }}
    syncOptions:
      - FailOnSharedResource=true
      # kube-prometheus-stack is the sole owner/creator of monitoring namespace metadata.
      - CreateNamespace=false
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: {{ .Values.monitoring.loki.version | quote }}
      helm:
        releaseName: loki
        valueFiles:
          - $values/gitops/infra-custom/monitoring/loki-values.yaml
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      ref: values
{{- end }}
