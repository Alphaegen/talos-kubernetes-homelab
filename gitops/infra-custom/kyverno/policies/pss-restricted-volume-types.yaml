# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/policies.kyverno.io/validatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pss-restricted-volume-types
  annotations:
    policies.kyverno.io/title: Restrict volume types
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/description: >-
      Pods may only use configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected and secret volumes.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: disallowed
      expression: >-
        object.spec.?volumes.orValue([]).filter(v, !v.all(k, k in ['name', 'configMap', 'csi', 'downwardAPI',
          'emptyDir', 'ephemeral', 'persistentVolumeClaim', 'projected', 'secret']))
  validations:
    - expression: size(variables.disallowed) == 0
      messageExpression: >-
        'Only restricted volume types are allowed; change: ' +
        variables.disallowed.map(v, v.name).join(', ')
