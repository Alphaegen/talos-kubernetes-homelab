{{- if and .Values.security.enabled .Values.security.trivy.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "trivy-operator") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: trivy-operator
  namespace: {{ .Values.cluster.namespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Stage 1: optional platform add-on after monitoring CRDs.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: {{ include "infra.platformProject" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: trivy-system
  syncPolicy:
    {{- include "infra.syncPolicy" . | nindent 4 }}
    syncOptions:
      - FailOnSharedResource=true
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
  source:
    repoURL: https://aquasecurity.github.io/helm-charts
    chart: trivy-operator
    targetRevision: {{ .Values.security.trivy.version | quote }}
    helm:
      releaseName: trivy-operator
      values: |
        operator:
          # Download the vulnerability DB once in trivy-server instead of in every scan job.
          builtInTrivyServer: true
          # Finished jobs count toward this limit, so leave scanJobTTL unset and let
          # the operator delete each job as soon as it has read the result.
          scanJobsConcurrentLimit: 1
          vulnerabilityScannerScanOnlyCurrentRevisions: true
          # One series per CVE is too much cardinality for this cluster.
          metricsVulnIdEnabled: false
          # SBOMs are produced in CI instead; keep large reports out of etcd.
          sbomGenerationEnabled: false
          # node-collector needs hostPath mounts; Talos hosts are read-only and not CIS-shaped.
          infraAssessmentScannerEnabled: false

        compliance:
          specs:
            - k8s-nsa-1.0
            - k8s-pss-baseline-0.1
            - k8s-pss-restricted-0.1

        trivyOperator:
          scanJobPodPriorityClassName: homelab-best-effort

        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            memory: 512Mi

        trivy:
          ignoreUnfixed: true
          severity: "HIGH,CRITICAL"
          timeout: 5m
          # The DB is a cache; re-downloaded on restart instead of living on Longhorn.
          storageClassEnabled: false
          priorityClassName: homelab-best-effort
          # Scan job containers.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: null
              memory: 1Gi
          server:
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: null
                memory: 1Gi
        serviceMonitor:
          enabled: true
          labels:
            release: {{ .Values.security.trivy.serviceMonitorLabel }}
          interval: 30s
{{- end }}
