{{- define "app.loki" }}
name: loki
# kube-prometheus-stack is the sole owner/creator of monitoring namespace metadata.
namespace: monitoring
# Monitoring service after storage and namespace foundations.
wave: 1
project: platform
partOf: monitoring
sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: loki
    version: {{ .Values.monitoring.loki.version | quote }}
    helm:
      releaseName: loki
      valueFiles:
        - $values/gitops/infra-custom/monitoring/loki-values.yaml
{{ end }}
{{- if .Values.monitoring.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.loki" . | fromYaml)) }}
{{- end }}
