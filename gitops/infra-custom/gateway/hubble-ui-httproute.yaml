apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  # Hubble UI is deployed by the manually applied Cilium chart, so its route
  # lives with the Gateway instead of in cilium/cilium-values.yaml.
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames: ["hubble.homelab.niekvlam.nl"]
  rules:
    # 0s disables Envoy's default 15s route timeout, which would cut the
    # gRPC-web flow stream.
    - timeouts: { request: 0s }
      matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: hubble-ui, port: 80 }
