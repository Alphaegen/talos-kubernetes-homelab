apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
spec:
  # Server defaults are explicit because this app's ServerSideApply diff shows them.
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - home-assistant.homelab.niekvlam.nl
  rules:
    # 0s disables Envoy's default 15s route timeout, which would cut the
    # /api/websocket connection. The chart's httpRoute cannot set timeouts.
    - timeouts:
        request: 0s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: home-assistant
          port: 8080
          weight: 1
