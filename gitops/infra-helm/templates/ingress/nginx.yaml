# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
{{- if and .Values.ingressController.enabled (eq .Values.ingressController.class "nginx") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "nginx") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: nginx
  namespace: {{ .Values.cluster.namespace | quote }}
  annotations:
    # Stage 0: cluster ingress foundation.
    argocd.argoproj.io/sync-wave: "0"
    app.kubernetes.io/part-of: ingress-nginx
    {{- if .Values.notifications }}
    {{ toYaml .Values.notifications | indent 4 }}
    {{- end }}
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: ingress-nginx
  syncPolicy:
    {{- if .Values.sync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - FailOnSharedResource=true
      - CreateNamespace=true
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: {{ .Values.ingressController.version | quote }}
      helm:
        version: v3
        releaseName: nginx
        valueFiles:
          - $values/gitops/infra-custom/ingress-nginx/values.yaml
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      ref: values
{{- end }}
