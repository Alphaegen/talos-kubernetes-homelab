{{- define "app.home-assistant" }}
name: home-assistant
partOf: smarthome
namespace: home-assistant
# Workload; its PVC depends on the wave-0 Longhorn provider.
wave: 2
project: apps
createNamespace: true
namespaceLabels:
  # No host access: Zigbee goes through the network coordinator, not USB.
  pod-security.kubernetes.io/enforce: baseline
  pod-security.kubernetes.io/warn: restricted
  pod-security.kubernetes.io/audit: restricted
syncOptions:
  - ServerSideApply=true
ignoreDifferences:
  - group: apps
    kind: StatefulSet
    name: home-assistant
    jqPathExpressions:
      - .spec.volumeClaimTemplates[]?.apiVersion
      - .spec.volumeClaimTemplates[]?.kind
      - .spec.volumeClaimTemplates[]?.status
      - .spec.volumeClaimTemplates[]?.spec.volumeMode
sources:
  - repoURL: http://pajikos.github.io/home-assistant-helm-chart/
    chart: home-assistant
    version: {{ .Values.homeassistant.version | quote }}
    helm:
      releaseName: home-assistant
      valueFiles:
        - $values/gitops/infra-custom/home-assistant/helm-values.yaml
  - path: gitops/infra-custom/home-assistant
{{ end }}
{{- if .Values.homeassistant.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.home-assistant" . | fromYaml)) }}
{{- end }}
