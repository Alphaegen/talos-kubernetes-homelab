# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
{{ if .Values.certmanager.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "cert-manager-helm") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: cert-manager
  namespace: {{ .Values.cluster.namespace | quote }}
  annotations:
    # Stage 0: API providers and other bootstrap foundations.
    argocd.argoproj.io/sync-wave: "0"
    app.kubernetes.io/part-of: cert-manager
    {{- if .Values.notifications }}
    {{ toYaml .Values.notifications | indent 4 }}
    {{- end }}
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: cert-manager
  syncPolicy:
    {{- if .Values.sync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - FailOnSharedResource=true
      - CreateNamespace=true
      # ServiceMonitor may be discovered before the monitoring CRDs finish
      # their independently automated first sync. Argo CD will retry it.
      - SkipDryRunOnMissingResource=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
  # Keep the controller/CRDs and the ClusterIssuer in one Application so Argo
  # CD can order the CRD before the custom resource during a single sync.
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: {{ .Values.certmanager.version | quote }}
      helm:
        version: v3
        releaseName: cert-manager
        valueFiles:
          - $values/gitops/infra-custom/cert-manager/upstream-values.yaml
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      path: gitops/infra-custom/cert-manager
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      helm:
        version: v3
        releaseName: cert-manager-custom
        valueFiles:
          - values.yaml
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      ref: values
{{- end }}
