apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: security
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - vault.homelab.niekvlam.nl
  rules:
    # 0s disables Envoy's default 15s route timeout.
    - timeouts:
        request: 0s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The HA chart's active-node Service, as its own Ingress/HTTPRoute use.
        - name: vault-active
          port: 8200
