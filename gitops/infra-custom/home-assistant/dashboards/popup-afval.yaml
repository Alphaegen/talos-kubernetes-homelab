type: custom:bubble-card
card_type: pop-up
hash: '#afval'
name: Afval
icon: mdi:trash-can
entity: sensor.afval_ophaalschema
width_desktop: 560px
cards:
  # The rest of this week and the three weeks after it (packages/afval.yaml).
  - type: markdown
    content: |-
      {% set items = state_attr('sensor.afval_ophaalschema', 'ophalingen') or [] %}
      {% set maanden = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug',
                        'sep', 'okt', 'nov', 'dec'] %}
      {% set maandag = (today_at() - timedelta(days=now().weekday())).date() %}
      {% for week in range(4) %}
      {% set van = maandag + timedelta(days=7 * week) %}
      {% set tot = van + timedelta(days=6) %}
      ### {{ ['Deze week', 'Volgende week'][week] if week < 2 else 'Over ' ~ week ~ ' weken' }} · {{ van.day }} {{ maanden[van.month - 1] }} – {{ tot.day }} {{ maanden[tot.month - 1] }}
      {% for i in items | selectattr('week', 'eq', week) %}
      - <ha-icon icon="{{ i.icoon }}"></ha-icon> **{{ i.soort }}** · {{ i.dag }} ({{ i.wanneer }})
      {% else %}
      - Geen ophaling
      {% endfor %}
      {% endfor %}

  # Next date per bin, also when it is further away than four weeks.
  - type: custom:bubble-card
    card_type: separator
    name: Per soort
    icon: mdi:delete-variant
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.circulus_gft
        name: GFT
        icon: mdi:leaf
        color: green
      - type: tile
        entity: sensor.circulus_pmd
        name: PMD
        icon: mdi:recycle
        color: orange
      - type: tile
        entity: sensor.circulus_papier
        name: Papier
        icon: mdi:package-variant
        color: blue
      - type: tile
        entity: sensor.circulus_restafval
        name: Restafval
        icon: mdi:trash-can
        color: grey
