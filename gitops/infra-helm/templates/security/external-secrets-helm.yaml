{{- if and .Values.security.enabled .Values.security.eso.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "external-secrets") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: external-secrets
  namespace: {{ .Values.cluster.namespace | quote }}
  annotations:
    # Stage 0: the operator, its stores, and ExternalSecret prerequisites are
    # kept together so CRDs and their resources converge in one sync.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: external-secrets
  syncPolicy:
    {{- if .Values.sync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - FailOnSharedResource=true
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: {{ .Values.security.eso.version | quote }}
      helm:
        releaseName: external-secrets
        values: |
          installCRDs: true
          serviceMonitor:
            enabled: true
            labels:
              release: {{ .Values.security.eso.serviceMonitorLabel }}
          webhook:
            # keeps it simple; you can enable later for stricter admission
            create: true
          certController:
            create: true
    {{- if .Values.security.eso.bootstrap }}
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      path: gitops/infra-custom/external-secrets
      helm:
        releaseName: external-secrets-bootstrap
        values: |
          integrations:
            certManager:
              enabled: {{ .Values.certmanager.enabled }}
            tailscale:
              enabled: {{ and (.Values.security.tailscale.enabled | default false) (.Values.security.tailscale.externalSecret.enabled | default false) }}
              namespace: {{ .Values.security.tailscale.namespace | default "tailscale" | quote }}
              secretStoreRef:
                kind: {{ .Values.security.tailscale.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" | quote }}
                name: {{ .Values.security.tailscale.externalSecret.secretStoreRef.name | quote }}
              operatorOAuthSecret:
                name: operator-oauth
                refreshInterval: {{ .Values.security.tailscale.externalSecret.refreshInterval | default "1h" | quote }}
                remoteRef:
                  clientIdKey: {{ .Values.security.tailscale.externalSecret.remoteRef.clientIdKey | quote }}
                  clientSecretKey: {{ .Values.security.tailscale.externalSecret.remoteRef.clientSecretKey | quote }}
                  clientIdProperty: {{ .Values.security.tailscale.externalSecret.remoteRef.clientIdProperty | default "" | quote }}
                  clientSecretProperty: {{ .Values.security.tailscale.externalSecret.remoteRef.clientSecretProperty | default "" | quote }}
    {{- end }}
{{- end }}
