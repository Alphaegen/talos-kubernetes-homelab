apiVersion: v1
kind: Pod
metadata:
  name: name-label
  namespace: test
  labels:
    app.kubernetes.io/name: app
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: no-labels
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: empty-name-label
  namespace: test
  labels:
    app.kubernetes.io/name: ""
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-on-template
  namespace: test
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: label-on-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: label-on-template
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:1.2.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-only-on-deployment
  namespace: test
  labels:
    app.kubernetes.io/name: label-only-on-deployment
spec:
  selector:
    matchLabels:
      app: label-only-on-deployment
  template:
    metadata:
      labels:
        app: label-only-on-deployment
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:1.2.3
