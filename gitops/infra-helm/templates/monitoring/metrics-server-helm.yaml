{{- define "app.metrics-server" }}
name: metrics-server
namespace: kube-system
# After kubelet-serving-cert-approver has signed the kubelet serving certs.
wave: 1
project: platform
cascadeDelete: true
sources:
  - repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    version: {{ .Values.metricsServer.version | quote }}
    helm:
      releaseName: metrics-server
      # Chart defaults already verify kubelet TLS (certs signed by kubelet-serving-cert-approver).
      values: |
        resources:
          requests:
            cpu: 10m
            memory: 80Mi
          limits:
            memory: 160Mi
{{ end }}
{{- if .Values.metricsServer.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.metrics-server" . | fromYaml)) }}
{{- end }}
