apiVersion: v1
kind: Pod
metadata:
  name: pod-level-non-root
  namespace: test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: container-level-non-root
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Pod
metadata:
  name: unset
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: container-overrides-to-root
  namespace: test
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      securityContext:
        runAsNonRoot: false
---
apiVersion: v1
kind: Pod
metadata:
  name: run-as-user-zero
  namespace: test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 0
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: container-run-as-user-zero
  namespace: test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      securityContext:
        runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: init-container-without-non-root
  namespace: test
spec:
  initContainers:
    - name: init
      image: ghcr.io/example/init:1.2.3
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      securityContext:
        runAsNonRoot: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unset-cronjob
  namespace: test
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: job
              image: ghcr.io/example/job:1.2.3
