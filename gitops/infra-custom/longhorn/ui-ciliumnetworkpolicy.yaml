apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  # The UI is published through oauth2-proxy (auth namespace), which owns the
  # longhorn.homelab.niekvlam.nl route. Only that proxy may reach the UI;
  # kubectl port-forward still works because it enters from the host.
  endpointSelector:
    matchLabels:
      app: longhorn-ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: oauth2-proxy
            app.kubernetes.io/instance: oauth2-proxy-longhorn
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # The platform smoke app checks that the UI answers. Its Envoy-enforced
    # HTTP rule allows only the static index page, not the /v1 API behind it.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homelab-platform
            app.kubernetes.io/name: homelab-platform-smoke
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/"
