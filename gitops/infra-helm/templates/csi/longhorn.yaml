{{- define "app.longhorn" }}
name: longhorn
partOf: longhorn
namespace: longhorn-system
# Storage provider and its CRD-backed configuration.
wave: 0
project: platform
# No cascadeDelete: deleting the Application must not cascade into the
# storage control plane or its stateful resources.
createNamespace: true
namespaceLabels:
  # Longhorn's manager, CSI and instance-manager pods need privileged host access.
  pod-security.kubernetes.io/enforce: privileged
  pod-security.kubernetes.io/warn: privileged
  pod-security.kubernetes.io/audit: privileged
# The bundled ServiceMonitor/PrometheusRule can be encountered while the
# monitoring Application is still establishing its CRDs.
sources:
  - repoURL: https://charts.longhorn.io
    chart: longhorn
    version: {{ .Values.longhorn.version | quote }}
    helm:
      releaseName: longhorn
      valueFiles:
        - $values/gitops/infra-custom/longhorn/values.yaml
  - path: gitops/infra-custom/longhorn
{{ end }}
{{- if .Values.longhorn.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.longhorn" . | fromYaml)) }}
{{- end }}
