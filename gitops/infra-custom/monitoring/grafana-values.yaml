replicas: 1

deploymentStrategy:
  type: Recreate

grafana.ini:
  metrics:
    enabled: true
  server:
    # The chart derives this from ingress.hosts only while its Ingress is enabled.
    domain: grafana.homelab.niekvlam.nl
    # OAuth redirect URIs are built from root_url; the default includes :3000.
    root_url: https://grafana.homelab.niekvlam.nl/
  # Sign-in through Pocket ID only. The local admin keeps working over the
  # API; break-glass steps are in docs/auth.md.
  auth:
    disable_login_form: true
  auth.generic_oauth:
    enabled: true
    name: Pocket ID
    allow_sign_up: true
    client_id: $__file{/etc/secrets/oidc/client-id}
    client_secret: $__file{/etc/secrets/oidc/client-secret}
    scopes: openid email profile groups offline_access
    auth_url: https://id.homelab.niekvlam.nl/authorize
    token_url: https://id.homelab.niekvlam.nl/api/oidc/token
    api_url: https://id.homelab.niekvlam.nl/api/oidc/userinfo
    use_pkce: true
    # Pocket ID access tokens are short-lived; refresh instead of logging out.
    use_refresh_token: true
    login_attribute_path: preferred_username
    name_attribute_path: name
    email_attribute_path: email
    groups_attribute_path: groups
    # homelab-admins become Grafana server admins; anyone else is refused.
    role_attribute_path: contains(groups[*], 'homelab-admins') && 'GrafanaAdmin'
    role_attribute_strict: true
    allow_assign_grafana_admin: true

# client-id and client-secret for auth.generic_oauth, read with $__file{}.
extraSecretMounts:
  - name: oidc
    secretName: grafana-oidc
    mountPath: /etc/secrets/oidc
    readOnly: true

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

# The root chown init container is not needed: Grafana keeps its uid 472, the
# data is already 472-owned from earlier starts, and fsGroup 472 covers new files.
initChownData:
  enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

downloadDashboards:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# The chart's generated download script masks curl failures in sed pipelines.
# Retry if that leaves an empty dashboard and fail startup rather than loading it.
extraInitContainers:
  - name: validate-downloaded-dashboards
    image: docker.io/curlimages/curl:8.22.0
    command: ["/bin/sh", "-ec"]
    args:
      - |
        dashboard_files="$(sed -n 's/^> "\(.*\)"$/\1/p' /etc/grafana/download_dashboards.sh)"
        downloads_are_valid() {
          for dashboard_file in $dashboard_files; do
            if [ ! -s "$dashboard_file" ]; then
              echo "Downloaded dashboard is empty: $dashboard_file" >&2
              return 1
            fi
          done
        }

        attempt=1
        until downloads_are_valid; do
          if [ "$attempt" -gt 5 ]; then
            echo "Dashboard download remained empty after five retries" >&2
            exit 1
          fi
          echo "Retrying empty dashboard download (attempt $attempt/5)"
          /bin/sh /etc/grafana/download_dashboards.sh
          attempt=$((attempt + 1))
          sleep 5
        done
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      seccompProfile: {type: RuntimeDefault}
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
      - name: config
        mountPath: /etc/grafana/download_dashboards.sh
        subPath: download_dashboards.sh
      - name: storage
        mountPath: /var/lib/grafana

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        allowUiUpdates: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi
  dashboards:
    enabled: true
    skipReload: true
    labelValue: "1"
    searchNamespace: ALL
    label: grafana_dashboard
    env:
      HEALTH_PORT: "8084"
  datasources:
    enabled: true
    skipReload: true
    env:
      HEALTH_PORT: "8082"

ingress:
  enabled: false

# The chart's native route values have no timeouts field, so the HTTPRoute is
# added as an extra object.
extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: grafana
      namespace: monitoring
    spec:
      parentRefs:
        # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
        - name: cilium-gateway
          namespace: kube-system
          sectionName: https
      hostnames: ["grafana.homelab.niekvlam.nl"]
      rules:
        # 0s disables Envoy's default 15s route timeout for long queries and
        # the Grafana Live websocket.
        - timeouts: { request: 0s }
          matches:
            - path: { type: PathPrefix, value: / }
          backendRefs:
            - { name: grafana, port: 80 }

  # client-id and client-secret for auth.generic_oauth (extraSecretMounts).
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-oidc
      namespace: monitoring
    spec:
      refreshInterval: 24h
      secretStoreRef:
        kind: ClusterSecretStore
        name: onepassword
      target:
        name: grafana-oidc
        creationPolicy: Owner
        template:
          type: Opaque
          metadata:
            labels:
              managed-by: external-secrets
      data:
        - secretKey: client-id
          remoteRef:
            key: grafana-oidc/client-id
        - secretKey: client-secret
          remoteRef:
            key: grafana-oidc/client-secret

persistence:
  enabled: true
  type: pvc
  storageClassName: longhorn
  accessModes: ["ReadWriteOnce"]
  size: 10Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.monitoring.svc:80
