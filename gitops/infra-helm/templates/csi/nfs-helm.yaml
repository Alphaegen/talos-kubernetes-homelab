{{- define "app.nfs-provisioner" }}
name: nfs-provisioner
namespace: nfs-provisioner
# Storage add-on after bootstrap foundations.
wave: 1
project: platform
createNamespace: true
sources:
  - repoURL: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
    chart: nfs-subdir-external-provisioner
    version: {{ .Values.media.nfs.version | default "4.0.18" | quote }}
    helm:
      releaseName: nfs-provisioner
      values: |
        replicaCount: 1
        strategyType: Recreate
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 96Mi}
        leaderElection:
          enabled: false
        nfs:
          server: {{ .Values.media.nfs.server | default "nas.niekvlam.nl" | quote }}
          path: {{ .Values.media.nfs.path | default "/volume1/PlexMediaServer" | quote }}
          mountOptions:
            - nfsvers=4.1
            - rsize=1048576
            - wsize=1048576
            - hard
            - timeo=600
            - retrans=2
        storageClass:
          name: {{ .Values.media.nfs.storageClass | default "media-nfs" | quote }}
          defaultClass: false
          reclaimPolicy: Retain
          allowVolumeExpansion: true
          onDelete: retain
{{ end }}
{{- if .Values.media.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.nfs-provisioner" . | fromYaml)) }}
{{- end }}
