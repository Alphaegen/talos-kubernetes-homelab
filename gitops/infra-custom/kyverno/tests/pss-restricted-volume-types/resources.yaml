apiVersion: v1
kind: Pod
metadata:
  name: no-volumes
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-volume-types
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
  volumes:
    - name: config
      configMap:
        name: app-config
    - name: creds
      secret:
        secretName: app-creds
    - name: cache
      emptyDir: {}
    - name: data
      persistentVolumeClaim:
        claimName: app-data
    - name: token
      projected:
        sources:
          - serviceAccountToken:
              path: token
    - name: info
      downwardAPI:
        items:
          - path: labels
            fieldRef:
              fieldPath: metadata.labels
    - name: scratch
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
    - name: inline
      csi:
        driver: example.csi.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: host-path-volume
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
  volumes:
    - name: host
      hostPath:
        path: /var/lib
---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-volume
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
  volumes:
    - name: cache
      emptyDir: {}
    - name: media
      nfs:
        server: nas.example.internal
        path: /media
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-volume-deployment
  namespace: test
spec:
  selector:
    matchLabels:
      app: nfs-volume-deployment
  template:
    metadata:
      labels:
        app: nfs-volume-deployment
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:1.2.3
      volumes:
        - name: media
          nfs:
            server: nas.example.internal
            path: /media
