namespace: home-automation
createNamespace: true

storageClassName: longhorn

slzb:
  ip: 192.168.30.232
  port: 6638
  adapter: zstack
  baudrate: 115200

mqtt:
  image: eclipse-mosquitto:2.0.22
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  persistence:
    size: 2Gi
  service:
    name: mosquitto
    port: 1883
  credentialsSecret:
    name: mqtt-credentials
    usernameKey: username
    passwordKey: password

mqttExternalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  remoteRef:
    usernameKey: mqtt-zigbee/username
    passwordKey: mqtt-zigbee/password
    usernameProperty: ""
    passwordProperty: ""

# Set by the Application wiring. Keep the service configuration authoritative
# here while avoiding an ExternalSecret when its provider is disabled.
externalSecrets:
  enabled: true

fallbackSecret:
  enabled: false
  username: ""
  password: ""

zigbee2mqtt:
  image: ghcr.io/koenkk/zigbee2mqtt:2.14.1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  timezone: Europe/Amsterdam
  persistence:
    size: 5Gi
  service:
    name: zigbee2mqtt
    port: 8080
  config:
    baseTopic: zigbee2mqtt
    homeAssistantEnabled: true
    frontendEnabled: true
    permitJoin: false
    logLevel: info
  # HTTPRoute on the shared Cilium Gateway (wildcard TLS terminates there).
  httpRoute:
    enabled: true
    host: zigbee2mqtt.homelab.niekvlam.nl
