{{- define "app.media" }}
name: media
namespace: media
# Stateful workload after the wave-1 NFS provisioner.
wave: 2
project: apps
createNamespace: true
namespaceLabels:
  # Gluetun needs NET_ADMIN and /dev/net/tun.
  pod-security.kubernetes.io/enforce: privileged
  pod-security.kubernetes.io/warn: baseline
  pod-security.kubernetes.io/audit: baseline
ownsPVCs: true
sources:
  - path: gitops/infra-custom/media
{{ end }}
{{- if .Values.media.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.media" . | fromYaml)) }}
{{- end }}
