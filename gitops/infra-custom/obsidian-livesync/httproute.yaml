apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obsidian-livesync
  namespace: obsidian-livesync
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: obsidian-livesync
    app.kubernetes.io/part-of: obsidian-livesync
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - livesync.homelab.niekvlam.nl
  rules:
    # 0s disables Envoy's default 15s route timeout, which would cut long-poll
    # _changes feeds (CouchDB answers within changes_timeout 60s or sends
    # heartbeats, well inside Envoy's 300s stream idle timeout). Envoy streams
    # without buffering and sets no body limit; CouchDB's own limits apply.
    - timeouts:
        request: 0s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: obsidian-livesync
          port: 5984
