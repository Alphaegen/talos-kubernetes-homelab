apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector: { matchLabels: { app: prowlarr } }
  template:
    metadata: { labels: { app: prowlarr, app.kubernetes.io/name: prowlarr } }
    spec:
      priorityClassName: homelab-best-effort
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Native sidecar: clears indexer backoff once the indexer works again
        # (see indexer-backoff-reset.yaml).
        - name: indexer-backoff-reset
          image: docker.io/curlimages/curl:8.23.0
          restartPolicy: Always
          command: ["/bin/sh", "/scripts/reset.sh"]
          env:
            - { name: APP_PORT, value: "9696" }
            - { name: API_VERSION, value: v1 }
            - { name: INTERVAL_SECONDS, value: "900" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - { name: config, mountPath: /app-config, readOnly: true }
            - { name: indexer-backoff-reset, mountPath: /scripts, readOnly: true }
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:3.0.2.5780-ls169
          # s6-overlay starts as root, fixes ownership, then drops to PUID/PGID.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          resources:
            requests:
              cpu: 50m
              memory: 240Mi
            limits:
              cpu: "1"
              memory: 512Mi
          ports: [{ name: http, containerPort: 9696 }]
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: UMASK, value: "002" }
            - name: DOTNET_SYSTEM_NET_DISABLEIPV6
              value: "1"
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - {
            name: config,
            persistentVolumeClaim: { claimName: prowlarr-config },
          }
        - name: indexer-backoff-reset
          configMap: { name: indexer-backoff-reset }
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
spec:
  selector: { app: prowlarr }
  ports:
    - { name: http, port: 9696, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: media
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames: ["prowlarr.homelab.niekvlam.nl"]
  rules:
    # 0s disables Envoy's default 15s route timeout; indexer searches can take longer.
    - timeouts: { request: 0s }
      matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: prowlarr, port: 9696 }
