{{- define "app.argo-rollouts" }}
name: argo-rollouts
namespace: {{ .Values.progressiveDelivery.argoRollouts.namespace | default "argo-rollouts" | quote }}
# CRD/API provider for rollout workloads.
wave: 0
project: platform
createNamespace: true
cascadeDelete: true
sources:
  - repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    version: {{ .Values.progressiveDelivery.argoRollouts.version | quote }}
    helm:
      releaseName: argo-rollouts
      values: |
        installCRDs: true

        controller:
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: {{ .Values.progressiveDelivery.argoRollouts.serviceMonitorLabel | quote }}

        dashboard:
          enabled: false
{{ end }}
{{- if and .Values.progressiveDelivery.enabled .Values.progressiveDelivery.argoRollouts.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.argo-rollouts" . | fromYaml)) }}
{{- end }}
