apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cilium-gateway
    app.kubernetes.io/part-of: cilium-gateway-api
spec:
  parentRefs:
    # No hostnames: inherits the listener's *.homelab.niekvlam.nl.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
