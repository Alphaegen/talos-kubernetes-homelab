{{- define "app.kube-prometheus-stack" }}
name: kube-prometheus-stack
partOf: monitoring
namespace: monitoring
# Establish monitoring CRDs before add-ons publish monitors/rules. The
# ExternalSecret CRD comes from the separate external-secrets app.
wave: 0
project: platform
createNamespace: true
namespaceLabels:
  # node-exporter (host network, PID and filesystem) and Alloy (host log
  # files through hostPath) run here.
  pod-security.kubernetes.io/enforce: privileged
  pod-security.kubernetes.io/warn: privileged
  pod-security.kubernetes.io/audit: privileged
syncOptions:
  - ServerSideApply=true
sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: {{ .Values.monitoring.prometheus.version | quote }}
    helm:
      releaseName: kube-prometheus-stack
      valueFiles:
        - $values/gitops/infra-custom/monitoring/kube-prometheus-stack-values.yaml
  - path: gitops/infra-custom/monitoring/alertmanager
{{ end }}
{{- if .Values.monitoring.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.kube-prometheus-stack" . | fromYaml)) }}
{{- end }}
