# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
{{- if .Values.homeAutomation.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "home-automation") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: home-automation
  namespace: {{ .Values.cluster.namespace | quote }}
  annotations:
    # Stage 2: stateful workload after storage and secret foundations.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: home-automation
  syncPolicy:
    {{- if .Values.sync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - FailOnSharedResource=true
      # The chart contains and owns the Namespace manifest.
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
  source:
    repoURL: {{ .Values.cluster.repoURL | quote }}
    targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
    path: gitops/infra-custom/home-automation
    helm:
      # The service-local values file is authoritative. This one wiring flag
      # keeps its ExternalSecret off when External Secrets is unavailable.
      values: |
        externalSecrets:
          enabled: {{ .Values.security.eso.enabled | default false }}
{{- end }}
