# Rain Bird irrigation (four zones) for the Tuin view of the Thuis dashboard
# (dashboards/view-tuin.yaml).
#
# Zones only start through script.rainbird_start_single_zone. It turns the
# other zones off first and sends the duration along, so the controller stops
# the zone by itself, even when Home Assistant goes away halfway. The shared
# timer only mirrors that countdown for the dashboard.
#
# The schedule ("Automatisch sproeien") lives here, not on the controller.
# Switch the controller's own programs off in the Rain Bird app, or zones run
# twice. The schedule skips a day when the rain sensor sees rain or a rain
# delay is set.
#
# sensor.rainbird_logboek records every zone run the integration sees, also
# runs started on the controller or in the Rain Bird app. The integration
# polls once a minute, so start times and durations are accurate to about a
# minute.
input_number:
  # Manual start, from the zone pop-ups.
  rainbird_duration:
    name: Sproeiduur handmatig
    min: 5
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-outline

  # Minutes per zone for the schedule and "Schema nu starten"; 0 skips it.
  rainbird_program_zone_1_duration:
    name: Schema Gras
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:grass

  rainbird_program_zone_2_duration:
    name: Schema Achtertuin
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:flower

  rainbird_program_zone_3_duration:
    name: Schema Voortuin + zijkant
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:home-variant-outline

  rainbird_program_zone_4_duration:
    name: Schema Druppelslang
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:water-outline

  # The zone number the program is on (0 before the first zone).
  rainbird_program_step:
    name: RainBird Program Step
    min: 0
    max: 4
    step: 1
    icon: mdi:playlist-check

input_boolean:
  rainbird_command_pending:
    name: RainBird Command Pending
    icon: mdi:progress-clock

  rainbird_last_start_confirmed:
    name: RainBird Last Start Confirmed
    icon: mdi:check-circle-outline

  rainbird_program_running:
    name: RainBird Program Running
    icon: mdi:playlist-play

  rainbird_schema_actief:
    name: Automatisch sproeien
    icon: mdi:calendar-clock

  # A paused zone keeps its minutes but is skipped by the schedule and by
  # "Schema nu starten" until it is switched back. Manual starts still work.
  rainbird_pauze_zone_1:
    name: Pauze Gras
    icon: mdi:pause-circle-outline
  rainbird_pauze_zone_2:
    name: Pauze Achtertuin
    icon: mdi:pause-circle-outline
  rainbird_pauze_zone_3:
    name: Pauze Voortuin + zijkant
    icon: mdi:pause-circle-outline
  rainbird_pauze_zone_4:
    name: Pauze Druppelslang
    icon: mdi:pause-circle-outline

  # Days the schedule runs, by Dutch abbreviation (ma = Monday).
  rainbird_schema_ma:
    name: Sproeien op maandag
    icon: mdi:calendar
  rainbird_schema_di:
    name: Sproeien op dinsdag
    icon: mdi:calendar
  rainbird_schema_wo:
    name: Sproeien op woensdag
    icon: mdi:calendar
  rainbird_schema_do:
    name: Sproeien op donderdag
    icon: mdi:calendar
  rainbird_schema_vr:
    name: Sproeien op vrijdag
    icon: mdi:calendar
  rainbird_schema_za:
    name: Sproeien op zaterdag
    icon: mdi:calendar
  rainbird_schema_zo:
    name: Sproeien op zondag
    icon: mdi:calendar

input_datetime:
  rainbird_schema_starttijd:
    name: Starttijd schema
    has_date: false
    has_time: true
    icon: mdi:clock-outline

input_text:
  # The switch entity being started, for the status line.
  rainbird_requested_zone:
    name: RainBird Requested Zone
    max: 40

  rainbird_last_message:
    name: RainBird Last Message
    max: 255

timer:
  rainbird_time_left:
    name: Sproeitijd over
    duration: "00:10:00"
    restore: true

template:
  - binary_sensor:
      # Anything going on: a zone on, a start waiting for confirmation, or a
      # program between zones. Shows the Tuin section on the Thuis view.
      - name: RainBird Bezig
        unique_id: rainbird_bezig
        icon: mdi:sprinkler-variant
        state: >-
          {{
            ['switch.rain_bird_sprinkler_1', 'switch.rain_bird_sprinkler_2',
             'switch.rain_bird_sprinkler_3', 'switch.rain_bird_sprinkler_4']
            | select('is_state', 'on') | list | count > 0
            or is_state('input_boolean.rainbird_command_pending', 'on')
            or is_state('input_boolean.rainbird_program_running', 'on')
          }}

  - sensor:
      # The zone's own name (the switch's friendly name), or Geen. Also shows
      # zones started on the controller or in the Rain Bird app.
      - name: RainBird Active Zone
        unique_id: rainbird_active_zone
        icon: mdi:sprinkler
        state: >-
          {% set aan = ['switch.rain_bird_sprinkler_1', 'switch.rain_bird_sprinkler_2',
                        'switch.rain_bird_sprinkler_3', 'switch.rain_bird_sprinkler_4']
                       | select('is_state', 'on') | list %}
          {{ state_attr(aan[0], 'friendly_name') if aan else 'Geen' }}

      - name: RainBird Status
        unique_id: rainbird_status
        icon: mdi:sprinkler-variant
        state: >-
          {% set aan = ['switch.rain_bird_sprinkler_1', 'switch.rain_bird_sprinkler_2',
                        'switch.rain_bird_sprinkler_3', 'switch.rain_bird_sprinkler_4']
                       | select('is_state', 'on') | list %}
          {% set gevraagd = states('input_text.rainbird_requested_zone') %}
          {% if aan %}
            {{ state_attr(aan[0], 'friendly_name') }} sproeit
          {% elif is_state('input_boolean.rainbird_command_pending', 'on') %}
            {{ state_attr(gevraagd, 'friendly_name') or 'Zone' }} wordt gestart
          {% elif is_state('input_boolean.rainbird_program_running', 'on') %}
            Wacht op volgende zone
          {% elif is_state('switch.rain_bird_sprinkler_1', 'unavailable') %}
            Rain Bird niet bereikbaar
          {% else %}
            Uit
          {% endif %}

      # Minutes the program runs: paused zones do not count.
      - name: RainBird Program Total Duration
        unique_id: rainbird_program_total_duration
        icon: mdi:timer-sand
        unit_of_measurement: min
        state: >-
          {% set ns = namespace(totaal=0) %}
          {% for i in range(1, 5)
               if not is_state('input_boolean.rainbird_pauze_zone_' ~ i, 'on') %}
            {% set ns.totaal = ns.totaal
                 + ([states('input_number.rainbird_program_zone_' ~ i ~ '_duration') | int(0), 60] | min) %}
          {% endfor %}
          {{ ns.totaal }}

      # The zones a running program has not started yet, e.g.
      # "Achtertuin (10 min) → Druppelslang (20 min)", or Geen.
      - name: RainBird Program Remaining
        unique_id: rainbird_program_remaining
        icon: mdi:playlist-check
        state: >-
          {% set step = states('input_number.rainbird_program_step') | int(0) %}
          {% set ns = namespace(items=[]) %}
          {% if is_state('input_boolean.rainbird_program_running', 'on') %}
            {% for i in range(step + 1, 5) %}
              {% set d = [states('input_number.rainbird_program_zone_' ~ i ~ '_duration') | int(0), 60] | min %}
              {% if d > 0 and not is_state('input_boolean.rainbird_pauze_zone_' ~ i, 'on') %}
                {% set naam = state_attr('switch.rain_bird_sprinkler_' ~ i, 'friendly_name') or 'Zone ' ~ i %}
                {% set ns.items = ns.items + [naam ~ ' (' ~ d ~ ' min)'] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.items | join(' → ') if ns.items else 'Geen' }}

      # When the schedule runs next, or unknown while it is off, has no days
      # or no minutes. Does not look at rain: that is decided at start time.
      - name: RainBird Volgende Beurt
        unique_id: rainbird_volgende_beurt
        icon: mdi:calendar-clock
        device_class: timestamp
        state: >-
          {% set dagen = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'] %}
          {% set ns = namespace(volgende=none) %}
          {% if is_state('input_boolean.rainbird_schema_actief', 'on')
                and has_value('input_datetime.rainbird_schema_starttijd')
                and states('sensor.rainbird_program_total_duration') | int(0) > 0 %}
            {% set start = today_at(states('input_datetime.rainbird_schema_starttijd')) %}
            {% for i in range(8) %}
              {% set t = start + timedelta(days=i) %}
              {% if ns.volgende is none and t > now()
                    and is_state('input_boolean.rainbird_schema_' ~ dagen[t.weekday()], 'on') %}
                {% set ns.volgende = t %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.volgende.isoformat() if ns.volgende is not none else none }}

      - name: RainBird Last Message
        unique_id: rainbird_last_message
        icon: mdi:message-text-outline
        state: "{{ states('input_text.rainbird_last_message') }}"

  # The log: zone runs, skipped schedule days with their reason, failed
  # starts, pauses and the schedule switched off or on. The last 50, newest
  # first, stay in the `runs` attribute for the dashboard (it survives
  # restarts); every entry also goes to the Local Calendar calendar.tuin, which
  # keeps them for good. A run is written when its zone goes off. Its source
  # comes from the start request the scripts announce with a rainbird_logboek
  # event; a zone that comes on without one was started on the controller or
  # in the Rain Bird app.
  - triggers:
      - trigger: state
        entity_id: &rainbird_zones
          - switch.rain_bird_sprinkler_1
          - switch.rain_bird_sprinkler_2
          - switch.rain_bird_sprinkler_3
          - switch.rain_bird_sprinkler_4
        to: "on"
        id: aan
      # Also from unavailable: the controller sometimes drops off for a few
      # minutes, and comes back with the zone already off.
      - trigger: state
        entity_id: *rainbird_zones
        to: "off"
        id: uit
      # data: soort (aanvraag, overgeslagen, mislukt, pauze, hervat, uit or
      # aan), zone (switch entity or empty for the whole schedule), bron,
      # reden, and optionally naam to override the zone name.
      - trigger: event
        event_type: rainbird_logboek
        id: melding
    actions:
      - variables:
          nu: "{{ now().isoformat() }}"
          oud_runs: "{{ state_attr('sensor.rainbird_logboek', 'runs') or [] }}"
          oud_lopend: "{{ state_attr('sensor.rainbird_logboek', 'lopend') or [] }}"
          oud_aanvraag: "{{ state_attr('sensor.rainbird_logboek', 'aanvraag') or {} }}"
          zone: >-
            {{ (trigger.event.data.zone | default('')) if trigger.id == 'melding'
               else trigger.entity_id }}
          zone_naam: >-
            {% if trigger.id == 'melding' and trigger.event.data.naam is defined %}
              {{ trigger.event.data.naam }}
            {% elif zone %}
              {{ state_attr(zone, 'friendly_name') or zone }}
            {% endif %}
          bezig: "{{ oud_lopend | selectattr('zone', 'eq', zone) | first | default({}) }}"
          # A zone that comes back from unavailable while it was already
          # running keeps its start; one stuck for over 3 hours does not.
          nog_bezig: >-
            {{ bezig != {}
               and as_timestamp(now()) - as_timestamp(bezig.start, 0) < 3 * 3600 }}
          bron_aan: >-
            {% set a = oud_aanvraag %}
            {% if a.get('zone') == zone
                  and as_timestamp(now()) - as_timestamp(a.get('tijd'), 0) < 300 %}
              {{ a.bron }}
            {% else %}
              Rain Bird
            {% endif %}
          lopend: >-
            {% set rest = oud_lopend | rejectattr('zone', 'eq', zone) | list %}
            {% if trigger.id == 'aan' and not nog_bezig %}
              {{ rest + [{'zone': zone, 'start': nu, 'bron': bron_aan}] }}
            {% elif trigger.id == 'uit' %}
              {{ rest }}
            {% else %}
              {{ oud_lopend }}
            {% endif %}
          aanvraag: >-
            {% if trigger.id == 'melding' and trigger.event.data.soort == 'aanvraag' %}
              {{ {'zone': zone, 'bron': trigger.event.data.bron | default('Handmatig'), 'tijd': nu} }}
            {% else %}
              {{ oud_aanvraag }}
            {% endif %}
          # Every entry has a short `wat` for the table and the calendar, e.g.
          # "15 min", "overgeslagen: regen gemeten" or "gepauzeerd".
          nieuw: >-
            {% if trigger.id == 'uit' and bezig != {} %}
              {% set minuten = [((as_timestamp(now()) - as_timestamp(bezig.start)) / 60) | round(0) | int, 1] | max %}
              {{ {
                'soort': 'beurt',
                'zone': zone,
                'naam': zone_naam,
                'start': bezig.start,
                'minuten': minuten,
                'wat': minuten ~ ' min',
                'bron': bezig.bron,
              } }}
            {% elif trigger.id == 'melding' and trigger.event.data.soort != 'aanvraag' %}
              {% set soort = trigger.event.data.soort %}
              {% set reden = trigger.event.data.reden | default('') %}
              {{ {
                'soort': soort,
                'zone': zone,
                'naam': zone_naam or 'Schema',
                'start': nu,
                'minuten': 0,
                'wat': {
                  'overgeslagen': 'overgeslagen: ' ~ reden,
                  'mislukt': 'mislukt: ' ~ reden,
                  'pauze': 'gepauzeerd',
                  'hervat': 'hervat',
                  'uit': 'uitgezet',
                  'aan': 'aangezet',
                }.get(soort, soort),
                'bron': trigger.event.data.bron | default(''),
                'reden': reden,
              } }}
            {% else %}
              {{ none }}
            {% endif %}
          runs: "{{ ([nieuw] + oud_runs)[:50] if nieuw else oud_runs }}"
      # The full history. Needs a Local Calendar named Tuin (README); without
      # it only the last 50 are kept.
      - if:
          - condition: template
            value_template: "{{ nieuw is not none and has_value('calendar.tuin') }}"
        then:
          - action: calendar.create_event
            continue_on_error: true
            target:
              entity_id: calendar.tuin
            data:
              summary: "{{ nieuw.naam }} · {{ nieuw.wat }}"
              description: "{{ 'Door: ' ~ nieuw.bron if nieuw.bron else '' }}"
              start_date_time: "{{ as_datetime(nieuw.start).isoformat() }}"
              end_date_time: >-
                {{ ([now(), as_datetime(nieuw.start) + timedelta(minutes=1)] | max).isoformat() }}
    sensor:
      - name: RainBird Logboek
        unique_id: rainbird_logboek
        icon: mdi:history
        device_class: timestamp
        state: "{{ runs[0].start if runs else none }}"
        attributes:
          runs: "{{ runs }}"
          lopend: "{{ lopend }}"
          aanvraag: "{{ aanvraag }}"

script:
  rainbird_start_single_zone:
    alias: RainBird - Start Single Zone
    description: >-
      Starts one zone for a number of minutes after turning the others off,
      and starts the shared timer once the controller reports it on.
    mode: single
    max_exceeded: silent
    fields:
      zone_switch:
        name: Zone switch
        required: true
        example: switch.rain_bird_sprinkler_1
      duration:
        name: Duration
        description: Minutes, 5 to 60. Defaults to input_number.rainbird_duration.
        required: false
      bron:
        name: Source
        description: Shown in the log. Defaults to Handmatig.
        required: false
    sequence:
      - variables:
          duration_min: >-
            {% set requested = (duration | default(states('input_number.rainbird_duration'))) | int(0) %}
            {{ 0 if requested <= 0 else [[requested, 5] | max, 60] | min }}
          zone_name: "{{ state_attr(zone_switch, 'friendly_name') or zone_switch }}"
          bron_tekst: "{{ bron | default('Handmatig') }}"
          started_at: "{{ as_timestamp(now()) }}"

      - condition: template
        value_template: "{{ duration_min | int(0) > 0 }}"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.rainbird_last_start_confirmed

      - action: input_text.set_value
        target:
          entity_id: input_text.rainbird_requested_zone
        data:
          value: "{{ zone_switch }}"

      - action: input_text.set_value
        target:
          entity_id: input_text.rainbird_last_message
        data:
          value: "{{ zone_name }} wordt gestart ({{ duration_min }} min)."

      - event: rainbird_logboek
        event_data:
          soort: aanvraag
          zone: "{{ zone_switch }}"
          bron: "{{ bron_tekst }}"

      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.rainbird_command_pending

      - action: timer.cancel
        target:
          entity_id: timer.rainbird_time_left

      - action: switch.turn_off
        target:
          entity_id: &rainbird_zones_script
            - switch.rain_bird_sprinkler_1
            - switch.rain_bird_sprinkler_2
            - switch.rain_bird_sprinkler_3
            - switch.rain_bird_sprinkler_4
        continue_on_error: true

      - delay: "00:00:02"

      # Two tries: the controller handles one request at a time and is
      # sometimes briefly busy or unreachable. The integration polls once a
      # minute, hence the long wait.
      - action: rainbird.start_irrigation
        target:
          entity_id: "{{ zone_switch }}"
        data:
          duration: "{{ duration_min }}"
        continue_on_error: true

      - wait_template: &rainbird_zone_on >-
          {{
            is_state(zone_switch, 'on')
            and as_timestamp(states[zone_switch].last_changed, 0) >= (started_at | float(0))
          }}
        timeout: "00:01:15"
        continue_on_timeout: true

      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - delay: "00:00:30"
          - action: rainbird.start_irrigation
            target:
              entity_id: "{{ zone_switch }}"
            data:
              duration: "{{ duration_min }}"
            continue_on_error: true
          - wait_template: *rainbird_zone_on
            timeout: "00:01:15"
            continue_on_timeout: true

      - if:
          - condition: template
            value_template: *rainbird_zone_on
        then:
          # Counted from when the zone was seen on, which is at most a minute
          # after the controller started it.
          - variables:
              remaining_seconds: >-
                {% set gelopen = as_timestamp(now()) - as_timestamp(states[zone_switch].last_changed) %}
                {{ [(duration_min | int(0)) * 60 - gelopen | int(0), 60] | max }}

          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.rainbird_last_start_confirmed

          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.rainbird_command_pending

          - action: timer.start
            target:
              entity_id: timer.rainbird_time_left
            data:
              duration: "{{ remaining_seconds }}"

          - action: input_text.set_value
            target:
              entity_id: input_text.rainbird_last_message
            data:
              value: "{{ zone_name }} sproeit {{ duration_min }} min."
        else:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.rainbird_command_pending
                - input_boolean.rainbird_last_start_confirmed

          - action: timer.cancel
            target:
              entity_id: timer.rainbird_time_left

          - action: input_text.set_value
            target:
              entity_id: input_text.rainbird_last_message
            data:
              value: "{{ zone_name }} kon niet starten: Rain Bird reageert niet."

          - event: rainbird_logboek
            event_data:
              soort: mislukt
              zone: "{{ zone_switch }}"
              bron: "{{ bron_tekst }}"
              reden: Rain Bird reageert niet

          - action: persistent_notification.create
            data:
              title: Tuin
              message: "{{ zone_name }} kon niet starten: Rain Bird reageert niet."

          # packages/meldingen.yaml: only phones that have it switched on.
          - action: script.melding_versturen
            continue_on_error: true
            data:
              melding: tuin
              titel: Tuin
              bericht: "{{ zone_name }} kon niet starten: Rain Bird reageert niet."

  rainbird_run_program:
    alias: RainBird - Run Program
    description: >-
      Runs every zone with schedule minutes above 0 that is not paused, in
      zone order, one after the other.
    mode: single
    max_exceeded: silent
    fields:
      bron:
        name: Source
        description: Shown in the log. Defaults to Programma.
        required: false
    sequence:
      - variables:
          bron_tekst: "{{ bron | default('Programma') }}"
          zones: >-
            {% set ns = namespace(zones=[]) %}
            {% for i in range(1, 5) %}
              {% set d = [states('input_number.rainbird_program_zone_' ~ i ~ '_duration') | int(0), 60] | min %}
              {% if d > 0 and not is_state('input_boolean.rainbird_pauze_zone_' ~ i, 'on') %}
                {% set ns.zones = ns.zones + [{'nr': i, 'switch': 'switch.rain_bird_sprinkler_' ~ i, 'minuten': d}] %}
              {% endif %}
            {% endfor %}
            {{ ns.zones }}

      - condition: template
        value_template: "{{ zones | count > 0 }}"

      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.rainbird_program_running

      - action: input_number.set_value
        target:
          entity_id: input_number.rainbird_program_step
        data:
          value: 0

      - action: input_text.set_value
        target:
          entity_id: input_text.rainbird_last_message
        data:
          value: "{{ bron_tekst }} gestart."

      - repeat:
          for_each: "{{ zones }}"
          sequence:
            # Stop pressed while the previous zone ran.
            - if:
                - condition: state
                  entity_id: input_boolean.rainbird_program_running
                  state: "off"
              then:
                - stop: Program cancelled.

            # Ride out a short controller drop-off before giving up.
            - wait_template: "{{ not is_state(repeat.item.switch, 'unavailable') }}"
              timeout: "00:15:00"
              continue_on_timeout: true

            - action: script.rainbird_start_single_zone
              data:
                zone_switch: "{{ repeat.item.switch }}"
                duration: "{{ repeat.item.minuten }}"
                bron: "{{ bron_tekst }}"

            - if:
                - condition: state
                  entity_id: input_boolean.rainbird_last_start_confirmed
                  state: "off"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.rainbird_program_running
                - action: input_number.set_value
                  target:
                    entity_id: input_number.rainbird_program_step
                  data:
                    value: 0
                - stop: A zone did not start.

            - action: input_number.set_value
              target:
                entity_id: input_number.rainbird_program_step
              data:
                value: "{{ repeat.item.nr }}"

            # Ends early on "Volgende zone" (stop without cancel_program).
            - wait_template: "{{ is_state('timer.rainbird_time_left', 'idle') }}"
              timeout:
                minutes: "{{ repeat.item.minuten + 2 }}"
              continue_on_timeout: true

      - if:
          - condition: state
            entity_id: input_boolean.rainbird_program_running
            state: "on"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.rainbird_program_running
          - action: input_number.set_value
            target:
              entity_id: input_number.rainbird_program_step
            data:
              value: 0
          - action: input_text.set_value
            target:
              entity_id: input_text.rainbird_last_message
            data:
              value: "{{ bron_tekst }} klaar."

  rainbird_stop_all_zones:
    alias: RainBird - Stop All Zones
    description: >-
      Turns every zone off. With cancel_program a running program stops too;
      without, it moves on to its next zone.
    mode: restart
    fields:
      cancel_program:
        name: Cancel program
        required: false
    sequence:
      - variables:
          should_cancel_program: "{{ cancel_program | default(false) | bool }}"

      - if:
          - condition: template
            value_template: "{{ should_cancel_program }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.rainbird_program_running

          - action: input_number.set_value
            target:
              entity_id: input_number.rainbird_program_step
            data:
              value: 0

      - action: switch.turn_off
        target:
          entity_id: *rainbird_zones_script
        continue_on_error: true

      - action: timer.cancel
        target:
          entity_id: timer.rainbird_time_left

      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.rainbird_command_pending
            - input_boolean.rainbird_last_start_confirmed

      - if:
          - condition: template
            value_template: "{{ should_cancel_program }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.rainbird_last_message
            data:
              value: Sproeien gestopt.

automation:
  - alias: RainBird - Stop when shared timer finishes
    id: rainbird_stop_when_shared_timer_finishes
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.rainbird_time_left
    actions:
      - action: script.rainbird_stop_all_zones
        data:
          cancel_program: false

  # "Automatisch sproeien": at the start time on the chosen days, run the
  # program. The whole day is skipped, and logged with its reason, when it
  # rains, a rain delay is set, or something already runs. Paused zones are
  # logged as skipped and the rest runs. While the schedule is off nothing is
  # logged per day; switching it off and on is logged instead (below).
  - alias: RainBird - Schema
    id: rainbird_schema
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.rainbird_schema_starttijd
    conditions:
      - condition: state
        entity_id: input_boolean.rainbird_schema_actief
        state: "on"
      - condition: template
        value_template: >-
          {% set dagen = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'] %}
          {{ is_state('input_boolean.rainbird_schema_' ~ dagen[now().weekday()], 'on') }}
      # Minutes on at least one zone, paused or not, so a day with only
      # paused zones is still logged.
      - condition: template
        value_template: >-
          {% set ns = namespace(minuten=0) %}
          {% for i in range(1, 5) %}
            {% set ns.minuten = ns.minuten
                 + states('input_number.rainbird_program_zone_' ~ i ~ '_duration') | int(0) %}
          {% endfor %}
          {{ ns.minuten > 0 }}
    actions:
      - variables:
          reden: >-
            {% if is_state('binary_sensor.rain_bird_controller_rainsensor', 'on') %}
              regen gemeten
            {% elif states('number.rain_bird_controller_rain_delay') | int(0) > 0 %}
              regenpauze
            {% elif is_state('binary_sensor.rainbird_bezig', 'on') %}
              er sproeide al iets
            {% endif %}
          # Names of the paused zones that have minutes, e.g. "Gras + Achtertuin".
          gepauzeerd: >-
            {% set ns = namespace(namen=[]) %}
            {% for i in range(1, 5)
                 if is_state('input_boolean.rainbird_pauze_zone_' ~ i, 'on')
                 and states('input_number.rainbird_program_zone_' ~ i ~ '_duration') | int(0) > 0 %}
              {% set ns.namen = ns.namen
                   + [state_attr('switch.rain_bird_sprinkler_' ~ i, 'friendly_name') or 'Zone ' ~ i] %}
            {% endfor %}
            {{ ns.namen | join(' + ') }}
      - if:
          - condition: template
            value_template: "{{ reden | length > 0 }}"
        then:
          - event: rainbird_logboek
            event_data:
              soort: overgeslagen
              zone: ""
              bron: Schema
              reden: "{{ reden }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.rainbird_last_message
            data:
              value: "Schema overgeslagen: {{ reden }}."
        else:
          - if:
              - condition: template
                value_template: "{{ gepauzeerd | length > 0 }}"
            then:
              - event: rainbird_logboek
                event_data:
                  soort: overgeslagen
                  zone: ""
                  naam: "{{ gepauzeerd }}"
                  bron: Schema
                  reden: gepauzeerd
          - if:
              - condition: template
                value_template: "{{ states('sensor.rainbird_program_total_duration') | int(0) > 0 }}"
            then:
              # After the log entry above has been written.
              - delay: "00:00:02"
              - action: script.turn_on
                target:
                  entity_id: script.rainbird_run_program
                data:
                  variables:
                    bron: Schema

  # Pausing or resuming a zone and switching the schedule off or on, with the
  # person who did it (from the change's user), into the log.
  - alias: RainBird - Instellingen in logboek
    id: rainbird_instellingen_logboek
    mode: queued
    triggers:
      - trigger: state
        entity_id: &rainbird_instellingen
          - input_boolean.rainbird_schema_actief
          - input_boolean.rainbird_pauze_zone_1
          - input_boolean.rainbird_pauze_zone_2
          - input_boolean.rainbird_pauze_zone_3
          - input_boolean.rainbird_pauze_zone_4
        from: "off"
        to: "on"
      - trigger: state
        entity_id: *rainbird_instellingen
        from: "on"
        to: "off"
    actions:
      - variables:
          aan: "{{ trigger.to_state.state == 'on' }}"
          schema: "{{ trigger.entity_id == 'input_boolean.rainbird_schema_actief' }}"
          gebruiker: "{{ trigger.to_state.context.user_id }}"
          wie: >-
            {% if gebruiker %}
              {{ states.person | selectattr('attributes.user_id', 'eq', gebruiker)
                 | map(attribute='name') | first | default('Onbekend') }}
            {% else %}
              Automatisch
            {% endif %}
      - event: rainbird_logboek
        event_data:
          soort: >-
            {% if schema %}{{ 'aan' if aan else 'uit' }}{% else %}{{ 'pauze' if aan else 'hervat' }}{% endif %}
          zone: >-
            {{ '' if schema else 'switch.rain_bird_sprinkler_' ~ trigger.entity_id[-1] }}
          bron: "{{ wie }}"
      # Space the events out, so the log writes one before the next.
      - delay: "00:00:02"
