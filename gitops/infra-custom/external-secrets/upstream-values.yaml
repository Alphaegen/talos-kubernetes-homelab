installCRDs: true
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
# Requests from observed use (KRR, max + 15%); memory limit about 2x; no CPU limit.
resources:
  requests: {cpu: 30m, memory: 176Mi}
  limits: {memory: 352Mi}
webhook:
  create: true
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 112Mi}
certController:
  create: true
  resources:
    requests: {cpu: 10m, memory: 80Mi}
    limits: {memory: 160Mi}
