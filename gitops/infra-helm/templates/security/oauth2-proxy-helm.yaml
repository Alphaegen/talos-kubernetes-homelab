{{- define "app.oauth2-proxy" }}
name: oauth2-proxy-{{ .instance }}
appLabel: oauth2-proxy
# The Pocket ID Application owns the auth Namespace.
namespace: auth
# Needs Pocket ID (also wave 2) for OIDC discovery at startup; it restarts
# until Pocket ID answers (docs/adr/0001-three-sync-waves.md).
wave: 2
project: platform
cascadeDelete: true
sources:
  - repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    version: {{ .root.Values.security.oauth2Proxy.version | quote }}
    helm:
      releaseName: oauth2-proxy-{{ .instance }}
      valueFiles:
        - $values/gitops/infra-custom/oauth2-proxy/values.yaml
        - $values/gitops/infra-custom/oauth2-proxy/{{ .instance }}-values.yaml
{{ end }}
{{- if and .Values.security.enabled .Values.security.oauth2Proxy.enabled }}
{{- range .Values.security.oauth2Proxy.instances }}
---
{{ include "infra.application" (dict "root" $ "app" (include "app.oauth2-proxy" (dict "root" $ "instance" .) | fromYaml)) }}
{{- end }}
{{- end }}
