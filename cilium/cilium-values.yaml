ipam:
  mode: kubernetes

kubeProxyReplacement: true

# Preserve the established overlay and automatic interface/MTU discovery.
routingMode: tunnel
tunnelProtocol: vxlan
MTU: 0
devices: ""

bpf:
  masquerade: false

policyEnforcementMode: default

# Preserve compatibility with the initial Cilium installation throughout the
# approved adjacent-version upgrade path.
upgradeCompatibility: "1.18"

# Limit the networking rollout to one node at a time.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

# Keep the node network in Burstable QoS so memory pressure targets ordinary
# workloads before it can tear down networking and attached storage sessions.
resources:
  requests:
    cpu: 100m
    memory: 448Mi
  limits:
    memory: 1Gi

# Agent init containers (config, mount-bpf-fs, sysctls, clean state).
initResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 256Mi

# Metrics for kube-prometheus-stack (selects `release: kube-prometheus-stack`).
# The chart-provided dashboards are picked up by the Grafana dashboard sidecar.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: kube-prometheus-stack
    # Rendered offline by kustomize, so the chart cannot detect the CRDs itself.
    trustCRDsExist: true

dashboards:
  enabled: true

gatewayAPI:
  enabled: true
  gatewayClass:
    # Use explicit true so GatewayClass is created even when CRDs are installed after Cilium.
    create: "true"
  # Negotiate HTTP/2 with clients (the argocd CLI's gRPC requires it). This also
  # enables appProtocol support: backends stay HTTP/1.1 unless their Service
  # port sets an appProtocol such as kubernetes.io/h2c.
  enableAlpn: true

envoy:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
  # Gateway data path: keep extra memory headroom above observed use.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  prometheus:
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        release: kube-prometheus-stack

operator:
  replicas: 2
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 192Mi
  prometheus:
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        release: kube-prometheus-stack
  dashboards:
    enabled: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Point Cilium directly at the API server (common on Talos / no kube-proxy)
k8sServiceHost: localhost
k8sServicePort: 7445

# k8sServiceHost: 192.168.3.100
# k8sServicePort: 6443

hubble:
  # Namespace-level labels keep series counts small; no IP labels.
  metrics:
    enabled:
      - dns:labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - tcp:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - port-distribution:labelsContext=source_namespace,destination_namespace
      - icmp:labelsContext=source_namespace,destination_namespace
      - policy:labelsContext=source_namespace,destination_namespace
      - httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        release: kube-prometheus-stack
    dashboards:
      enabled: true
  ui:
    enabled: true
    ingress:
      enabled: false
    frontend:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 80Mi
    backend:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 96Mi
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

ipv4:
  enabled: true

ipv6:
  enabled: true

# Usually needed so pods can reach the IPv6 internet (egress)
enableIPv6Masquerade: true
# (Optional, usually already on)
enableIPv4Masquerade: true
