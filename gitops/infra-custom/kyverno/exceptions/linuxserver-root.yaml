# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/policies.kyverno.io/policyexception_v1.json
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: linuxserver-root
  namespace: kyverno
spec:
  properties:
    reason: >-
      linuxserver.io images start as root under s6-overlay, fix file
      ownership, then drop to PUID/PGID. They cannot start with
      runAsNonRoot, and keep CHOWN, DAC_OVERRIDE, FOWNER, SETGID and SETUID
      after dropping all other capabilities.
  policyRefs:
    - name: pss-restricted-run-as-non-root
      kind: ValidatingPolicy
    - name: pss-restricted-capabilities
      kind: ValidatingPolicy
  # Since Kyverno 1.20 a controller's object has the pod spec in place of
  # its own, so the app label must be on the controller's metadata as well.
  matchConditions:
    - name: linuxserver-root
      expression: >-
        object.metadata.namespace == 'media' &&
        object.metadata.?labels[?'app'].orValue('') in ['bazarr', 'prowlarr', 'radarr', 'sonarr']
