deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 40Gi
    enableStatefulSetAutoDeletePVC: true
    enableStatefulSetRecreationForSizeChange: true
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests: {cpu: 200m, memory: 384Mi}
    limits: {cpu: "1", memory: 1536Mi}
simpleScalable: {replicas: 0, backend: {replicas: 0}, read: {replicas: 0}, write: {replicas: 0}}
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  limits_config: {retention_period: 168h}
  compactor: {retention_enabled: true, delete_request_store: filesystem, working_directory: /var/loki/compactor}
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_tsdb_index_, period: 24h}
gateway: {enabled: true}
