{{- if and .Values.security.enabled .Values.security.keycloak.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "keycloak") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: keycloak
  namespace: {{ .Values.cluster.namespace | quote }}
  annotations:
    # Stage 1: optional stateful identity service after storage foundations.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: security
  syncPolicy:
    {{- include "infra.syncPolicy" . | nindent 4 }}
    syncOptions:
      - FailOnSharedResource=true
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: {{ .Values.security.keycloak.version | quote }}
    helm:
      values: |
        # Stable Service name for the HTTPRoute below.
        fullnameOverride: keycloak
        production: true
        # TLS terminates at the shared Cilium Gateway, which sets X-Forwarded-*.
        proxyHeaders: xforwarded
        httpRelativePath: "/"
        replicaCount: 2

        auth:
          adminUser: admin
          existingSecret: keycloak-admin-secret
          passwordSecretKey: admin-password

        persistence:
          enabled: true
          size: 10Gi
          storageClass: longhorn

        postgresql:
          enabled: true
          primary:
            persistence:
              enabled: true
              size: 10Gi
              storageClass: longhorn

        # The chart has no HTTPRoute support; expose it on the shared Gateway.
        extraDeploy:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: keycloak
            spec:
              parentRefs:
                # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
                - name: cilium-gateway
                  namespace: kube-system
                  sectionName: https
              hostnames:
                - {{ printf "keycloak.%s.nl" .Values.cluster.name | quote }}
              rules:
                # 0s disables Envoy's default 15s route timeout.
                - timeouts:
                    request: 0s
                  matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: keycloak
                      port: 80
{{- end }}
