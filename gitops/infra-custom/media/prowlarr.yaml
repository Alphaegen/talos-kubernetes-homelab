apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
  labels:
    app.kubernetes.io/name: prowlarr
    homelab.niekvlam.nl/base: linuxserver
    homelab.niekvlam.nl/indexer-backoff-reset: "true"
spec:
  selector: { matchLabels: { app: prowlarr } }
  template:
    metadata: { labels: { app: prowlarr, app.kubernetes.io/name: prowlarr } }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:3.0.2.5780-ls169
          resources:
            requests:
              cpu: 50m
              memory: 240Mi
            limits:
              cpu: "1"
              memory: 512Mi
          ports: [{ name: http, containerPort: 9696 }]
          env:
            - name: DOTNET_SYSTEM_NET_DISABLEIPV6
              value: "1"
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - {
            name: config,
            persistentVolumeClaim: { claimName: prowlarr-config },
          }
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
spec:
  selector: { app: prowlarr }
  ports:
    - { name: http, port: 9696, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: media
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames: ["prowlarr.homelab.niekvlam.nl"]
  rules:
    # 0s disables Envoy's default 15s route timeout; indexer searches can take longer.
    - timeouts: { request: 0s }
      matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: prowlarr, port: 9696 }
