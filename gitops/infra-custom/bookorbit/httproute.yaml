apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  namespace: bookorbit
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - bookorbit.homelab.niekvlam.nl
  rules:
    # 0s disables Envoy's default 15s route timeout, which would cut off large
    # uploads. Envoy sets no request body limit, unlike the Ingress's 512m.
    - timeouts:
        request: 0s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bookorbit
          port: 3000
