replicas: 1

deploymentStrategy:
  type: Recreate

grafana.ini:
  metrics:
    enabled: true

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 30s

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

downloadDashboards:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# The chart's generated download script masks curl failures in sed pipelines.
# Retry if that leaves an empty dashboard and fail startup rather than loading it.
extraInitContainers:
  - name: validate-downloaded-dashboards
    image: docker.io/curlimages/curl:8.9.1
    command: ["/bin/sh", "-ec"]
    args:
      - |
        dashboard_files="$(sed -n 's/^> "\(.*\)"$/\1/p' /etc/grafana/download_dashboards.sh)"
        downloads_are_valid() {
          for dashboard_file in $dashboard_files; do
            if [ ! -s "$dashboard_file" ]; then
              echo "Downloaded dashboard is empty: $dashboard_file" >&2
              return 1
            fi
          done
        }

        attempt=1
        until downloads_are_valid; do
          if [ "$attempt" -gt 5 ]; then
            echo "Dashboard download remained empty after five retries" >&2
            exit 1
          fi
          echo "Retrying empty dashboard download (attempt $attempt/5)"
          /bin/sh /etc/grafana/download_dashboards.sh
          attempt=$((attempt + 1))
          sleep 5
        done
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
      - name: config
        mountPath: /etc/grafana/download_dashboards.sh
        subPath: download_dashboards.sh
      - name: storage
        mountPath: /var/lib/grafana

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        allowUiUpdates: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  dashboards:
    enabled: true
    skipReload: true
    labelValue: "1"
    searchNamespace: ALL
    label: grafana_dashboard
    env:
      HEALTH_PORT: "8084"
  datasources:
    enabled: true
    skipReload: true
    env:
      HEALTH_PORT: "8082"

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-dns
  hosts: ["grafana.homelab.niekvlam.nl"]
  tls:
    - secretName: grafana-tls
      hosts: ["grafana.homelab.niekvlam.nl"]

persistence:
  enabled: true
  type: pvc
  storageClassName: longhorn
  accessModes: ["ReadWriteOnce"]
  size: 10Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.monitoring.svc:80
