title: Thuis
path: thuis
icon: mdi:home
type: sections
max_columns: 4
dense_section_placement: true
theme: Homelab
badges:
  - type: entity
    entity: weather.forecast_home
    show_name: false
  - type: entity
    entity: sensor.afval_ophaalschema
    name: Afval
    show_name: true
    tap_action:
      action: navigate
      navigation_path: '#afval'
  # What the house uses now (solar included) and today (packages/energie.yaml).
  - type: entity
    entity: sensor.stroomverbruik_nu
    name: Verbruik
    show_name: true
    state_content:
      - state
      - vandaag
    tap_action:
      action: navigate
      navigation_path: /dashboard-thuis/energie
  # No person badges: Home Assistant is only reachable at home, so the phones
  # can never report being away.

sections:
  # On a phone the sections stack in this order.
  - type: grid
    cards:
      - type: heading
        heading: Weer
        icon: mdi:weather-partly-cloudy
      - type: weather-forecast
        entity: weather.forecast_home
        show_current: true
        show_forecast: true
        forecast_type: daily

  - type: grid
    cards:
      - type: heading
        heading: Afval
        icon: mdi:trash-can
        tap_action:
          action: navigate
          navigation_path: '#afval'
      # Titled with the next bin type itself (packages/afval.yaml), in its
      # colour, with the day and countdown underneath.
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.afval_ophaalschema
        name: Afval
        icon: mdi:trash-can
        show_state: true
        card_layout: large
        grid_options:
          columns: full
        button_action:
          tap_action:
            action: navigate
            navigation_path: '#afval'
        styles: |
          .bubble-main-icon-container {
            background-color: rgba(var(--afval-kleur, 158, 158, 158), 0.22) !important;
          }
          .bubble-main-icon {
            color: rgb(var(--afval-kleur, 158, 158, 158)) !important;
          }
          ${(() => {
            const s = hass.states['sensor.afval_ophaalschema'];
            const soort = (s?.state || '').split(' + ')[0];
            const kleur = {
              GFT: '76, 175, 80',
              PMD: '255, 152, 0',
              Papier: '66, 133, 244',
              Restafval: '158, 158, 158',
            }[soort];
            if (kleur) card.style.setProperty('--afval-kleur', kleur);
            else card.style.removeProperty('--afval-kleur');
            const naam = card.querySelector('.bubble-name');
            if (naam && s) naam.innerText = s.state;
            const tekst = card.querySelector('.bubble-state');
            if (tekst && s) tekst.innerText = s.attributes.wanneer || '';
            const icoon = card.querySelector('.bubble-main-icon');
            if (icoon && s?.attributes.icoon) icoon.setAttribute('icon', s.attributes.icoon);
            return '';
          })()}

  # Today's totals from packages/energie.yaml, two by two.
  - type: grid
    cards:
      - type: heading
        heading: Energie vandaag
        icon: mdi:lightning-bolt
        tap_action:
          action: navigate
          navigation_path: /dashboard-thuis/energie
      - type: tile
        entity: sensor.zon_opgewekt_vandaag
        name: Zon opgewekt
        icon: mdi:solar-power-variant
        color: amber
        grid_options:
          columns: 6
        tap_action:
          action: navigate
          navigation_path: /dashboard-thuis/energie
      - type: tile
        entity: sensor.stroomverbruik_vandaag
        name: Verbruikt
        icon: mdi:home-lightning-bolt
        color: teal
        grid_options:
          columns: 6
        tap_action:
          action: navigate
          navigation_path: /dashboard-thuis/energie
      - type: tile
        entity: sensor.stroom_teruggeleverd_vandaag
        name: Teruggeleverd
        icon: mdi:transmission-tower-export
        color: purple
        grid_options:
          columns: 6
        tap_action:
          action: navigate
          navigation_path: /dashboard-thuis/energie
      - type: tile
        entity: sensor.stroom_afgenomen_vandaag
        name: Afgenomen
        icon: mdi:transmission-tower-import
        color: blue
        grid_options:
          columns: 6
        tap_action:
          action: navigate
          navigation_path: /dashboard-thuis/energie

  - type: grid
    cards:
      - type: heading
        heading: Licht
        icon: mdi:lamps
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: light.woonkamer_lampen
        name: Woonkamer
        icon: mdi:lamps
        show_state: true
        card_layout: large
        grid_options:
          columns: full
        sub_button:
          - entity: switch.woonkamer_sfeerverlichting
            name: Sfeer
            icon: mdi:string-lights
            show_background: true
            state_background: true
            tap_action:
              action: toggle
          - name: Alle lampen
            icon: mdi:tune-variant
            show_background: true
            tap_action:
              action: navigate
              navigation_path: '#verlichting'
        # Warm amber when on, with dark text for contrast, and the state line
        # counts the lamps of the group that are on.
        styles: |
          .bubble-button-background {
            background-color: ${state === 'on' ? 'rgb(246, 173, 85)' : ''} !important;
            opacity: ${state === 'on' ? '1' : ''} !important;
          }
          .bubble-main-icon-container {
            background-color: ${state === 'on' ? 'rgba(255, 255, 255, 0.4)' : ''} !important;
          }
          .bubble-main-icon, .bubble-name, .bubble-state {
            color: ${state === 'on' ? '#3a2300' : ''} !important;
          }
          .bubble-sub-button {
            background-color: ${state === 'on' ? 'rgba(58, 35, 0, 0.12)' : ''} !important;
            color: ${state === 'on' ? '#3a2300' : ''} !important;
          }
          .bubble-sub-button.background-on {
            background-color: ${state === 'on' ? 'rgba(255, 255, 255, 0.55)' : 'rgb(246, 173, 85)'} !important;
            color: #3a2300 !important;
          }
          ${(() => {
            const ids = hass.states['light.woonkamer_lampen']?.attributes.entity_id || [];
            const on = ids.filter((id) => hass.states[id]?.state === 'on').length;
            const el = card.querySelector('.bubble-state');
            if (el) el.innerText = on ? `Aan · ${on} van ${ids.length} lampen` : 'Uit';
            return '';
          })()}

  - type: grid
    # Full width on a tablet; at half width the climate controls squeeze the name.
    column_span: 2
    cards:
      - type: heading
        heading: Airco
        icon: mdi:air-conditioner
        badges:
          - type: entity
            entity: binary_sensor.airco_boven_slaapperiode
            show_state: true
            color: indigo
            visibility:
              - condition: state
                entity: binary_sensor.airco_boven_slaapperiode
                state: "on"
      - type: custom:bubble-card
        card_type: climate
        entity: climate.airco_boven
        name: Boven
        icon: mdi:stairs-up
        state_color: true
        show_state: true
        show_attribute: true
        attribute: current_temperature
        step: 1
        card_layout: large
        grid_options:
          columns: full
        button_action:
          tap_action:
            action: navigate
            navigation_path: '#airco-boven'
        sub_button:
          - entity: sensor.airco_boven_filter_remaining_life
            name: Filter
            icon: mdi:air-filter
            show_state: true
            show_background: true
            tap_action:
              action: navigate
              navigation_path: '#airco-boven'
          - entity: input_boolean.airco_boven_automation
            name: Automatisch
            icon: mdi:robot
            show_background: true
            state_background: true
            tap_action:
              action: toggle
        styles: |
          .bubble-sub-button-1 {
            background-color: ${(() => {
              const life = parseFloat(hass.states['sensor.airco_boven_filter_remaining_life']?.state);
              if (isNaN(life)) return '';
              return life < 10 ? 'var(--error-color)' : life < 30 ? 'var(--warning-color)' : 'var(--success-color)';
            })()} !important;
            color: var(--text-primary-color) !important;
          }
      - type: custom:bubble-card
        card_type: climate
        entity: climate.airco_beneden
        name: Beneden
        icon: mdi:stairs-down
        state_color: true
        show_state: true
        show_attribute: true
        attribute: current_temperature
        step: 1
        card_layout: large
        grid_options:
          columns: full
        button_action:
          tap_action:
            action: navigate
            navigation_path: '#airco-beneden'
        sub_button:
          - entity: sensor.airco_beneden_filter_remaining_life
            name: Filter
            icon: mdi:air-filter
            show_state: true
            show_background: true
            tap_action:
              action: navigate
              navigation_path: '#airco-beneden'
          - entity: input_boolean.airco_beneden_automation
            name: Automatisch
            icon: mdi:robot
            show_background: true
            state_background: true
            tap_action:
              action: toggle
        styles: |
          .bubble-sub-button-1 {
            background-color: ${(() => {
              const life = parseFloat(hass.states['sensor.airco_beneden_filter_remaining_life']?.state);
              if (isNaN(life)) return '';
              return life < 10 ? 'var(--error-color)' : life < 30 ? 'var(--warning-color)' : 'var(--success-color)';
            })()} !important;
            color: var(--text-primary-color) !important;
          }

  # Only while watering, so it does not take space otherwise. The same card
  # as on the Tuin view, with Stop.
  - type: grid
    visibility:
      - condition: state
        entity: binary_sensor.rainbird_bezig
        state: "on"
    cards:
      - type: heading
        heading: Tuin
        icon: mdi:sprinkler-variant
        tap_action:
          action: navigate
          navigation_path: /dashboard-thuis/tuin
      - !include tuin-nu.yaml

  # Pop-ups and navigation: they render as overlays, and the navigation bar
  # must be the last card of the view.
  - type: grid
    cards:
      - !include popup-verlichting.yaml
      - !include popup-airco-boven.yaml
      - !include popup-airco-beneden.yaml
      - !include popup-afval.yaml
      - !include nav.yaml
