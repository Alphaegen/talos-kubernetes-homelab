apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/part-of: homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-github
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        # The ClusterSecretStore already selects the Homelab vault.
        key: "Renovate-Homelab Github Token/token"
