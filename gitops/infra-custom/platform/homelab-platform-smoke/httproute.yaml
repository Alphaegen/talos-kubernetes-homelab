apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homelab-platform-smoke
  namespace: homelab-platform
  labels:
    app.kubernetes.io/name: homelab-platform-smoke
    app.kubernetes.io/part-of: homelab-platform
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - smoke.homelab.niekvlam.nl
  rules:
    # 0s disables Envoy's default 15s route timeout (Gateway API: zero = no timeout).
    - timeouts:
        request: 0s
      backendRefs:
        - name: homelab-platform-smoke
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
