# Bottom navigation. Bubble Card requires it to be the last card of the view.
type: custom:bubble-card
card_type: horizontal-buttons-stack
highlight_current_view: true
1_name: Thuis
1_icon: mdi:home
1_link: /dashboard-thuis/thuis
2_name: Energie
2_icon: mdi:lightning-bolt
2_link: /dashboard-thuis/energie
3_name: Klimaat
3_icon: mdi:air-conditioner
3_link: /dashboard-thuis/klimaat
4_name: Tuin
4_icon: mdi:sprinkler-variant
4_link: /dashboard-thuis/tuin
5_name: Meldingen
5_icon: mdi:bell
5_link: /dashboard-thuis/meldingen
# Bubble caps the bar at ~490px and scrolls the rest, too narrow for five
# labelled buttons (~590px): let it grow to 640px. When the bar itself is
# narrower than that (a phone, or a tablet with the sidebar open), show icons
# only. Bubble re-measures the buttons and repositions them.
styles: |
  .horizontal-buttons-stack-card {
    container-type: inline-size;
  }
  .horizontal-buttons-stack-card .card-content {
    max-width: min(640px, calc(100% - 16px)) !important;
  }
  @container (max-width: 640px) {
    .bubble-name { display: none !important; }
    .bubble-button { padding: 0 16px !important; }
  }
