# Sends argocd CLI gRPC and gRPC-web requests to the h2c service port; the
# chart's HTTPRoute can only target the HTTP/1.1 port. The header match makes
# this rule take precedence over the chart's catch-all rule on the same host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-grpc
  namespace: argocd
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames: [ "argocd.homelab.niekvlam.nl" ]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: content-type
              type: RegularExpression
              value: "^application/grpc"
      backendRefs:
        - name: argocd-server
          port: 81
      # 0s disables Envoy's default 15s route timeout, which would cut
      # streaming calls such as `argocd app logs -f`.
      timeouts:
        request: 0s
