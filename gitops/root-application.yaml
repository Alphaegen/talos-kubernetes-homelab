# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
# This is the handoff point after the manual Argo CD installation and bootstrap
# credential steps. It deliberately remains in the built-in project: the
# homelab AppProject is rendered by the chart it reconciles.
# The name must stay `app-of-apps`: the child Applications and AppProject are
# tracked under that name, and a root with any other name conflicts with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Keep in sync with infra.syncPolicy in gitops/infra-helm/templates/_helpers.tpl.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - FailOnSharedResource=true
      - PruneLast=true
  source:
    repoURL: https://github.com/Alphaegen/talos-kubernetes-homelab.git
    targetRevision: main
    path: gitops/infra-helm
    helm:
      releaseName: infra-apps
