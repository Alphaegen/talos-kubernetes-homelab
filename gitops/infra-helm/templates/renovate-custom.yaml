{{- define "app.renovate" }}
name: renovate
# The Kustomization owns the Namespace manifest.
namespace: {{ .Values.renovate.namespace | default "renovate" | quote }}
# External Secrets and its ClusterSecretStore are installed in wave 0.
wave: 1
project: platform
sources:
  - path: gitops/infra-custom/renovate
{{ end }}
{{- if .Values.renovate.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.renovate" . | fromYaml)) }}
{{- end }}
