# Prowlarr serves the indexer (Torznab/Newznab) feeds Sonarr and Radarr search.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowlarr
  namespace: media
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [radarr, sonarr]
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
---
# Prowlarr syncs indexers into them; Seerr sends requests; Bazarr and Profilarr
# read and manage them.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sonarr
  namespace: media
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [bazarr, profilarr, prowlarr, seerr]
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
