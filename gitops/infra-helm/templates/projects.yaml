{{- $server := .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/appproject_v1alpha1.json
# Platform services: controllers, operators, storage, networking, monitoring
# and auth. They install CRDs, webhooks and cluster RBAC, so cluster-scoped
# resources are allowed, but only into the namespaces listed here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ include "infra.platformProject" . }}
  namespace: {{ .Values.cluster.namespace }}
  annotations:
    # The root Application renders the projects with the child Applications.
    # Reconcile them first so project references are valid on a fresh cluster.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster platform services
  sourceRepos:
  - {{ .Values.cluster.repoURL | quote }}
  - https://aquasecurity.github.io/helm-charts
  - https://argoproj.github.io/argo-helm
  - https://charts.external-secrets.io
  - https://charts.jetstack.io
  - https://charts.longhorn.io
  - https://grafana-community.github.io/helm-charts
  - https://grafana.github.io/helm-charts
  - https://kubernetes-sigs.github.io/metrics-server/
  - https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
  - https://kyverno.github.io/kyverno
  - https://kyverno.github.io/policy-reporter
  - https://metallb.github.io/metallb
  - https://oauth2-proxy.github.io/manifests
  - https://pkgs.tailscale.com/helmcharts
  - https://prometheus-community.github.io/helm-charts
  destinations:
  {{- range list "argo-rollouts" "auth" "cert-manager" "default" "etcd-backup" "external-secrets" "kube-system" "kubelet-serving-cert-approver" "kyverno" "longhorn-system" "metallb-system" "monitoring" "nfs-provisioner" "pi5-fan-control" "policy-reporter" "renovate" "tailscale" "trivy-system" }}
  - namespace: {{ . }}
    server: {{ $server }}
  {{- end }}
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/appproject_v1alpha1.json
# User-facing apps: each gets its own namespace and nothing cluster-wide
# except that Namespace and statically provisioned NFS PersistentVolumes.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ include "infra.appsProject" . }}
  namespace: {{ .Values.cluster.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: User-facing applications
  sourceRepos:
  - {{ .Values.cluster.repoURL | quote }}
  - http://pajikos.github.io/home-assistant-helm-chart/
  destinations:
  {{- range list "bookorbit" "home-assistant" "home-automation" "homelab-platform" "media" "obsidian-livesync" }}
  - namespace: {{ . }}
    server: {{ $server }}
  {{- end }}
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: ''
    kind: PersistentVolume
