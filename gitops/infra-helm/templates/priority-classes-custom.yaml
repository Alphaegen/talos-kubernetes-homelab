{{- define "app.priority-classes" }}
name: priority-classes
namespace: kube-system
# Cluster-scoped classes before the workloads that reference them.
wave: 0
project: platform
cascadeDelete: true
sources:
  - path: gitops/infra-custom/priority-classes
{{ end }}
{{- if .Values.priorityClasses.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.priority-classes" . | fromYaml)) }}
{{- end }}
