# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/policies.kyverno.io/policyexception_v1.json
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: linuxserver-root
  namespace: kyverno
spec:
  properties:
    reason: >-
      Images built on s6-overlay (linuxserver.io and qBittorrent) start as
      root, fix file ownership, then drop to PUID/PGID. They cannot start with
      runAsNonRoot, and keep CHOWN, DAC_OVERRIDE, FOWNER, SETGID and SETUID
      after dropping all other capabilities.
  policyRefs:
    - name: pss-restricted-run-as-non-root
      kind: ValidatingPolicy
    - name: pss-restricted-capabilities
      kind: ValidatingPolicy
  # Follows the media linuxserver base (gitops/infra-custom/media/components/
  # linuxserver), which labels the Deployment's own metadata: since Kyverno
  # 1.20 exception conditions see that, not the pod template.
  matchConditions:
    - name: linuxserver-root
      expression: >-
        object.metadata.namespace == 'media' &&
        object.metadata.?labels[?'homelab.niekvlam.nl/base'].orValue('') == 'linuxserver'
