livenessProbe:
  httpGet: {path: /ready, port: http-metrics}
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  httpGet: {path: /ready, port: http-metrics}
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 192Mi}
extraVolumes:
  - name: positions
    hostPath: {path: /var/lib/promtail, type: DirectoryOrCreate}
extraVolumeMounts:
  - name: positions
    mountPath: /var/lib/promtail
    readOnly: false
config:
  positions: {filename: /var/lib/promtail/positions.yaml}
  clients:
    - url: http://loki-gateway.monitoring.svc:80/loki/api/v1/push
  snippets:
    pipelineStages:
      - cri: {}
      - match:
          selector: '{app="cp-link-watchdog"}'
          stages:
            - logfmt:
                mapping: {event: null, node: null, iface: null, gateway: null, fails: null, threshold: null}
            - labels: {event: null, node: null, iface: null, gateway: null}
