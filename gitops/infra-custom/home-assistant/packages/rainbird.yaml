# Rain Bird irrigation (four zones) for the Tuin view of the Thuis dashboard
# (dashboards/view-tuin.yaml).
#
# Zones only start through script.rainbird_start_single_zone. It turns the
# other zones off first and sends the duration along, so the controller stops
# the zone by itself, even when Home Assistant goes away halfway. The shared
# timer only mirrors that countdown for the dashboard.
#
# The schedule ("Automatisch sproeien") lives here, not on the controller.
# Switch the controller's own programs off in the Rain Bird app, or zones run
# twice. Every zone has its own days and two start times, each with its own
# minutes (0 switches that time off). The controller runs one zone at a time,
# so starts that coincide, or fall while something runs, wait their turn.
#
# sensor.rainbird_logboek records every zone run the integration sees, also
# runs started on the controller or in the Rain Bird app. The integration
# polls once a minute, so start times and durations are accurate to about a
# minute.
input_number:
  # Manual start, from the zone pop-ups.
  rainbird_duration:
    name: Sproeiduur handmatig
    min: 5
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-outline

  # Minutes for each start time of each zone's schedule; 0 switches that
  # start time off.
  rainbird_zone_1_minuten_1:
    name: Gras minuten 1
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:grass
  rainbird_zone_1_minuten_2:
    name: Gras minuten 2
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:grass
  rainbird_zone_2_minuten_1:
    name: Achtertuin minuten 1
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:flower
  rainbird_zone_2_minuten_2:
    name: Achtertuin minuten 2
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:flower
  rainbird_zone_3_minuten_1:
    name: Voortuin + zijkant minuten 1
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:home-variant-outline
  rainbird_zone_3_minuten_2:
    name: Voortuin + zijkant minuten 2
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:home-variant-outline
  rainbird_zone_4_minuten_1:
    name: Druppelslang minuten 1
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:water-outline
  rainbird_zone_4_minuten_2:
    name: Druppelslang minuten 2
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:water-outline

input_boolean:
  rainbird_command_pending:
    name: RainBird Command Pending
    icon: mdi:progress-clock

  rainbird_last_start_confirmed:
    name: RainBird Last Start Confirmed
    icon: mdi:check-circle-outline

  # The main switch for the whole schedule.
  rainbird_schema_actief:
    name: Automatisch sproeien
    icon: mdi:calendar-clock

  # A paused zone keeps its days and times but is skipped by the schedule
  # until it is switched back. Manual starts still work.
  rainbird_pauze_zone_1:
    name: Pauze Gras
    icon: mdi:pause-circle-outline
  rainbird_pauze_zone_2:
    name: Pauze Achtertuin
    icon: mdi:pause-circle-outline
  rainbird_pauze_zone_3:
    name: Pauze Voortuin + zijkant
    icon: mdi:pause-circle-outline
  rainbird_pauze_zone_4:
    name: Pauze Druppelslang
    icon: mdi:pause-circle-outline

  # The days each zone runs, by Dutch abbreviation (ma = Monday).
  rainbird_zone_1_ma:
    name: Gras op maandag
    icon: mdi:calendar
  rainbird_zone_1_di:
    name: Gras op dinsdag
    icon: mdi:calendar
  rainbird_zone_1_wo:
    name: Gras op woensdag
    icon: mdi:calendar
  rainbird_zone_1_do:
    name: Gras op donderdag
    icon: mdi:calendar
  rainbird_zone_1_vr:
    name: Gras op vrijdag
    icon: mdi:calendar
  rainbird_zone_1_za:
    name: Gras op zaterdag
    icon: mdi:calendar
  rainbird_zone_1_zo:
    name: Gras op zondag
    icon: mdi:calendar
  rainbird_zone_2_ma:
    name: Achtertuin op maandag
    icon: mdi:calendar
  rainbird_zone_2_di:
    name: Achtertuin op dinsdag
    icon: mdi:calendar
  rainbird_zone_2_wo:
    name: Achtertuin op woensdag
    icon: mdi:calendar
  rainbird_zone_2_do:
    name: Achtertuin op donderdag
    icon: mdi:calendar
  rainbird_zone_2_vr:
    name: Achtertuin op vrijdag
    icon: mdi:calendar
  rainbird_zone_2_za:
    name: Achtertuin op zaterdag
    icon: mdi:calendar
  rainbird_zone_2_zo:
    name: Achtertuin op zondag
    icon: mdi:calendar
  rainbird_zone_3_ma:
    name: Voortuin + zijkant op maandag
    icon: mdi:calendar
  rainbird_zone_3_di:
    name: Voortuin + zijkant op dinsdag
    icon: mdi:calendar
  rainbird_zone_3_wo:
    name: Voortuin + zijkant op woensdag
    icon: mdi:calendar
  rainbird_zone_3_do:
    name: Voortuin + zijkant op donderdag
    icon: mdi:calendar
  rainbird_zone_3_vr:
    name: Voortuin + zijkant op vrijdag
    icon: mdi:calendar
  rainbird_zone_3_za:
    name: Voortuin + zijkant op zaterdag
    icon: mdi:calendar
  rainbird_zone_3_zo:
    name: Voortuin + zijkant op zondag
    icon: mdi:calendar
  rainbird_zone_4_ma:
    name: Druppelslang op maandag
    icon: mdi:calendar
  rainbird_zone_4_di:
    name: Druppelslang op dinsdag
    icon: mdi:calendar
  rainbird_zone_4_wo:
    name: Druppelslang op woensdag
    icon: mdi:calendar
  rainbird_zone_4_do:
    name: Druppelslang op donderdag
    icon: mdi:calendar
  rainbird_zone_4_vr:
    name: Druppelslang op vrijdag
    icon: mdi:calendar
  rainbird_zone_4_za:
    name: Druppelslang op zaterdag
    icon: mdi:calendar
  rainbird_zone_4_zo:
    name: Druppelslang op zondag
    icon: mdi:calendar

input_datetime:
  # The start times of each zone; only used while their minutes are above 0.
  rainbird_zone_1_tijd_1:
    name: Gras tijd 1
    has_date: false
    has_time: true
    icon: mdi:clock-outline
  rainbird_zone_1_tijd_2:
    name: Gras tijd 2
    has_date: false
    has_time: true
    icon: mdi:clock-outline
  rainbird_zone_2_tijd_1:
    name: Achtertuin tijd 1
    has_date: false
    has_time: true
    icon: mdi:clock-outline
  rainbird_zone_2_tijd_2:
    name: Achtertuin tijd 2
    has_date: false
    has_time: true
    icon: mdi:clock-outline
  rainbird_zone_3_tijd_1:
    name: Voortuin + zijkant tijd 1
    has_date: false
    has_time: true
    icon: mdi:clock-outline
  rainbird_zone_3_tijd_2:
    name: Voortuin + zijkant tijd 2
    has_date: false
    has_time: true
    icon: mdi:clock-outline
  rainbird_zone_4_tijd_1:
    name: Druppelslang tijd 1
    has_date: false
    has_time: true
    icon: mdi:clock-outline
  rainbird_zone_4_tijd_2:
    name: Druppelslang tijd 2
    has_date: false
    has_time: true
    icon: mdi:clock-outline

  # When Stop was last pressed: scheduled starts still waiting from before
  # then are skipped.
  rainbird_gestopt:
    name: RainBird Gestopt
    has_date: true
    has_time: true
    icon: mdi:stop-circle-outline

input_text:
  # The switch entity being started, for the status line.
  rainbird_requested_zone:
    name: RainBird Requested Zone
    max: 40

  rainbird_last_message:
    name: RainBird Last Message
    max: 255

timer:
  rainbird_time_left:
    name: Sproeitijd over
    duration: "00:10:00"
    restore: true

template:
  - binary_sensor:
      # Anything going on: a zone on, a start waiting for confirmation, or
      # scheduled starts waiting their turn. Shows Stop, and the Tuin section
      # on the Thuis view.
      - name: RainBird Bezig
        unique_id: rainbird_bezig
        icon: mdi:sprinkler-variant
        state: >-
          {{
            ['switch.rain_bird_sprinkler_1', 'switch.rain_bird_sprinkler_2',
             'switch.rain_bird_sprinkler_3', 'switch.rain_bird_sprinkler_4']
            | select('is_state', 'on') | list | count > 0
            or is_state('input_boolean.rainbird_command_pending', 'on')
            or state_attr('automation.rainbird_schema', 'current') | int(0) > 0
          }}

  - sensor:
      # The zone's own name (the switch's friendly name), or Geen. Also shows
      # zones started on the controller or in the Rain Bird app.
      - name: RainBird Active Zone
        unique_id: rainbird_active_zone
        icon: mdi:sprinkler
        state: >-
          {% set aan = ['switch.rain_bird_sprinkler_1', 'switch.rain_bird_sprinkler_2',
                        'switch.rain_bird_sprinkler_3', 'switch.rain_bird_sprinkler_4']
                       | select('is_state', 'on') | list %}
          {{ state_attr(aan[0], 'friendly_name') if aan else 'Geen' }}

      - name: RainBird Status
        unique_id: rainbird_status
        icon: mdi:sprinkler-variant
        state: >-
          {% set aan = ['switch.rain_bird_sprinkler_1', 'switch.rain_bird_sprinkler_2',
                        'switch.rain_bird_sprinkler_3', 'switch.rain_bird_sprinkler_4']
                       | select('is_state', 'on') | list %}
          {% set gevraagd = states('input_text.rainbird_requested_zone') %}
          {% if aan %}
            {{ state_attr(aan[0], 'friendly_name') }} sproeit
          {% elif is_state('input_boolean.rainbird_command_pending', 'on') %}
            {{ state_attr(gevraagd, 'friendly_name') or 'Zone' }} wordt gestart
          {% elif state_attr('automation.rainbird_schema', 'current') | int(0) > 0 %}
            Wacht op volgende zone
          {% elif is_state('switch.rain_bird_sprinkler_1', 'unavailable') %}
            Rain Bird niet bereikbaar
          {% else %}
            Uit
          {% endif %}

      # The next scheduled start over all zones, with its zone in the `zone`
      # attribute; unknown while the schedule is off or nothing is planned.
      # Does not look at rain: that is decided at start time.
      - name: RainBird Volgende Beurt
        unique_id: rainbird_volgende_beurt
        icon: mdi:calendar-clock
        device_class: timestamp
        state: >-
          {% set dagen = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'] %}
          {% set ns = namespace(t=none, zone='') %}
          {% if is_state('input_boolean.rainbird_schema_actief', 'on') %}
            {% for z in range(1, 5)
                 if not is_state('input_boolean.rainbird_pauze_zone_' ~ z, 'on') %}
              {% for s in range(1, 3)
                   if states('input_number.rainbird_zone_' ~ z ~ '_minuten_' ~ s) | int(0) > 0
                   and has_value('input_datetime.rainbird_zone_' ~ z ~ '_tijd_' ~ s) %}
                {% set start = today_at(states('input_datetime.rainbird_zone_' ~ z ~ '_tijd_' ~ s)) %}
                {% for i in range(8) %}
                  {% set t = start + timedelta(days=i) %}
                  {% if t > now() and (ns.t is none or t < ns.t)
                        and is_state('input_boolean.rainbird_zone_' ~ z ~ '_' ~ dagen[t.weekday()], 'on') %}
                    {% set ns.t = t %}
                    {% set ns.zone = state_attr('switch.rain_bird_sprinkler_' ~ z, 'friendly_name')
                                     or 'Zone ' ~ z %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
            {% endfor %}
          {% endif %}
          {{ ns.t.isoformat() if ns.t is not none else none }}
        attributes:
          zone: >-
            {% set dagen = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'] %}
            {% set ns = namespace(t=none, zone='') %}
            {% if is_state('input_boolean.rainbird_schema_actief', 'on') %}
              {% for z in range(1, 5)
                   if not is_state('input_boolean.rainbird_pauze_zone_' ~ z, 'on') %}
                {% for s in range(1, 3)
                     if states('input_number.rainbird_zone_' ~ z ~ '_minuten_' ~ s) | int(0) > 0
                     and has_value('input_datetime.rainbird_zone_' ~ z ~ '_tijd_' ~ s) %}
                  {% set start = today_at(states('input_datetime.rainbird_zone_' ~ z ~ '_tijd_' ~ s)) %}
                  {% for i in range(8) %}
                    {% set t = start + timedelta(days=i) %}
                    {% if t > now() and (ns.t is none or t < ns.t)
                          and is_state('input_boolean.rainbird_zone_' ~ z ~ '_' ~ dagen[t.weekday()], 'on') %}
                      {% set ns.t = t %}
                      {% set ns.zone = state_attr('switch.rain_bird_sprinkler_' ~ z, 'friendly_name')
                                       or 'Zone ' ~ z %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
              {% endfor %}
            {% endif %}
            {{ ns.zone }}

      - name: RainBird Last Message
        unique_id: rainbird_last_message
        icon: mdi:message-text-outline
        state: "{{ states('input_text.rainbird_last_message') }}"

  # The log: zone runs, skipped schedule days with their reason, failed
  # starts, pauses and the schedule switched off or on. The last 50, newest
  # first, stay in the `runs` attribute for the dashboard (it survives
  # restarts); every entry also goes to the Local Calendar calendar.tuin, which
  # keeps them for good. A run is written when its zone goes off. Its source
  # comes from the start request the scripts announce with a rainbird_logboek
  # event; a zone that comes on without one was started on the controller or
  # in the Rain Bird app.
  - triggers:
      - trigger: state
        entity_id: &rainbird_zones
          - switch.rain_bird_sprinkler_1
          - switch.rain_bird_sprinkler_2
          - switch.rain_bird_sprinkler_3
          - switch.rain_bird_sprinkler_4
        to: "on"
        id: aan
      # Also from unavailable: the controller sometimes drops off for a few
      # minutes, and comes back with the zone already off.
      - trigger: state
        entity_id: *rainbird_zones
        to: "off"
        id: uit
      # data: soort (aanvraag, overgeslagen, mislukt, pauze, hervat, uit or
      # aan), zone (switch entity or empty for the whole schedule), bron,
      # reden, and optionally naam to override the zone name.
      - trigger: event
        event_type: rainbird_logboek
        id: melding
    actions:
      - variables:
          nu: "{{ now().isoformat() }}"
          oud_runs: "{{ state_attr('sensor.rainbird_logboek', 'runs') or [] }}"
          oud_lopend: "{{ state_attr('sensor.rainbird_logboek', 'lopend') or [] }}"
          oud_aanvraag: "{{ state_attr('sensor.rainbird_logboek', 'aanvraag') or {} }}"
          zone: >-
            {{ (trigger.event.data.zone | default('')) if trigger.id == 'melding'
               else trigger.entity_id }}
          zone_naam: >-
            {% if trigger.id == 'melding' and trigger.event.data.naam is defined %}
              {{ trigger.event.data.naam }}
            {% elif zone %}
              {{ state_attr(zone, 'friendly_name') or zone }}
            {% endif %}
          bezig: "{{ oud_lopend | selectattr('zone', 'eq', zone) | first | default({}) }}"
          # A zone that comes back from unavailable while it was already
          # running keeps its start; one stuck for over 3 hours does not.
          nog_bezig: >-
            {{ bezig != {}
               and as_timestamp(now()) - as_timestamp(bezig.start, 0) < 3 * 3600 }}
          bron_aan: >-
            {% set a = oud_aanvraag %}
            {% if a.get('zone') == zone
                  and as_timestamp(now()) - as_timestamp(a.get('tijd'), 0) < 300 %}
              {{ a.bron }}
            {% else %}
              Rain Bird
            {% endif %}
          lopend: >-
            {% set rest = oud_lopend | rejectattr('zone', 'eq', zone) | list %}
            {% if trigger.id == 'aan' and not nog_bezig %}
              {{ rest + [{'zone': zone, 'start': nu, 'bron': bron_aan}] }}
            {% elif trigger.id == 'uit' %}
              {{ rest }}
            {% else %}
              {{ oud_lopend }}
            {% endif %}
          aanvraag: >-
            {% if trigger.id == 'melding' and trigger.event.data.soort == 'aanvraag' %}
              {{ {'zone': zone, 'bron': trigger.event.data.bron | default('Handmatig'), 'tijd': nu} }}
            {% else %}
              {{ oud_aanvraag }}
            {% endif %}
          # Every entry has a short `wat` for the table and the calendar, e.g.
          # "15 min", "overgeslagen: regen gemeten" or "gepauzeerd".
          nieuw: >-
            {% if trigger.id == 'uit' and bezig != {} %}
              {% set minuten = [((as_timestamp(now()) - as_timestamp(bezig.start)) / 60) | round(0) | int, 1] | max %}
              {{ {
                'soort': 'beurt',
                'zone': zone,
                'naam': zone_naam,
                'start': bezig.start,
                'minuten': minuten,
                'wat': minuten ~ ' min',
                'bron': bezig.bron,
              } }}
            {% elif trigger.id == 'melding' and trigger.event.data.soort != 'aanvraag' %}
              {% set soort = trigger.event.data.soort %}
              {% set reden = trigger.event.data.reden | default('') %}
              {{ {
                'soort': soort,
                'zone': zone,
                'naam': zone_naam or 'Schema',
                'start': nu,
                'minuten': 0,
                'wat': {
                  'overgeslagen': 'overgeslagen: ' ~ reden,
                  'mislukt': 'mislukt: ' ~ reden,
                  'pauze': 'gepauzeerd',
                  'hervat': 'hervat',
                  'uit': 'uitgezet',
                  'aan': 'aangezet',
                }.get(soort, soort),
                'bron': trigger.event.data.bron | default(''),
                'reden': reden,
              } }}
            {% else %}
              {{ none }}
            {% endif %}
          runs: "{{ ([nieuw] + oud_runs)[:50] if nieuw else oud_runs }}"
      # The full history. Needs a Local Calendar named Tuin (README); without
      # it only the last 50 are kept.
      - if:
          - condition: template
            value_template: "{{ nieuw is not none and has_value('calendar.tuin') }}"
        then:
          - action: calendar.create_event
            continue_on_error: true
            target:
              entity_id: calendar.tuin
            data:
              summary: "{{ nieuw.naam }} · {{ nieuw.wat }}"
              description: "{{ 'Door: ' ~ nieuw.bron if nieuw.bron else '' }}"
              start_date_time: "{{ as_datetime(nieuw.start).isoformat() }}"
              end_date_time: >-
                {{ ([now(), as_datetime(nieuw.start) + timedelta(minutes=1)] | max).isoformat() }}
    sensor:
      - name: RainBird Logboek
        unique_id: rainbird_logboek
        icon: mdi:history
        device_class: timestamp
        state: "{{ runs[0].start if runs else none }}"
        attributes:
          runs: "{{ runs }}"
          lopend: "{{ lopend }}"
          aanvraag: "{{ aanvraag }}"

script:
  rainbird_start_single_zone:
    alias: RainBird - Start Single Zone
    description: >-
      Starts one zone for a number of minutes after turning the others off,
      and starts the shared timer once the controller reports it on.
    mode: single
    max_exceeded: silent
    fields:
      zone_switch:
        name: Zone switch
        required: true
        example: switch.rain_bird_sprinkler_1
      duration:
        name: Duration
        description: Minutes, 5 to 60. Defaults to input_number.rainbird_duration.
        required: false
      bron:
        name: Source
        description: Shown in the log. Defaults to Handmatig.
        required: false
    sequence:
      - variables:
          duration_min: >-
            {% set requested = (duration | default(states('input_number.rainbird_duration'))) | int(0) %}
            {{ 0 if requested <= 0 else [[requested, 5] | max, 60] | min }}
          zone_name: "{{ state_attr(zone_switch, 'friendly_name') or zone_switch }}"
          bron_tekst: "{{ bron | default('Handmatig') }}"
          started_at: "{{ as_timestamp(now()) }}"

      - condition: template
        value_template: "{{ duration_min | int(0) > 0 }}"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.rainbird_last_start_confirmed

      - action: input_text.set_value
        target:
          entity_id: input_text.rainbird_requested_zone
        data:
          value: "{{ zone_switch }}"

      - action: input_text.set_value
        target:
          entity_id: input_text.rainbird_last_message
        data:
          value: "{{ zone_name }} wordt gestart ({{ duration_min }} min)."

      - event: rainbird_logboek
        event_data:
          soort: aanvraag
          zone: "{{ zone_switch }}"
          bron: "{{ bron_tekst }}"

      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.rainbird_command_pending

      - action: timer.cancel
        target:
          entity_id: timer.rainbird_time_left

      - action: switch.turn_off
        target:
          entity_id: &rainbird_zones_script
            - switch.rain_bird_sprinkler_1
            - switch.rain_bird_sprinkler_2
            - switch.rain_bird_sprinkler_3
            - switch.rain_bird_sprinkler_4
        continue_on_error: true

      - delay: "00:00:02"

      # Two tries: the controller handles one request at a time and is
      # sometimes briefly busy or unreachable. The integration polls once a
      # minute, hence the long wait.
      - action: rainbird.start_irrigation
        target:
          entity_id: "{{ zone_switch }}"
        data:
          duration: "{{ duration_min }}"
        continue_on_error: true

      - wait_template: &rainbird_zone_on >-
          {{
            is_state(zone_switch, 'on')
            and as_timestamp(states[zone_switch].last_changed, 0) >= (started_at | float(0))
          }}
        timeout: "00:01:15"
        continue_on_timeout: true

      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - delay: "00:00:30"
          - action: rainbird.start_irrigation
            target:
              entity_id: "{{ zone_switch }}"
            data:
              duration: "{{ duration_min }}"
            continue_on_error: true
          - wait_template: *rainbird_zone_on
            timeout: "00:01:15"
            continue_on_timeout: true

      - if:
          - condition: template
            value_template: *rainbird_zone_on
        then:
          # Counted from when the zone was seen on, which is at most a minute
          # after the controller started it.
          - variables:
              remaining_seconds: >-
                {% set gelopen = as_timestamp(now()) - as_timestamp(states[zone_switch].last_changed) %}
                {{ [(duration_min | int(0)) * 60 - gelopen | int(0), 60] | max }}

          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.rainbird_last_start_confirmed

          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.rainbird_command_pending

          - action: timer.start
            target:
              entity_id: timer.rainbird_time_left
            data:
              duration: "{{ remaining_seconds }}"

          - action: input_text.set_value
            target:
              entity_id: input_text.rainbird_last_message
            data:
              value: "{{ zone_name }} sproeit {{ duration_min }} min."
        else:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.rainbird_command_pending
                - input_boolean.rainbird_last_start_confirmed

          - action: timer.cancel
            target:
              entity_id: timer.rainbird_time_left

          - action: input_text.set_value
            target:
              entity_id: input_text.rainbird_last_message
            data:
              value: "{{ zone_name }} kon niet starten: Rain Bird reageert niet."

          - event: rainbird_logboek
            event_data:
              soort: mislukt
              zone: "{{ zone_switch }}"
              bron: "{{ bron_tekst }}"
              reden: Rain Bird reageert niet

          - action: persistent_notification.create
            data:
              title: Tuin
              message: "{{ zone_name }} kon niet starten: Rain Bird reageert niet."

          # packages/meldingen.yaml: only phones that have it switched on.
          - action: script.melding_versturen
            continue_on_error: true
            data:
              melding: tuin
              titel: Tuin
              bericht: "{{ zone_name }} kon niet starten: Rain Bird reageert niet."

  rainbird_stop_all_zones:
    alias: RainBird - Stop All Zones
    description: >-
      Turns every zone off. With cancel_program, scheduled starts that are
      still waiting their turn are skipped too.
    mode: restart
    fields:
      cancel_program:
        name: Cancel waiting starts
        required: false
    sequence:
      - variables:
          should_cancel_program: "{{ cancel_program | default(false) | bool }}"

      - if:
          - condition: template
            value_template: "{{ should_cancel_program }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.rainbird_gestopt
            data:
              timestamp: "{{ now().timestamp() }}"

      - action: switch.turn_off
        target:
          entity_id:
            - switch.rain_bird_sprinkler_1
            - switch.rain_bird_sprinkler_2
            - switch.rain_bird_sprinkler_3
            - switch.rain_bird_sprinkler_4
        continue_on_error: true

      - action: timer.cancel
        target:
          entity_id: timer.rainbird_time_left

      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.rainbird_command_pending
            - input_boolean.rainbird_last_start_confirmed

      - if:
          - condition: template
            value_template: "{{ should_cancel_program }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.rainbird_last_message
            data:
              value: Sproeien gestopt.

automation:
  - alias: RainBird - Stop when shared timer finishes
    id: rainbird_stop_when_shared_timer_finishes
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.rainbird_time_left
    actions:
      - action: script.rainbird_stop_all_zones
        data:
          cancel_program: false

  # "Automatisch sproeien": every start time of every zone is a trigger
  # (id "<zone>-<start time>"). A start with minutes above 0 on one of its
  # zone's days runs that zone, unless it rains, a rain delay is set or the
  # zone is paused; then it is logged as skipped with that reason. Runs are
  # queued, so starts that coincide or fall while something else waters run
  # one after the other. Stop skips the starts still waiting. While the
  # schedule is off nothing is logged per start; switching it off and on is
  # logged instead (below).
  - alias: RainBird - Schema
    id: rainbird_schema
    mode: queued
    max: 20
    triggers:
      - trigger: time
        at: input_datetime.rainbird_zone_1_tijd_1
        id: "1-1"
      - trigger: time
        at: input_datetime.rainbird_zone_1_tijd_2
        id: "1-2"
      - trigger: time
        at: input_datetime.rainbird_zone_2_tijd_1
        id: "2-1"
      - trigger: time
        at: input_datetime.rainbird_zone_2_tijd_2
        id: "2-2"
      - trigger: time
        at: input_datetime.rainbird_zone_3_tijd_1
        id: "3-1"
      - trigger: time
        at: input_datetime.rainbird_zone_3_tijd_2
        id: "3-2"
      - trigger: time
        at: input_datetime.rainbird_zone_4_tijd_1
        id: "4-1"
      - trigger: time
        at: input_datetime.rainbird_zone_4_tijd_2
        id: "4-2"
    conditions:
      - condition: state
        entity_id: input_boolean.rainbird_schema_actief
        state: "on"
      - condition: template
        value_template: >-
          {% set dagen = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'] %}
          {% set zone, tijd = trigger.id.split('-') %}
          {{ states('input_number.rainbird_zone_' ~ zone ~ '_minuten_' ~ tijd) | int(0) > 0
             and is_state('input_boolean.rainbird_zone_' ~ zone ~ '_' ~ dagen[now().weekday()], 'on') }}
    actions:
      - variables:
          zone_nr: "{{ trigger.id.split('-')[0] }}"
          zone_switch: "{{ 'switch.rain_bird_sprinkler_' ~ zone_nr }}"
          minuten: >-
            {{ [states('input_number.rainbird_zone_' ~ zone_nr ~ '_minuten_'
                        ~ trigger.id.split('-')[1]) | int(0), 60] | min }}
          gepland: "{{ as_timestamp(trigger.now) }}"
          reden: >-
            {% if is_state('input_boolean.rainbird_pauze_zone_' ~ zone_nr, 'on') %}
              gepauzeerd
            {% elif is_state('binary_sensor.rain_bird_controller_rainsensor', 'on') %}
              regen gemeten
            {% elif states('number.rain_bird_controller_rain_delay') | int(0) > 0 %}
              regenpauze
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ reden | length > 0 }}"
        then:
          - event: rainbird_logboek
            event_data:
              soort: overgeslagen
              zone: "{{ zone_switch }}"
              bron: Schema
              reden: "{{ reden }}"
          - stop: Skipped.

      # Wait for a zone started by hand, on the controller or by the app.
      - wait_template: >-
          {{
            ['switch.rain_bird_sprinkler_1', 'switch.rain_bird_sprinkler_2',
             'switch.rain_bird_sprinkler_3', 'switch.rain_bird_sprinkler_4']
            | select('is_state', 'on') | list | count == 0
            and is_state('input_boolean.rainbird_command_pending', 'off')
          }}
        timeout: "01:00:00"
        continue_on_timeout: true
      - variables:
          reden: >-
            {% if not wait.completed %}
              er sproeide te lang iets anders
            {% elif (state_attr('input_datetime.rainbird_gestopt', 'timestamp') | float(0)) > gepland %}
              gestopt
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ reden | length > 0 }}"
        then:
          - event: rainbird_logboek
            event_data:
              soort: overgeslagen
              zone: "{{ zone_switch }}"
              bron: Schema
              reden: "{{ reden }}"
          - stop: Skipped.

      # Ride out a short controller drop-off before giving up.
      - wait_template: "{{ not is_state(zone_switch, 'unavailable') }}"
        timeout: "00:15:00"
        continue_on_timeout: true

      - action: script.rainbird_start_single_zone
        data:
          zone_switch: "{{ zone_switch }}"
          duration: "{{ minuten }}"
          bron: Schema

      # Stay running until the zone is done, so the next start waits.
      - if:
          - condition: state
            entity_id: input_boolean.rainbird_last_start_confirmed
            state: "on"
        then:
          - wait_template: "{{ is_state('timer.rainbird_time_left', 'idle') }}"
            timeout:
              minutes: "{{ minuten + 2 }}"
            continue_on_timeout: true

  # Pausing or resuming a zone and switching the schedule off or on, with the
  # person who did it (from the change's user), into the log.
  - alias: RainBird - Instellingen in logboek
    id: rainbird_instellingen_logboek
    mode: queued
    triggers:
      - trigger: state
        entity_id: &rainbird_instellingen
          - input_boolean.rainbird_schema_actief
          - input_boolean.rainbird_pauze_zone_1
          - input_boolean.rainbird_pauze_zone_2
          - input_boolean.rainbird_pauze_zone_3
          - input_boolean.rainbird_pauze_zone_4
        from: "off"
        to: "on"
      - trigger: state
        entity_id: *rainbird_instellingen
        from: "on"
        to: "off"
    actions:
      - variables:
          aan: "{{ trigger.to_state.state == 'on' }}"
          schema: "{{ trigger.entity_id == 'input_boolean.rainbird_schema_actief' }}"
          gebruiker: "{{ trigger.to_state.context.user_id }}"
          wie: >-
            {% if gebruiker %}
              {{ states.person | selectattr('attributes.user_id', 'eq', gebruiker)
                 | map(attribute='name') | first | default('Onbekend') }}
            {% else %}
              Automatisch
            {% endif %}
      - event: rainbird_logboek
        event_data:
          soort: >-
            {% if schema %}{{ 'aan' if aan else 'uit' }}{% else %}{{ 'pauze' if aan else 'hervat' }}{% endif %}
          zone: >-
            {{ '' if schema else 'switch.rain_bird_sprinkler_' ~ trigger.entity_id[-1] }}
          bron: "{{ wie }}"
      # Space the events out, so the log writes one before the next.
      - delay: "00:00:02"
