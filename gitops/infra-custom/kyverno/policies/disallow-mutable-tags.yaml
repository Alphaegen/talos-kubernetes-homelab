# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/policies.kyverno.io/validatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-mutable-tags
  annotations:
    policies.kyverno.io/title: Disallow mutable image tags
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Images must be pinned to a version tag or digest, so a restart never pulls different code. Untagged images and tags such as latest or main are rejected.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: mutable
      expression: >-
        variables.containers.filter(c, !c.image.contains('@') &&
          (!c.image.split('/')[size(c.image.split('/')) - 1].contains(':') ||
           c.image.split(':')[size(c.image.split(':')) - 1] in ['latest', 'main', 'master', 'edge', 'nightly', 'dev']))
  validations:
    - expression: size(variables.mutable) == 0
      messageExpression: >-
        'Pin these images to a version tag or digest: ' +
        variables.mutable.map(c, c.name + '=' + c.image).join(', ')
