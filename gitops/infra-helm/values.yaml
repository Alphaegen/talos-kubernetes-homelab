cluster:
  # Used for hostnames and legacy references.
  name: homelab.niekvlam
  # Argo CD AppProjects: cluster-level platform services, and the user-facing
  # apps that only get their own namespaces (templates/projects.yaml).
  projects:
    platform: platform
    apps: apps
  # Used for ArgoCD Application metadata.name.
  appNamePrefix: homelab
  namespace: argocd
  repoURL: "https://github.com/Alphaegen/talos-kubernetes-homelab.git"
  revision: "main"

sync: true

renovate:
  enabled: true
  namespace: renovate

bookorbit:
  enabled: true

# Nightly etcd snapshots to the NAS; needs the Talos controlplane patch applied.
etcdBackup:
  enabled: true

# PriorityClasses for home-critical and best-effort workloads.
priorityClasses:
  enabled: true

obsidianLiveSync:
  enabled: true

# Shared Cilium Gateway (kube-system/cilium-gateway), wildcard cert and HTTPS redirect.
gateway:
  enabled: true

metallb:
  enabled: true
  # renovate: datasource=helm depName=metallb registryUrl=https://metallb.github.io/metallb versioning=helm
  version: "0.16.1"

longhorn:
  enabled: true
  # renovate: datasource=helm depName=longhorn registryUrl=https://charts.longhorn.io versioning=helm
  version: "1.12.1"

certmanager:
  enabled: true
  # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io versioning=helm
  version: "v1.21.2"

monitoring:
  enabled: true
  grafana:
    # renovate: datasource=helm depName=grafana registryUrl=https://grafana-community.github.io/helm-charts versioning=helm
    version: "13.2.6"
    dashboards:
      default:
        node-exporter:
          gnetId: 1860
          revision: 32
          datasource: Prometheus
        argocd:
          gnetId: 14584
          revision: 1
        cert-manager:
          gnetId: 11001
          revision: 1
        metallb:
          gnetId: 20162
          revision: 6
          datasource: Prometheus
        trivy-operator:
          gnetId: 16337
          revision: 16
          datasource: Prometheus
    dashboardFiles:
      - name: homelab-platform-smoke
        path: dashboards/homelab-platform-smoke.json

  loki:
    # renovate: datasource=helm depName=loki registryUrl=https://grafana.github.io/helm-charts versioning=helm
    version: "7.3.0"

  alloy:
    # renovate: datasource=helm depName=alloy registryUrl=https://grafana.github.io/helm-charts versioning=helm
    version: "1.13.0"

  prometheus:
    # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts versioning=helm
    version: "91.7.0"

pi5FanControl:
  enabled: true
  namespace: pi5-fan-control

# Approves the kubelet serving CSRs from Talos (rotate-server-certificates) for metrics-server.
kubeletServingCertApprover:
  enabled: true

metricsServer:
  enabled: true
  # renovate: datasource=helm depName=metrics-server registryUrl=https://kubernetes-sigs.github.io/metrics-server/ versioning=helm
  version: "3.14.0"

homeassistant:
  enabled: true
  # renovate: datasource=helm depName=home-assistant registryUrl=http://pajikos.github.io/home-assistant-helm-chart/ versioning=helm
  version: "0.3.82"

homeAutomation:
  enabled: true

platformSmoke:
  enabled: true
  namespace: homelab-platform
  rollout:
    enabled: true

progressiveDelivery:
  enabled: true
  argoRollouts:
    enabled: true
    namespace: argo-rollouts
    # renovate: datasource=helm depName=argo-rollouts registryUrl=https://argoproj.github.io/argo-helm versioning=helm
    version: "2.43.2"
    serviceMonitorLabel: kube-prometheus-stack

media:
  enabled: true
  nfs:
    # renovate: datasource=helm depName=nfs-subdir-external-provisioner registryUrl=https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/ versioning=helm
    version: "4.0.18"
    server: nas.niekvlam.nl
    path: /volume1/PlexMediaServer
    storageClass: media-nfs

# Security
security:
  enabled: true

  # OIDC identity provider (passkeys) for SSO in front of the platform UIs.
  pocketId:
    enabled: true

  # SSO reverse proxy for UIs without their own login; one release per entry,
  # configured by gitops/infra-custom/oauth2-proxy/<name>-values.yaml.
  oauth2Proxy:
    enabled: true
    # renovate: datasource=helm depName=oauth2-proxy registryUrl=https://oauth2-proxy.github.io/manifests versioning=helm
    version: "10.7.0"
    instances:
      - longhorn
      - hubble
      - policy-reporter

  eso:
    enabled: true
    # renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io versioning=helm
    version: "2.11.0"
    serviceMonitorLabel: kube-prometheus-stack
    bootstrap: true

  kyverno:
    enabled: true
    # renovate: datasource=helm depName=kyverno registryUrl=https://kyverno.github.io/kyverno/ versioning=helm
    version: "3.9.1"
    serviceMonitorLabel: kube-prometheus-stack

  policyReporter:
    enabled: true
    # renovate: datasource=helm depName=policy-reporter registryUrl=https://kyverno.github.io/policy-reporter/ versioning=helm
    version: "3.10.0"
    serviceMonitorLabel: kube-prometheus-stack

  trivy:
    enabled: true
    # renovate: datasource=helm depName=trivy-operator registryUrl=https://aquasecurity.github.io/helm-charts/ versioning=helm
    version: "0.36.0"
    serviceMonitorLabel: kube-prometheus-stack

  tailscale:
    enabled: true
    # renovate: datasource=helm depName=tailscale-operator registryUrl=https://pkgs.tailscale.com/helmcharts versioning=helm
    version: "1.102.4"
    namespace: tailscale
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
