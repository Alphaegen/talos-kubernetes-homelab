# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
{{- if and .Values.security.enabled .Values.security.policyReporter.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "policy-reporter") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: policy-reporter
  namespace: {{ .Values.cluster.namespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Stage 2: reads the PolicyReport CRDs that Kyverno (stage 1) installs.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: {{ include "infra.platformProject" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: policy-reporter
  syncPolicy:
    {{- include "infra.syncPolicy" . | nindent 4 }}
    syncOptions:
      - FailOnSharedResource=true
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
  source:
    repoURL: https://kyverno.github.io/policy-reporter
    chart: policy-reporter
    targetRevision: {{ .Values.security.policyReporter.version | quote }}
    helm:
      releaseName: policy-reporter
      values: |
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 192Mi

        metrics:
          enabled: true

        monitoring:
          enabled: true
          serviceMonitor:
            labels:
              release: {{ .Values.security.policyReporter.serviceMonitorLabel }}
          grafana:
            dashboards:
              enabled: true

        ui:
          enabled: true
          # Published only through oauth2-proxy-policy-reporter (auth namespace).
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi

        plugin:
          # Policy details (descriptions, categories) for the Kyverno results in the UI.
          kyverno:
            enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 48Mi
              limits:
                memory: 128Mi

        extraManifests:
          # Strings: the chart renders each entry with tpl.
          - |
            apiVersion: cilium.io/v2
            kind: CiliumNetworkPolicy
            metadata:
              name: policy-reporter-ui
            spec:
              # Only the matching oauth2-proxy may reach the UI;
              # kubectl port-forward still works because it enters from the host.
              endpointSelector:
                matchLabels:
                  app.kubernetes.io/name: policy-reporter-ui
                  app.kubernetes.io/instance: policy-reporter
              ingress:
                - fromEndpoints:
                    - matchLabels:
                        k8s:io.kubernetes.pod.namespace: auth
                        app.kubernetes.io/name: oauth2-proxy
                        app.kubernetes.io/instance: oauth2-proxy-policy-reporter
                  toPorts:
                    - ports:
                        - port: "8080"
                          protocol: TCP
{{- end }}
