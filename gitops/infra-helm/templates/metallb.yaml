{{- define "app.metallb" }}
name: metallb
partOf: metallb
namespace: metallb-system
# Load-balancer controller and its CRD-backed configuration.
wave: 0
project: platform
createNamespace: true
namespaceLabels:
  # The speaker DaemonSet uses the host network and NET_RAW to announce IPs.
  pod-security.kubernetes.io/enforce: privileged
  pod-security.kubernetes.io/audit: privileged
  pod-security.kubernetes.io/warn: privileged
sources:
  - repoURL: https://metallb.github.io/metallb
    chart: metallb
    version: {{ .Values.metallb.version | quote }}
    helm:
      version: v3
      releaseName: metallb
      valueFiles:
        - $values/gitops/infra-custom/metallb/upstream-values.yaml
  - path: gitops/infra-custom/metallb
    helm:
      releaseName: metallb-config
      valueFiles:
        - values.yaml
{{ end }}
{{- if .Values.metallb.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.metallb" . | fromYaml)) }}
{{- end }}
