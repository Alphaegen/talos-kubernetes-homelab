# Waste pickups from today through Sunday three weeks ahead (four calendar
# weeks), read from the Circulus calendar, for the Afval cards on the Thuis
# dashboard. sensor.afval_ophaalschema's state is the next bin type ("GFT", or
# "GFT + Papier" on a shared day); sensor.afval_deze_week_1 to _4 hold this
# week's pickups, one each, for the cards on the Thuis view.
template:
  - triggers:
      - trigger: homeassistant
        event: start
      # After "Template entities" is reloaded, instead of waiting for the hour.
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        hours: "/1"
      # Right after midnight, so "morgen" becomes "vandaag" on time.
      - trigger: time
        at: "00:00:10"
    actions:
      - action: calendar.get_events
        # The calendar may not be loaded yet right after a restart; the
        # sensor then keeps its last value until the next hourly run.
        continue_on_error: true
        target:
          entity_id: calendar.afvalbeheer_circulus
        data:
          start_date_time: "{{ today_at() }}"
          # Monday is weekday 0: this ends at the Monday four weeks after
          # this week's.
          end_date_time: "{{ today_at() + timedelta(days=28 - now().weekday()) }}"
        response_variable: agenda
      - variables:
          dagen: >-
            {{ ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag',
                'zaterdag', 'zondag'] }}
          maanden: >-
            {{ ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli',
                'augustus', 'september', 'oktober', 'november', 'december'] }}
          iconen: >-
            {{ {'GFT': 'mdi:leaf', 'PMD': 'mdi:recycle',
                'Papier': 'mdi:package-variant', 'Restafval': 'mdi:trash-can'} }}
          ophalingen: >-
            {% set fetched = agenda is defined
                 and 'calendar.afvalbeheer_circulus' in agenda %}
            {% if not fetched %}
              {{ none }}
            {% else %}
              {% set monday = (today_at() - timedelta(days=now().weekday())).date() %}
              {% set ns = namespace(items=[]) %}
              {% for event in agenda['calendar.afvalbeheer_circulus'].events
                   | sort(attribute='start') %}
                {% set d = as_datetime(event.start).date() %}
                {% set until = (d - now().date()).days %}
                {% set ns.items = ns.items + [{
                  'datum': d.isoformat(),
                  'soort': event.summary,
                  'icoon': iconen.get(event.summary, 'mdi:trash-can'),
                  'week': ((d - monday).days // 7),
                  'dag': dagen[d.weekday()] ~ ' ' ~ d.day ~ ' ' ~ maanden[d.month - 1],
                  'wanneer': 'vandaag' if until == 0
                    else 'morgen' if until == 1
                    else 'over ' ~ until ~ ' dagen'
                }] %}
              {% endfor %}
              {{ ns.items }}
            {% endif %}
      # This week's pickups for the Thuis cards, or only the next one when
      # nothing is left this week; none while the calendar is not loaded.
      - variables:
          deze_week: >-
            {% if ophalingen is none %}
              {{ none }}
            {% else %}
              {% set week = ophalingen | selectattr('week', 'eq', 0) | list %}
              {{ week if week | count > 0 else ophalingen[:1] }}
            {% endif %}
    sensor:
      - name: Afval ophaalschema
        unique_id: afval_ophaalschema
        icon: mdi:trash-can
        state: >-
          {% if ophalingen is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable'] else 'Geen' }}
          {% elif ophalingen | count == 0 %}
            Geen
          {% else %}
            {{ ophalingen | selectattr('datum', 'eq', ophalingen[0].datum)
               | map(attribute='soort') | join(' + ') }}
          {% endif %}
        attributes:
          # Next pickup, e.g. "woensdag 11 november · over 3 dagen".
          wanneer: >-
            {% if ophalingen is none %}
              {{ this.attributes.get('wanneer', '') }}
            {% elif ophalingen | count == 0 %}
              Niets in de komende vier weken
            {% else %}
              {{ ophalingen[0].dag }} · {{ ophalingen[0].wanneer }}
            {% endif %}
          icoon: >-
            {% if ophalingen is none %}
              {{ this.attributes.get('icoon', 'mdi:trash-can') }}
            {% elif ophalingen | count == 0 %}
              mdi:trash-can-outline
            {% else %}
              {{ ophalingen[0].icoon }}
            {% endif %}
          # Every pickup in the window; week 0 is this week, 1 next week, up
          # to 3.
          ophalingen: >-
            {{ this.attributes.get('ophalingen', []) if ophalingen is none
               else ophalingen }}
      # One per pickup of this week (deze_week above), "Geen" when the slot is
      # unused, so the Thuis view can hide it. Four slots: one per bin type.
      - name: Afval deze week 1
        unique_id: afval_deze_week_1
        icon: mdi:trash-can
        state: >-
          {% if deze_week is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable'] else 'Geen' }}
          {% else %}
            {{ deze_week[0].soort if deze_week | count > 0 else 'Geen' }}
          {% endif %}
        attributes:
          wanneer: >-
            {% if deze_week is none %}
              {{ this.attributes.get('wanneer', '') }}
            {% elif deze_week | count > 0 %}
              {{ deze_week[0].dag }} · {{ deze_week[0].wanneer }}
            {% else %}
              Niets in de komende vier weken
            {% endif %}
          icoon: >-
            {% if deze_week is none %}
              {{ this.attributes.get('icoon', 'mdi:trash-can') }}
            {% elif deze_week | count > 0 %}
              {{ deze_week[0].icoon }}
            {% else %}
              mdi:trash-can-outline
            {% endif %}
      - name: Afval deze week 2
        unique_id: afval_deze_week_2
        icon: mdi:trash-can
        state: >-
          {% if deze_week is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable'] else 'Geen' }}
          {% else %}
            {{ deze_week[1].soort if deze_week | count > 1 else 'Geen' }}
          {% endif %}
        attributes:
          wanneer: >-
            {% if deze_week is none %}
              {{ this.attributes.get('wanneer', '') }}
            {% elif deze_week | count > 1 %}
              {{ deze_week[1].dag }} · {{ deze_week[1].wanneer }}
            {% endif %}
          icoon: >-
            {% if deze_week is none %}
              {{ this.attributes.get('icoon', 'mdi:trash-can') }}
            {% elif deze_week | count > 1 %}
              {{ deze_week[1].icoon }}
            {% else %}
              mdi:trash-can-outline
            {% endif %}
      - name: Afval deze week 3
        unique_id: afval_deze_week_3
        icon: mdi:trash-can
        state: >-
          {% if deze_week is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable'] else 'Geen' }}
          {% else %}
            {{ deze_week[2].soort if deze_week | count > 2 else 'Geen' }}
          {% endif %}
        attributes:
          wanneer: >-
            {% if deze_week is none %}
              {{ this.attributes.get('wanneer', '') }}
            {% elif deze_week | count > 2 %}
              {{ deze_week[2].dag }} · {{ deze_week[2].wanneer }}
            {% endif %}
          icoon: >-
            {% if deze_week is none %}
              {{ this.attributes.get('icoon', 'mdi:trash-can') }}
            {% elif deze_week | count > 2 %}
              {{ deze_week[2].icoon }}
            {% else %}
              mdi:trash-can-outline
            {% endif %}
      - name: Afval deze week 4
        unique_id: afval_deze_week_4
        icon: mdi:trash-can
        state: >-
          {% if deze_week is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable'] else 'Geen' }}
          {% else %}
            {{ deze_week[3].soort if deze_week | count > 3 else 'Geen' }}
          {% endif %}
        attributes:
          wanneer: >-
            {% if deze_week is none %}
              {{ this.attributes.get('wanneer', '') }}
            {% elif deze_week | count > 3 %}
              {{ deze_week[3].dag }} · {{ deze_week[3].wanneer }}
            {% endif %}
          icoon: >-
            {% if deze_week is none %}
              {{ this.attributes.get('icoon', 'mdi:trash-can') }}
            {% elif deze_week | count > 3 %}
              {{ deze_week[3].icoon }}
            {% else %}
              mdi:trash-can-outline
            {% endif %}
