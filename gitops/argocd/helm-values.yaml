global:
  domain: argocd.homelab.niekvlam.nl
  image:
    # Explicit chart default lets the Helm-values Renovate manager pair it with tag.
    repository: quay.io/argoproj/argocd
    tag: v3.5.3
  # Chart 10 enables policies by default. Preserve current connectivity during
  # the upgrade; enable policies separately after validating cluster traffic.
  networkPolicy:
    create: false

# Memory-constrained Pi cluster: use the chart's standalone Redis cache and one
# replica per component instead of the HA topology (3 Redis + 3 HAProxy pods).
redis-ha:
  enabled: false

configs:
  params:
    server.insecure: true
    # Keep a recursive/full-tree sync from reconciling every workload at once.
    # The controller exceeded its 1 GiB limit while processing 15 concurrent
    # operations, then repeatedly OOM-killed while resuming the same queue.
    controller.status.processors: 10
    controller.operation.processors: 3
    controller.kubectl.parallelism.limit: 10
    # Back off aggressively when a live resource cannot converge. This keeps an
    # immutable-field error from turning into hundreds of writes and pod churn.
    controller.self.heal.backoff.timeout.seconds: 30
    controller.self.heal.backoff.factor: 2
    controller.self.heal.backoff.cap.seconds: 1800
    controller.sync.timeout.seconds: 900

server:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: false
  # Cleartext HTTP/2 port for native gRPC, routed by httproute-grpc.yaml.
  # The UI stays on the HTTP/1.1 port: argocd-server picks gRPC or HTTP per
  # connection, so one h2c upstream connection cannot carry both.
  service:
    servicePortHttp2: 81
    servicePortHttp2AppProtocol: kubernetes.io/h2c
  # Backend is the plain HTTP service port because server.insecure is true.
  httproute:
    enabled: true
    parentRefs:
      # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
      - name: cilium-gateway
        namespace: kube-system
        sectionName: https
    hostnames: [ "argocd.homelab.niekvlam.nl" ]
    rules:
      # 0s disables Envoy's default 15s route timeout, which would cut the
      # UI's server-sent event streams.
      - timeouts:
          request: 0s
        matches:
          - path:
              type: PathPrefix
              value: /
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 2Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector:
    kubernetes.io/os: linux
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack
