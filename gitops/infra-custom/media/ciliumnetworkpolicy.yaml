# Ingress only: selecting a Pod turns on default-deny for its ingress, egress
# stays open. Traffic proxied by the shared Cilium Gateway (Envoy) carries the
# reserved "ingress" identity, which a namespace-based NetworkPolicy cannot
# match. Kubelet probes come from the node and Cilium always allows those, and
# in-Pod traffic over loopback (qBittorrent's Gluetun DNS, the Profilarr
# parser, the indexer backoff sidecars) never reaches policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bazarr
  namespace: media
  labels:
    app.kubernetes.io/name: bazarr
    app.kubernetes.io/part-of: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
---
