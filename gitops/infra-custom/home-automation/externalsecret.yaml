apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mqtt-credentials
  namespace: home-automation
spec:
  refreshInterval: "24h"
  secretStoreRef:
    kind: "ClusterSecretStore"
    name: "onepassword"
  target:
    name: mqtt-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: "mqtt-zigbee/username"
    - secretKey: password
      remoteRef:
        key: "mqtt-zigbee/password"
