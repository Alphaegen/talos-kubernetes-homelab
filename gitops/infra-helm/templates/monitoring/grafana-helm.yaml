# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
{{- if .Values.monitoring.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "grafana") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: grafana
  namespace: {{ .Values.cluster.namespace | quote }}
  annotations:
    # Stage 1: monitoring service after the stage-0 CRD provider.
    argocd.argoproj.io/sync-wave: "1"
    app.kubernetes.io/part-of: monitoring
    {{- if .Values.notifications }}
    {{ toYaml .Values.notifications | indent 4 }}
    {{- end }}
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: monitoring
  # Helm generates a fresh initial admin password on each offline render.
  # Preserve the installed credential and its checksum to avoid restart loops.
  # Rotate credentials explicitly; do not use adminPassword for rotation while
  # these fields are ignored.
  ignoreDifferences:
    - kind: Secret
      name: grafana
      namespace: monitoring
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      name: grafana
      namespace: monitoring
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    {{- include "infra.syncPolicy" . | nindent 4 }}
    syncOptions:
      - FailOnSharedResource=true
      # kube-prometheus-stack is the sole owner/creator of monitoring namespace metadata.
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: {{ .Values.monitoring.grafana.version | quote }}
      helm:
        releaseName: grafana
        valueFiles:
          - $values/gitops/infra-custom/monitoring/grafana-values.yaml
        # Keycloak integration is cross-service wiring; service runtime values
        # live beside Grafana. Dashboard assembly remains centralized below.
        values: |-
          {{- if and .Values.security.enabled .Values.security.keycloak.enabled }}
          grafana.ini:
            server:
              root_url: {{ printf "https://grafana.%s.nl" .Values.cluster.name | quote }}
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              allow_sign_up: true
              client_id: $__file{/etc/secrets/oidc/client-id}
              client_secret: $__file{/etc/secrets/oidc/client-secret}
              scopes: openid profile email groups
              auth_url: {{ printf "https://keycloak.%s.nl/realms/homelab/protocol/openid-connect/auth" .Values.cluster.name | quote }}
              token_url: {{ printf "https://keycloak.%s.nl/realms/homelab/protocol/openid-connect/token" .Values.cluster.name | quote }}
              api_url: {{ printf "https://keycloak.%s.nl/realms/homelab/protocol/openid-connect/userinfo" .Values.cluster.name | quote }}
              login_attribute_path: preferred_username
              groups_attribute_path: "contains(groups[*], 'grafana-admin') && 'Admin' || 'Viewer'"
          extraSecretMounts:
            - name: oidc-secret
              secretName: grafana-oidc-secret
              mountPath: /etc/secrets/oidc
              readOnly: true
          {{- end }}
          dashboards:
          {{- $dashboards := deepCopy (.Values.monitoring.grafana.dashboards | default dict) }}
          {{- $defaultDashboards := get $dashboards "default" | default dict }}
          {{- range .Values.monitoring.grafana.dashboardFiles }}
          {{- $_ := set $defaultDashboards .name (dict "json" ($.Files.Get .path)) }}
          {{- end }}
          {{- $_ := set $dashboards "default" $defaultDashboards }}
{{ toYaml $dashboards | indent 12 }}
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      ref: values
{{- end }}
