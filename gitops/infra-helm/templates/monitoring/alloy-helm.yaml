{{- define "app.alloy" }}
name: alloy
partOf: monitoring
# kube-prometheus-stack is the sole owner/creator of monitoring namespace metadata.
namespace: monitoring
# Monitoring service after the monitoring namespace foundation.
wave: 1
project: platform
cascadeDelete: true
sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    version: {{ .Values.monitoring.alloy.version | quote }}
    helm:
      releaseName: alloy
      valueFiles:
        - $values/gitops/infra-custom/monitoring/alloy-values.yaml
{{ end }}
{{- if .Values.monitoring.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.alloy" . | fromYaml)) }}
{{- end }}
