{{- if .Values.zigbee2mqtt.httpRoute.enabled }}
{{- if or .Values.zigbee2mqtt.ingress.auth.enabled .Values.zigbee2mqtt.ingress.whitelistSourceRange }}
{{- fail "zigbee2mqtt.httpRoute.enabled=true cannot enforce zigbee2mqtt.ingress.auth.enabled or zigbee2mqtt.ingress.whitelistSourceRange; set zigbee2mqtt.httpRoute.enabled=false to use them" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - {{ .Values.zigbee2mqtt.httpRoute.host | default .Values.zigbee2mqtt.ingress.host | quote }}
  rules:
    # 0s disables Envoy's default 15s route timeout, which would cut the
    # frontend's /api websocket.
    - timeouts:
        request: 0s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.zigbee2mqtt.service.name }}
          port: {{ .Values.zigbee2mqtt.service.port }}
{{- end }}
