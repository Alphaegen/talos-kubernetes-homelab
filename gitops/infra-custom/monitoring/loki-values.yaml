deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 40Gi
    enableStatefulSetAutoDeletePVC: true
    enableStatefulSetRecreationForSizeChange: true
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests: {cpu: 200m, memory: 384Mi}
    limits: {cpu: "1", memory: 1536Mi}
simpleScalable: {replicas: 0, backend: {replicas: 0}, read: {replicas: 0}, write: {replicas: 0}}
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  limits_config: {retention_period: 168h}
  compactor: {retention_enabled: true, delete_request_store: filesystem, working_directory: /var/loki/compactor}
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_tsdb_index_, period: 24h}
gateway:
  enabled: true
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}
  # Access logs for every push would otherwise be shipped back into Loki.
  verboseLogging: false
lokiCanary:
  resources:
    requests: {cpu: 5m, memory: 48Mi}
    limits: {memory: 112Mi}
# Rules sidecar (loki-sc-rules).
sidecar:
  resources:
    requests: {cpu: 5m, memory: 112Mi}
    limits: {memory: 224Mi}
# Helm test pod only; not used by Argo CD.
test: {enabled: false}
monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    labels: {release: kube-prometheus-stack}
  rules:
    enabled: true
    labels: {release: kube-prometheus-stack}
    configs:
      # Single Raspberry Pi instance: alert on sustained slowness, not on
      # the occasional long query.
      LokiRequestLatency: {severity: warning, threshold: 5}
      # SingleBinary runs exactly one compactor.
      LokiTooManyCompactorsRunning: {enabled: false}
