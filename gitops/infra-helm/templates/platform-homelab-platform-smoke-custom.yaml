{{- define "app.platform-smoke" }}
name: platform-smoke
appLabel: homelab-platform-smoke
# The source contains and owns the Namespace manifest.
namespace: {{ .Values.platformSmoke.namespace | default "homelab-platform" | quote }}
# Validation workload after bootstrap foundations.
wave: 2
project: apps
cascadeDelete: true
sources:
  {{- if .Values.platformSmoke.rollout.enabled }}
  - path: gitops/infra-custom/platform/homelab-platform-smoke-rollout
  {{- else }}
  - path: gitops/infra-custom/platform/homelab-platform-smoke
  {{- end }}
{{ end }}
{{- if .Values.platformSmoke.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.platform-smoke" . | fromYaml)) }}
{{- end }}
