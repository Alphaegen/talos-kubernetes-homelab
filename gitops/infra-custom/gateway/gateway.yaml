apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cilium-gateway
    app.kubernetes.io/part-of: cilium-gateway-api
  annotations:
    # Shared ingress path: removing this file from Git must never delete it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  gatewayClassName: cilium-ipv4
  infrastructure:
    annotations:
      metallb.io/address-pool: servers
      metallb.io/loadBalancerIPs: 192.168.20.112
  listeners:
    # Plain HTTP only serves the HTTPS redirect route in this namespace.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.homelab.niekvlam.nl"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.homelab.niekvlam.nl"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: homelab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
