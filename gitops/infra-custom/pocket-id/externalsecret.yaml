apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pocket-id
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  data:
    # Encrypts private keys and other sensitive rows in the database. Losing it
    # makes the database unreadable, so it lives in 1Password, not only here.
    - secretKey: encryption-key
      remoteRef:
        key: pocket-id/encryption-key
