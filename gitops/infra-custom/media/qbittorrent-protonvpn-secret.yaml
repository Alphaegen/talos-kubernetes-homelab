apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-protonvpn
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: qbittorrent-protonvpn
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: media/protonvpn-wireguard-private-key
