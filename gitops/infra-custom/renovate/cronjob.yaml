apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/part-of: homelab
spec:
  schedule: "0 6 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
            app.kubernetes.io/part-of: homelab
        spec:
          serviceAccountName: renovate
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44.173.1@sha256:047258466c0bbc5c6e8adfc1ae25bdcef5f8781ba90f7e12904af6656e35e59f
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_REPOSITORIES
                  value: Alphaegen/talos-kubernetes-homelab
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: required
                - name: NODE_OPTIONS
                  value: --max-old-space-size=1536
                - name: LOG_LEVEL
                  value: info
              envFrom:
                - secretRef:
                    name: renovate-github
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: work
                  mountPath: /tmp/renovate
          volumes:
            - name: work
              emptyDir: {}
