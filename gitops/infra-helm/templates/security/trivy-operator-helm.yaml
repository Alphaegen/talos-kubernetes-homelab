{{- define "app.trivy-operator" }}
name: trivy-operator
namespace: trivy-system
# Optional platform add-on after monitoring CRDs.
wave: 1
project: platform
createNamespace: true
cascadeDelete: true
sources:
  - repoURL: https://aquasecurity.github.io/helm-charts
    chart: trivy-operator
    version: {{ .Values.security.trivy.version | quote }}
    helm:
      releaseName: trivy-operator
      valueFiles:
        - $values/gitops/infra-custom/trivy-operator/upstream-values.yaml
{{ end }}
{{- if and .Values.security.enabled .Values.security.trivy.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.trivy-operator" . | fromYaml)) }}
{{- end }}
