# Shared script for the indexer-backoff-reset sidecar in Prowlarr, Sonarr and
# Radarr. Each app backs off from a failing indexer for longer every time (up to
# 24h) and only a successful indexer test clears that. The sidecar reads the
# app's own API key from config.xml, so no extra secret is needed. When an
# indexer is in backoff it runs "test all"; a test that passes resets the
# backoff, one that fails changes nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: indexer-backoff-reset
  namespace: media
data:
  reset.sh: |
    #!/bin/sh
    # Env: APP_PORT, API_VERSION (v1 for Prowlarr, v3 for Sonarr/Radarr),
    # INTERVAL_SECONDS. The app's config is mounted read-only at /app-config.
    set -u
    api="http://localhost:${APP_PORT}/api/${API_VERSION}"
    sleep 300
    while true; do
      key=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /app-config/config.xml)
      if status=$(curl -fsS -m 30 -H "X-Api-Key: ${key}" "${api}/indexerstatus"); then
        case "$status" in
          *disabledTill*)
            echo "$(date -u +%FT%TZ) indexer in backoff, testing all indexers"
            curl -sS -m 600 -o /dev/null -w "$(date -u +%FT%TZ) testall http=%{http_code}\n" \
              -X POST -H "X-Api-Key: ${key}" "${api}/indexer/testall" || true
            ;;
        esac
      else
        echo "$(date -u +%FT%TZ) could not read indexer status"
      fi
      sleep "${INTERVAL_SECONDS}"
    done
