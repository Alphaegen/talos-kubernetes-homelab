apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: stale
  namespace: kyverno
spec:
  properties:
    reason: A test case for scripts/validate.sh.
  policyRefs:
    - name: pss-restricted-seccomp
      kind: ValidatingPolicy
  matchConditions:
    - name: stale
      expression: >-
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'something-else'
