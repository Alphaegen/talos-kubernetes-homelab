# Clears an *arr app's indexer backoff once the indexer works again (reset.sh).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The name hash rolls the apps when the script changes.
configMapGenerator:
  - name: indexer-backoff-reset
    namespace: media
    files:
      - reset.sh

patches:
  - path: sidecar.yaml
    target:
      kind: Deployment
      labelSelector: homelab.niekvlam.nl/indexer-backoff-reset=true
