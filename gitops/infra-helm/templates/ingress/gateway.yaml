{{- define "app.gateway" }}
name: gateway
appLabel: cilium-gateway
partOf: cilium-gateway-api
namespace: kube-system
# Consumes Cilium Gateway API and wave-0 cert-manager.
wave: 1
project: platform
# No cascadeDelete: deleting this Application must not cascade-delete the
# shared Gateway (and with it every HTTPRoute ingress path).
sources:
  - path: gitops/infra-custom/gateway
{{ end }}
{{- if .Values.gateway.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.gateway" . | fromYaml)) }}
{{- end }}
