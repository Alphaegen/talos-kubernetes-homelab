global:
  domain: argocd.homelab.niekvlam.nl
  image:
    tag: v3.2.12

redis-ha:
  enabled: true

configs:
  params:
    server.insecure: true
    # Keep a recursive/full-tree sync from reconciling every workload at once.
    # The controller exceeded its 1 GiB limit while processing 15 concurrent
    # operations, then repeatedly OOM-killed while resuming the same queue.
    controller.status.processors: 10
    controller.operation.processors: 3
    controller.kubectl.parallelism.limit: 10
    # Back off aggressively when a live resource cannot converge. This keeps an
    # immutable-field error from turning into hundreds of writes and pod churn.
    controller.self.heal.backoff.timeout.seconds: 30
    controller.self.heal.backoff.factor: 2
    controller.self.heal.backoff.cap.seconds: 1800
    controller.sync.timeout.seconds: 900

server:
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      cert-manager.io/cluster-issuer: "letsencrypt-dns"
    extraTls:
      - hosts: [ "argocd.homelab.niekvlam.nl" ]
        secretName: argocd-tls
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 2Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - rpi-w-2
                  - rpi-w-3
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

applicationSet:
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack
