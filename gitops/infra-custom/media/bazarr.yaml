apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector: { matchLabels: { app: bazarr } }
  template:
    metadata:
      labels: { app: bazarr, app.kubernetes.io/name: bazarr }
    spec:
      priorityClassName: homelab-best-effort
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:v1.6.2-ls366
          # s6-overlay starts as root, fixes ownership, then drops to PUID/PGID.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          resources:
            requests:
              cpu: 50m
              memory: 240Mi
            limits:
              cpu: "1"
              memory: 512Mi
          ports: [{ name: http, containerPort: 6767 }]
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: UMASK, value: "002" }
            - { name: TZ, value: "Europe/Amsterdam" }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: media-shared } }
        - { name: config, persistentVolumeClaim: { claimName: bazarr-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: media
spec:
  selector: { app: bazarr }
  ports:
    - { name: http, port: 6767, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: media
spec:
  parentRefs:
    # Shared Cilium Gateway HTTPS listener (wildcard cert); port 80 only redirects.
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames: ["bazarr.homelab.niekvlam.nl"]
  rules:
    # 0s disables Envoy's default 15s route timeout; Socket.IO long-polls last 25s.
    - timeouts: { request: 0s }
      matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: bazarr, port: 6767 }
