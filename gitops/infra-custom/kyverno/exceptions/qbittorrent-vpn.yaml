# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/policies.kyverno.io/policyexception_v1.json
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: qbittorrent-vpn
  namespace: kyverno
spec:
  properties:
    reason: >-
      The gluetun VPN sidecar creates a WireGuard tunnel, which needs root,
      NET_ADMIN and the /dev/net/tun device from the host, whatever image
      qBittorrent itself uses (its s6-overlay start is linuxserver-root's).
  policyRefs:
    - name: pss-baseline
      kind: ValidatingPolicy
    - name: pss-restricted-volume-types
      kind: ValidatingPolicy
    - name: pss-restricted-capabilities
      kind: ValidatingPolicy
    - name: pss-restricted-run-as-non-root
      kind: ValidatingPolicy
  # Since Kyverno 1.20 a controller's object has the pod spec in place of
  # its own, so the name label must be on the controller's metadata as well.
  matchConditions:
    - name: qbittorrent-vpn
      expression: >-
        object.metadata.namespace == 'media' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'qbittorrent'
