apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metallb-speaker
  namespace: metallb-system
  labels:
    app.kubernetes.io/component: speaker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: speaker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: speaker
    spec:
      hostNetwork: true
      containers:
        - name: speaker
          image: quay.io/metallb/speaker:v0.15.2
---
apiVersion: v1
kind: Pod
metadata:
  name: metallb-speaker-pod
  namespace: metallb-system
  labels:
    app.kubernetes.io/component: speaker
spec:
  hostNetwork: true
  containers:
    - name: speaker
      image: quay.io/metallb/speaker:v0.15.2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metallb-controller-host-network
  namespace: metallb-system
  labels:
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
    spec:
      hostNetwork: true
      containers:
        - name: controller
          image: quay.io/metallb/controller:v0.15.2
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-privileged
  namespace: longhorn-system
spec:
  containers:
    - name: manager
      image: longhornio/longhorn-manager:v1.9.1
      securityContext:
        privileged: true
