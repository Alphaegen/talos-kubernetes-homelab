# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
{{- if .Values.monitoring.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "grafana") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: grafana
  namespace: {{ .Values.cluster.namespace | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    app.kubernetes.io/part-of: monitoring
    {{- if .Values.notifications }}
    {{ toYaml .Values.notifications | indent 4 }}
    {{- end }}
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: monitoring
  syncPolicy:
    {{- if .Values.sync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: {{ .Values.monitoring.grafana.version | quote }}
    helm:
      releaseName: grafana
      values: |-
        replicas: {{ .Values.monitoring.grafana.replicas | default 1 }}

        {{- with .Values.monitoring.grafana.deploymentStrategy }}
        deploymentStrategy:
{{ toYaml . | indent 10 }}
        {{- end }}

        # Expose Grafana metrics so Prometheus can scrape them
        grafana.ini:
          metrics:
            enabled: true

        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
          interval: 30s

        resources:
{{ toYaml .Values.monitoring.grafana.resources | indent 10 }}

        downloadDashboards:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

        # The chart's generated download script masks curl failures in sed pipelines.
        # Retry if that leaves an empty dashboard and fail startup rather than loading it.
        extraInitContainers:
          - name: validate-downloaded-dashboards
            image: docker.io/curlimages/curl:8.9.1
            command: ["/bin/sh", "-ec"]
            args:
              - |
                dashboard_files="$(sed -n 's/^> "\(.*\)"$/\1/p' /etc/grafana/download_dashboards.sh)"
                downloads_are_valid() {
                  for dashboard_file in $dashboard_files; do
                    if [ ! -s "$dashboard_file" ]; then
                      echo "Downloaded dashboard is empty: $dashboard_file" >&2
                      return 1
                    fi
                  done
                }

                attempt=1
                until downloads_are_valid; do
                  if [ "$attempt" -gt 5 ]; then
                    echo "Dashboard download remained empty after five retries" >&2
                    exit 1
                  fi
                  echo "Retrying empty dashboard download (attempt $attempt/5)"
                  /bin/sh /etc/grafana/download_dashboards.sh
                  attempt=$((attempt + 1))
                  sleep 5
                done
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            volumeMounts:
              - name: config
                mountPath: /etc/grafana/download_dashboards.sh
                subPath: download_dashboards.sh
              - name: storage
                mountPath: /var/lib/grafana

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                allowUiUpdates: true
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default

        # Sidecars to load dashboards & datasources into Grafana
        sidecar:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          dashboards:
            enabled: true
            skipReload: true
            labelValue: "1"
            searchNamespace: ALL
            label: grafana_dashboard
            env:
              HEALTH_PORT: "8084"
          datasources:
            enabled: true
            skipReload: true
            env:
              HEALTH_PORT: "8082"

        # Your existing settings
        ingress:
{{ toYaml .Values.monitoring.grafana.ingress | indent 10 }}
{{- with .Values.monitoring.grafana.persistence }}
        persistence:
{{ toYaml . | indent 10 }}
{{- end }}
        datasources:
{{ toYaml .Values.monitoring.grafana.datasources | indent 10 }}
        dashboards:
{{- $dashboards := deepCopy (.Values.monitoring.grafana.dashboards | default dict) }}
{{- $defaultDashboards := get $dashboards "default" | default dict }}
{{- range .Values.monitoring.grafana.dashboardFiles }}
{{- $_ := set $defaultDashboards .name (dict "json" ($.Files.Get .path)) }}
{{- end }}
{{- $_ := set $dashboards "default" $defaultDashboards }}
{{ toYaml $dashboards | indent 10 }}
{{- end }}
