{{- define "app.tailscale" }}
name: tailscale
namespace: tailscale
# The credential ExternalSecret is owned by the wave-0 External Secrets
# Application. The operator and Connector stay together here.
wave: 1
project: platform
createNamespace: true
namespaceLabels:
  # Connector proxies need privileged init/container settings for forwarding.
  pod-security.kubernetes.io/enforce: privileged
  pod-security.kubernetes.io/warn: privileged
  pod-security.kubernetes.io/audit: privileged
sources:
  - repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    version: {{ .Values.security.tailscale.version | quote }}
    helm:
      releaseName: tailscale-operator
      values: |
        operatorConfig:
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
          # State lives in the operator Secret; tsnet only keeps logs and a
          # netmap cache under $HOME/.config, so point HOME at the writable /tmp.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          extraEnv:
            - {name: HOME, value: /tmp}
          podLabels:
            app.kubernetes.io/name: tailscale-operator
  - path: gitops/infra-custom/tailscale
    helm:
      releaseName: tailscale-custom
      valueFiles:
        - values.yaml
{{ end }}
{{- if and .Values.security.enabled .Values.security.tailscale.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.tailscale" . | fromYaml)) }}
{{- end }}
