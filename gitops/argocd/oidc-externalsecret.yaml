apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
          # Argo CD only resolves $<secret>:<key> references in argocd-cm
          # against Secrets carrying this label.
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: client-id
      remoteRef:
        key: argocd-oidc/client-id
    - secretKey: client-secret
      remoteRef:
        key: argocd-oidc/client-secret
    - secretKey: cli-client-id
      remoteRef:
        key: argocd-oidc/cli-client-id
