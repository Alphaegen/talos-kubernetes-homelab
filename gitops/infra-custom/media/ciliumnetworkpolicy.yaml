---
# Only the Web UI/API. Peers reach qBittorrent through the WireGuard tunnel,
# whose packets are replies to Gluetun's own egress, and Gluetun's firewall
# drops anything else outside the tunnel.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [radarr, sonarr]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# The FlareSolverr-compatible endpoint (Services trawl and flaresolverr) for
# Prowlarr's Cloudflare-protected indexers. No UI.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trawl
  namespace: media
  labels:
    app.kubernetes.io/name: trawl
    app.kubernetes.io/part-of: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trawl
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "8191"
              protocol: TCP
---
