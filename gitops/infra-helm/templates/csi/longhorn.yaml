# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
{{- if .Values.longhorn.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "infra.appName" (dict "root" . "name" "longhorn") }}
  labels:
    cluster: {{ .Values.cluster.name | quote }}
    app: longhorn
  namespace: {{ .Values.cluster.namespace | quote }}
  annotations:
    # Stage 0: storage provider and its CRD-backed configuration.
    argocd.argoproj.io/sync-wave: "0"
    app.kubernetes.io/part-of: longhorn
    {{- if .Values.notifications }}
    {{ toYaml .Values.notifications | indent 4 }}
    {{- end }}
spec:
  project: {{ include "infra.projectName" . }}
  destination:
    server: {{ .Values.cluster.url | default "https://kubernetes.default.svc" | quote }}
    namespace: longhorn-system
  syncPolicy:
    {{- if .Values.sync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - FailOnSharedResource=true
      - CreateNamespace=true
      # The bundled ServiceMonitor/PrometheusRule can be encountered while the
      # monitoring Application is still establishing its CRDs.
      - SkipDryRunOnMissingResource=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/audit: privileged
  # Deliberately no resources finalizer: deleting the Application must not
  # cascade into the storage control plane or its stateful resources.
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: {{ .Values.longhorn.version | quote }}
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/gitops/infra-custom/longhorn/values.yaml
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      path: gitops/infra-custom/longhorn
    - repoURL: {{ .Values.cluster.repoURL | quote }}
      targetRevision: {{ .Values.cluster.revision | default "main" | quote }}
      ref: values
{{- end }}
