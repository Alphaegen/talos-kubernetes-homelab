{{- define "app.tailscale" }}
name: tailscale
namespace: tailscale
# The credential ExternalSecret is owned by the wave-0 External Secrets
# Application. The operator and Connector stay together here.
wave: 1
project: platform
createNamespace: true
namespaceLabels:
  # Connector proxies need privileged init/container settings for forwarding.
  pod-security.kubernetes.io/enforce: privileged
  pod-security.kubernetes.io/warn: privileged
  pod-security.kubernetes.io/audit: privileged
sources:
  - repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    version: {{ .Values.security.tailscale.version | quote }}
    helm:
      releaseName: tailscale-operator
      valueFiles:
        - $values/gitops/infra-custom/tailscale/upstream-values.yaml
  - path: gitops/infra-custom/tailscale
    helm:
      releaseName: tailscale-custom
      valueFiles:
        - values.yaml
{{ end }}
{{- if and .Values.security.enabled .Values.security.tailscale.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.tailscale" . | fromYaml)) }}
{{- end }}
