{{- define "app.cert-manager-helm" }}
name: cert-manager-helm
appLabel: cert-manager
partOf: cert-manager
namespace: cert-manager
# API providers and other bootstrap foundations.
wave: 0
project: platform
createNamespace: true
namespaceLabels:
  # Same as the Talos cluster default, stated so it survives a relabel.
  pod-security.kubernetes.io/enforce: baseline
  pod-security.kubernetes.io/warn: restricted
  pod-security.kubernetes.io/audit: restricted
# Keep the controller/CRDs and the ClusterIssuer in one Application so Argo
# CD can order the CRD before the custom resource during a single sync. The
# ServiceMonitor may be discovered before the monitoring CRDs finish their
# independently automated first sync; the shared retry policy re-attempts it.
sources:
  - repoURL: https://charts.jetstack.io
    chart: cert-manager
    version: {{ .Values.certmanager.version | quote }}
    helm:
      version: v3
      releaseName: cert-manager
      valueFiles:
        - $values/gitops/infra-custom/cert-manager/upstream-values.yaml
  - path: gitops/infra-custom/cert-manager
    helm:
      version: v3
      releaseName: cert-manager-custom
      valueFiles:
        - values.yaml
{{ end }}
{{- if .Values.certmanager.enabled }}
{{ include "infra.application" (dict "root" . "app" (include "app.cert-manager-helm" . | fromYaml)) }}
{{- end }}
