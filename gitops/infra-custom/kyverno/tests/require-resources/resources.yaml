apiVersion: v1
kind: Pod
metadata:
  name: requests-and-memory-limit
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: requests-and-limits
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: no-resources
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-memory-limit
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-cpu-request
  namespace: test
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: init-container-without-resources
  namespace: test
spec:
  initContainers:
    - name: init
      image: ghcr.io/example/init:1.2.3
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-memory-limit-deployment
  namespace: test
spec:
  selector:
    matchLabels:
      app: missing-memory-limit-deployment
  template:
    metadata:
      labels:
        app: missing-memory-limit-deployment
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:1.2.3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
